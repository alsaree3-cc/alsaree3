    <style>
        body { background-color: #e2e8f0; color: #000000; font-family: 'Cairo', sans-serif; min-height: 100vh; padding: 24px; }
        .system-container { background-color: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 32px; padding: 32px; box-shadow: inset 0 2px 4px 0 rgba(255, 255, 255, 0.5), 0 20px 25px -5px rgba(0, 0, 0, 0.05); }
        .card-box { background-color: #ffffff; border: 1px solid #cbd5e1; padding: 24px; border-radius: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02); transition: all 0.3s; text-align: left; direction: ltr; }
        .card-box.attendance-active { background-color: #f0fdf4; border-color: #86efac; }
        .card-box:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08); border-color: #22c55e; }
        .card-box.break-active { background-color: #fef2f2; border-color: #fca5a5; }
        .card-box.rest-active { background-color: #fff7ed; border-color: #fdba74; }
        .card-box.rest-active .timer-text { color: #ea580c !important; }
        .card-box.off-active { background-color: #eff6ff; border-color: #bfdbfe; }
        /* شريط الشعار أعلى بطاقة الموظف (نفس ستايل Alsaree3 Admin Panel) */
        .card-box > .emp-brand { display: flex; align-items: center; gap: 10px; background: #103d42; margin: -24px -24px 18px; padding: 12px 18px; border-radius: 22px 22px 0 0; direction: ltr; }
        .card-box > .emp-brand .adm-logo { width: 40px; height: 40px; }
        .btn-opt { background: #ffffff; color: #000000; font-size: 0.95rem; padding: 12px; border-radius: 14px; font-weight: 700; width: 100%; border: 1px solid #cbd5e1; cursor: pointer; transition: background 0.2s; }
        .btn-opt:hover { border-color: #22c55e; }
        /* أزرار الطلبات المصغّرة */
        .tk-row { display:flex; gap:8px; margin-bottom:12px; }
        .tk-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:7px 10px; border-radius:12px; font-size:0.82rem; font-weight:800; line-height:1.2; border:1px solid transparent; cursor:pointer; font-family:inherit; transition:transform .12s, background .15s, opacity .15s; }
        .tk-btn:active { transform:scale(.96); }
        .tk-btn.busy { opacity:.55; pointer-events:none; }
        .tk-in { background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }
        .tk-in:hover { background:#dbeafe; }
        .tk-ok { background:#f0fdf4; color:#15803d; border-color:#bbf7d0; }
        .tk-ok:hover { background:#dcfce7; }
        .tk-ok:disabled { background:#f1f5f9; color:#94a3b8; border-color:#e2e8f0; cursor:not-allowed; transform:none; }
        .tk-badge { background:#16a34a; color:#fff; border-radius:999px; min-width:18px; padding:0 6px; font-size:0.7rem; font-weight:900; }
        .tk-input { flex:1; min-width:0; padding:7px 10px; border-radius:12px; border:1px solid #cbd5e1; background:#fff; font-family:inherit; font-size:0.85rem; font-weight:700; color:#0f172a; direction:ltr; text-align:center; }
        .tk-input:focus { outline:none; border-color:#f59e0b; box-shadow:0 0 0 2px #fde68a; }
        .tk-small { flex:none; display:inline-flex; padding:4px 12px; font-size:0.74rem; border-radius:10px; }
        .tk-wa { background:#ecfdf5; color:#047857; border-color:#a7f3d0; }
        .tk-wa:hover { background:#d1fae5; }
        .tk-dd { position:relative; margin:0 0 8px; direction:rtl; }
        .tk-dd-btn { width:100%; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 12px; border-radius:12px; border:1px solid #cbd5e1; background:#fff; font-family:inherit; font-size:0.85rem; font-weight:700; color:#0f172a; cursor:pointer; text-align:right; }
        .tk-dd-btn.empty { color:#94a3b8; }
        .tk-dd-btn.open { border-color:#f59e0b; box-shadow:0 0 0 2px #fde68a; }
        .tk-dd-list { display:none; flex-direction:column; margin-top:4px; border:1px solid #cbd5e1; border-radius:12px; background:#fff; overflow:hidden; box-shadow:0 8px 20px rgba(0,0,0,.12); max-height:240px; overflow-y:auto; }
        .tk-dd-item { padding:9px 12px; border:none; border-bottom:1px solid #f1f5f9; background:#fff; font-family:inherit; font-size:0.84rem; font-weight:700; color:#334155; text-align:right; cursor:pointer; }
        .tk-dd-item:last-child { border-bottom:none; }
        .tk-dd-item:hover { background:#fffbeb; }
        .tk-dd-item.sel { background:#fef2f2; color:#b91c1c; font-weight:900; }
        .tk-dd-item.other { color:#2563eb; }
        .tk-stat { text-align:center; font-size:0.72rem; font-weight:800; color:#64748b; margin:-4px 0 12px; }
        .task-btn { background: #ffffff; border: 1px solid #cbd5e1; color: #000000; padding: 12px 8px; border-radius: 14px; font-size: 0.9rem; font-weight: 700; width: 100%; cursor: pointer; transition: all 0.2s; }
        .task-btn:hover { border-color: #22c55e; }
        .task-btn.active { background: #22c55e; color: #ffffff !important; border-color: #22c55e; }
        .admin-panel { background-color: #ffffff; border: 1px solid #cbd5e1; padding: 30px; border-radius: 24px; margin-top: 25px; text-align: right; direction: rtl; }
        details.oc > summary { list-style: none; cursor: pointer; }
        details.oc > summary::-webkit-details-marker { display: none; }
        details.oc .chev { display: inline-block; transition: transform .15s; font-size: 0.8rem; }
        details.oc[open] .chev { transform: rotate(180deg); }
        .timer-text { color: #16a34a !important; font-weight: 900; font-size: 1.2rem; margin-left: 10px; }
        .card-box.break-active .timer-text { color: #dc2626 !important; }

        /* شاشة تسجيل الدخول */
        #login-screen { position:fixed; inset:0; flex-direction:column; background:linear-gradient(135deg,#dcfce7 0%,#bbf7d0 50%,#86efac 100%); display:flex; align-items:center; justify-content:center; z-index:9999; font-family:'Cairo',sans-serif; }
        .login-card { background:#ffffff; border-radius:32px; padding:40px 36px; box-shadow:0 25px 50px rgba(0,0,0,0.12); width:100%; max-width:420px; border:1px solid #bbf7d0; }
        .login-select { width:100%; padding:14px 16px; border-radius:16px; border:2px solid #d1fae5; font-family:'Cairo',sans-serif; font-size:1rem; font-weight:700; background:#f0fdf4; color:#000; cursor:pointer; outline:none; transition:border 0.2s; direction:rtl; }
        .login-select:focus { border-color:#22c55e; }
        .pin-input { width:100%; padding:14px 16px; border-radius:16px; border:2px solid #d1fae5; font-family:'Cairo',sans-serif; font-size:1.4rem; font-weight:900; background:#f0fdf4; color:#000; letter-spacing:8px; text-align:center; outline:none; transition:border 0.2s; }
        .pin-input:focus { border-color:#22c55e; }
        .login-btn { width:100%; padding:16px; border-radius:18px; background:#22c55e; color:#fff; font-family:'Cairo',sans-serif; font-size:1.1rem; font-weight:900; border:none; cursor:pointer; transition:background 0.2s; }
        .login-btn:hover { background:#16a34a; }
        .login-btn:disabled { background:#86efac; cursor:not-allowed; }
        .error-msg { color:#dc2626; font-weight:700; font-size:0.9rem; text-align:center; min-height:22px; }
        .my-card-highlight { border:3px solid #22c55e !important; box-shadow:0 0 0 6px #bbf7d030 !important; }
        /* بطاقة المطوّر: مربعة ومرتبة، يتناوب تمييز أقسامها كل 5 ثوانٍ (دورة 15 ثانية) */
        body { padding-bottom: 64px; }
        .dev-card { width:min(92vw,300px); box-sizing:border-box; padding:14px; border-radius:22px; direction:ltr; text-align:left; font-family:'Cairo',sans-serif; color:#ecfdf5; background:linear-gradient(145deg,#0b2f33 0%,#103d42 55%,#16626a 100%); border:1px solid rgba(190,242,100,.35); box-shadow:0 14px 30px rgba(16,61,66,.30), inset 0 1px 0 rgba(255,255,255,.10); }
        .dev-card.in-login { margin-top:18px; flex:none; }
        .dev-card.fixed-bl { position:fixed; left:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:90; width:262px; }
        .dev-card .dc-head { display:flex; align-items:center; gap:10px; padding:8px; border-radius:16px; border:1px solid transparent; }
        .dev-card .dc-av { width:42px; height:42px; flex:none; border-radius:14px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:1rem; color:#0f172a; background:linear-gradient(135deg,#d9f99d,#a3e635); box-shadow:0 4px 10px rgba(163,230,53,.35); }
        .dev-card .dc-role { font-size:.66rem; font-weight:800; letter-spacing:.6px; color:#86efac; text-transform:uppercase; }
        .dev-card .dc-name { font-size:1rem; font-weight:900; color:#fff; line-height:1.25; }
        .dev-card .dc-min { margin-left:auto; flex:none; width:26px; height:26px; border-radius:8px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08); color:#ecfdf5; font-weight:900; line-height:1; cursor:pointer; font-family:inherit; }
        .dev-card .dc-min:hover { background:rgba(255,255,255,.18); }
        .dev-card .dc-rows { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
        .dev-card .dc-row { --ib:rgba(255,255,255,.06); --ibd:rgba(255,255,255,.08); display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); }
        .dev-card .dc-ic { width:34px; height:34px; flex:none; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:1rem; background:rgba(217,249,157,.14); }
        .dev-card .dc-lb { font-size:.66rem; font-weight:800; color:#a7f3d0; line-height:1.1; }
        .dev-card .dc-val { font-size:.86rem; font-weight:900; color:#fff; direction:ltr; word-break:break-all; line-height:1.3; }
        /* ظهور/اختفاء: تظهر بحركة جاذبة ~10 ثوانٍ ثم تختفي 15 ثانية وتعود */
        .dev-card { position:relative; overflow:hidden; opacity:0; transform:translateY(46px) scale(.82); pointer-events:none; }
        .dev-card.fixed-bl { position:fixed; }
        .dev-card::after { content:''; position:absolute; top:0; bottom:0; left:-60%; width:45%; transform:skewX(-20deg); background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent); opacity:0; pointer-events:none; }
        .dev-card.in { pointer-events:auto; animation:dcIn .9s cubic-bezier(.2,.9,.3,1.25) forwards, dcFloat 3.2s ease-in-out .9s infinite; }
        .dev-card.in::after { animation:dcShine 1.4s ease-out .5s 1 both, dcShine 1.4s ease-out 5s 1 both; }
        .dev-card.out { animation:dcOut .6s ease-in forwards; pointer-events:none; }
        .dev-card.in .dc-glow { animation:dcGlowOnce 2.6s ease-in-out .8s 1 both; }
        .dev-card.in .dc-glow.dc-d1 { animation-delay:3.4s; }
        .dev-card.in .dc-glow.dc-d2 { animation-delay:6s; }
        .dev-card.in .dc-av { animation:dcPulse 1.6s ease-in-out .9s 3; }
        @keyframes dcIn { 0% { opacity:0; transform:translateY(46px) scale(.82) rotate(-3deg); } 60% { opacity:1; transform:translateY(-10px) scale(1.05) rotate(1deg); } 100% { opacity:1; transform:translateY(0) scale(1) rotate(0); } }
        @keyframes dcFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-5px); } }
        @keyframes dcOut { 0% { opacity:1; transform:translateY(0) scale(1); } 100% { opacity:0; transform:translateY(40px) scale(.85); } }
        @keyframes dcShine { 0% { left:-60%; opacity:1; } 100% { left:130%; opacity:1; } }
        @keyframes dcPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.12) rotate(-4deg); } }
        @keyframes dcGlowOnce { 0%,100% { background-color:var(--ib,transparent); border-color:var(--ibd,transparent); box-shadow:none; } 15%,85% { background-color:rgba(217,249,157,.16); border-color:rgba(217,249,157,.6); box-shadow:0 0 0 3px rgba(217,249,157,.10); } }
        .dev-card.min .dc-rows, .dev-card.min .dc-role { display:none; }
        .dev-card.min { width:auto; padding:8px; border-radius:18px; }
        .dev-card.min .dc-min { transform:rotate(180deg); }
        /* ساعة أعلى اليمين */
        #live-clock { position:fixed; top:14px; right:18px; z-index:100; display:flex; align-items:center; gap:12px; direction:ltr; padding:8px 16px 8px 12px; border-radius:20px; color:#fff; background:linear-gradient(135deg,#103d42 0%,#16626a 100%); border:1px solid rgba(255,255,255,.14); box-shadow:0 8px 22px rgba(16,61,66,.28), inset 0 1px 0 rgba(255,255,255,.12); font-family:'Cairo',sans-serif; user-select:none; pointer-events:none; }
        #live-clock .lc-ic { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(228,255,26,.14); font-size:1.05rem; }
        #live-clock .lc-time { display:flex; align-items:baseline; gap:2px; font-weight:900; font-size:1.55rem; line-height:1; letter-spacing:.5px; font-variant-numeric:tabular-nums; }
        #live-clock .lc-sec { font-size:.85rem; font-weight:800; color:#bef264; margin-left:3px; }
        #live-clock .lc-ap { font-size:.7rem; font-weight:800; color:#0f172a; background:#d9f99d; border-radius:6px; padding:1px 5px; margin-left:6px; align-self:center; }
        #live-clock .lc-colon { animation:lcBlink 1s steps(1) infinite; }
        #live-clock .lc-date { font-size:.72rem; font-weight:700; color:#a7f3d0; margin-top:3px; direction:rtl; text-align:left; white-space:nowrap; }
        @keyframes lcBlink { 50% { opacity:.25; } }
        @media (max-width:640px) { #live-clock { top:auto; bottom:calc(50px + env(safe-area-inset-bottom,0px)); right:10px; padding:6px 12px 6px 8px; gap:8px; } #live-clock .lc-time { font-size:1.2rem; } #live-clock .lc-ic { width:28px; height:28px; font-size:.9rem; } }
        #logout-btn { position:fixed; top:18px; left:18px; z-index:100; background:#fff; border:2px solid #cbd5e1; border-radius:14px; padding:8px 18px; font-family:'Cairo',sans-serif; font-weight:700; font-size:0.9rem; cursor:pointer; color:#374151; transition:all 0.2s; box-shadow:0 2px 8px rgba(0,0,0,0.07); }
        #logout-btn:hover { border-color:#f87171; color:#dc2626; }
        #leave-btn { position:fixed; top:18px; left:125px; z-index:100; background:#fff; border:2px solid #86efac; border-radius:14px; padding:8px 18px; font-family:'Cairo',sans-serif; font-weight:700; font-size:0.9rem; cursor:pointer; color:#15803d; box-shadow:0 2px 8px rgba(0,0,0,0.07); }
        #leave-btn:hover { background:#f0fdf4; }
        #ticket-btn { position:fixed; top:62px; left:18px; z-index:100; background:#fff; border:2px solid #c7d2fe; border-radius:14px; padding:8px 18px; font-family:'Cairo',sans-serif; font-weight:700; font-size:0.9rem; cursor:pointer; color:#4338ca; box-shadow:0 2px 8px rgba(0,0,0,0.07); }
        #ticket-btn:hover { background:#eef2ff; }
        #helpdesk-btn { position:fixed; top:62px; left:18px; z-index:100; background:#fff; border:2px solid #fed7aa; border-radius:14px; padding:8px 18px; font-family:'Cairo',sans-serif; font-weight:700; font-size:0.9rem; cursor:pointer; color:#c2410c; box-shadow:0 2px 8px rgba(0,0,0,0.07); }
        #helpdesk-btn:hover { background:#fff7ed; }

        #admin-section:has(> .adm-side) > * { grid-column: 2; min-width: 0; }

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js" integrity="sha384-KX6Y/AMIv9qA8TLCDul2JatZWeyrJVgj3Xu/0r30Nr05xO8md1+wHAgtdsRV9LoE" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        // ===== Supabase: الاتصال (المفتاح publishable مخصص للمتصفح — الحماية الفعلية عبر RLS في قاعدة البيانات) =====
        const SUPABASE_URL = 'https://eygohyybhidlsycblfop.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_6Y3sDrJirAA8O2j2Iugpfg_WUOr8IBm';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
            auth: { persistSession: false, autoRefreshToken: true, detectSessionInUrl: false }
        });
        // الشاشة مشتركة بين الموظفين: لا نحتفظ بجلسة قديمة بعد إعادة تحميل الصفحة

        // ===== إعدادات قواعد العمل الجديدة =====
        const WORK_LOCATION = { lat: 33.293117, lng: 44.433205 };   // موقع العمل
        const WORK_RADIUS_METERS = 100;                   // أقصى مسافة مسموحة لتسجيل الحضور (100 متر)
        // المجموعات: كل مجموعة قائمة بمفاتيح الموظفين (employee_key). الموظفون غير المذكورين يُعتبرون في مجموعة واحدة مشتركة.
        // ===== خصم التأخير عن بداية الدوام =====
        // مفتاح الموظف أو جزء من اسمه (عربي/إنجليزي) => وقت بداية الدوام
        const SHIFT_RULES = [
            // off = يوم الأوف الأسبوعي (0=الأحد 1=الاثنين 2=الثلاثاء 3=الأربعاء 4=الخميس 5=الجمعة 6=السبت)
            { match: /نور|nour|noor/i,                    start: '11:00', off: 0 },
            { match: /فاروق|farouk|farouq|farooq|faruq|faroq/i,       start: '11:00', off: 2 },
            { match: /هبه|hiba|heba|hebah/i,             start: '10:00', off: 5 },
            { match: /احمد|ahmed|ahmad/i,                start: '07:30', off: 6 }
        ];
        let LATE_GRACE_MIN = 5;         // سماحية بالدقائق بعد بداية الدوام
        let LATE_BASE_POINTS = 5;       // الخصم الأساسي عند تجاوز السماحية
        let LATE_EXTRA_POINTS = 3;      // خصم إضافي لكل خطوة تأخير إضافية
        let LATE_EXTRA_STEP_MIN = 5;    // طول الخطوة بالدقائق
        let LATE_MAX_POINTS = 30;       // أقصى خصم للتأخير في اليوم
        function _normAr(s) { return String(s || '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه'); }
        function _ruleFor(id) {
            const hay = _normAr(id) + ' ' + _normAr((employeesData[id] || {}).name);
            return SHIFT_RULES.find(x => x.match.test(hay)) || null;
        }
        function getShiftStart(id) {
            const m = _empMeta[id];
            if (m && m.shift) return String(m.shift).slice(0, 5);
            const r = _ruleFor(id); return r ? r.start : null;
        }
        function getOffDay(id) {
            const m = _empMeta[id];
            if (m && m.off !== null && m.off !== undefined) return m.off;   // المحفوظ من لوحة المسؤول (أوقات الدوام) هو المرجع
            const r = _ruleFor(id); return r ? r.off : null;                // وإلا القواعد الثابتة SHIFT_RULES
        }
        function isOffDay(id, dateStr) {
            const od = getOffDay(id); if (od === null || od === undefined) return false;
            const p = String(dateStr).split('-').map(Number); if (p.length < 3) return false;
            return new Date(p[0], p[1] - 1, p[2]).getDay() === od;
        }
        function _startLabel(id, dateStr, st) {
            const v = String(st || '');
            if (!v || v === 'Absent' || v === 'لم يحضر') return isOffDay(id, dateStr) ? 'OFF' : (v ? 'Absent' : '-');
            return v;
        }
        function calcLatePenalty(id, now) {
            const st = getShiftStart(id); if (!st) return null;
            if (isOffDay(id, _ymd(new Date(now)))) return null;   // يوم الأوف: لا خصم أبداً
            const [h, m] = st.split(':').map(Number);
            const sd = new Date(now); sd.setHours(h, m, 0, 0);
            const late = Math.floor((now - sd.getTime()) / 60000);
            if (late <= LATE_GRACE_MIN) return null;
            const pts = Math.min(LATE_MAX_POINTS, LATE_BASE_POINTS + LATE_EXTRA_POINTS * Math.floor((late - LATE_GRACE_MIN) / LATE_EXTRA_STEP_MIN));
            return { late, points: pts, start: st };
        }

        const MAX_BREAK_MINUTES = 15;   // البريك ينتهي تلقائياً بعد هذه المدة (غيّر الرقم أو ضع 0 للتعطيل)
        const MAX_REST_MINUTES = 20;    // الراحة تنتهي تلقائياً بعد هذه المدة (0 للتعطيل)
        let BREAK_SCORE_MAX_PENALTY = 10;      // أقصى خصم متدرج على استهلاك البريك (من 100). من يأخذ بريك أقل يحصل على تقييم أعلى. ضع 0 للتعطيل
        let BREAK_SCORE_ALLOW_PER_HOUR = 5;    // مسموح البريك (دقائق لكل ساعة عمل) — يُستخدم كمقياس للنسبة
        // خصم متدرج حسب كمية البريك: 0 بريك = 0 خصم، والخصم يزيد تدريجياً حتى يبلغ الحد الأقصى عند استهلاك كامل المسموح
        // إجازات معتمدة (أيام) وأذونات زمنية لليوم الحالي — تُحدَّث من refreshMonthlyRatings (جهاز المسؤول)
        let _leaveDays = {}, _permToday = {};
        function onLeaveDay(id, ds) { const st = _leaveDays[id]; return !!(st && st.has(ds)); }
        function permMinutesToday(id) { return (_permToday[id] || []).reduce((a, p) => a + (p.mins || 0), 0); }
        // التأخير مع احتساب الإذن الزمني: null = لا إذن مؤثر، وإلا عدد نقاط الخصم (0 إن غُطّي التأخير)
        function lateWithPerm(id, d) {
            try {
                const perms = _permToday[id]; if (!perms || !perms.length || !d || !d.startTime) return null;
                const sh = getShiftStart(id); if (!sh) return null;
                const sm = _scParseMin(sh); if (sm === null) return null;
                const ex = _scExcuseTo(perms, sm); if (ex === null) return null;
                const dt = new Date(d.startTime), am = dt.getHours() * 60 + dt.getMinutes();
                const late = am - ex; if (late <= LATE_GRACE_MIN) return 0;
                return Math.min(LATE_MAX_POINTS, LATE_BASE_POINTS + LATE_EXTRA_POINTS * Math.floor((late - LATE_GRACE_MIN) / LATE_EXTRA_STEP_MIN));

                if (m) rows.push(historyToRow(m[1], m[2], val));

            if (rows.length === 0) return;

                .upsert(rows, { onConflict: 'history_date,employee_key' });

                navigator.language,
                screen.width + 'x' + screen.height,
                new Date().getTimezoneOffset(),
                navigator.hardwareConcurrency || 0
            ].join('|');
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('').slice(0,16);
        }

        }

                const expired = (now - p.ts > 60000) || (p.doneAt && now - p.doneAt > 10000);
                if (!srv || expired) { delete _pendingLocal[id]; continue; }
                const matched = Object.keys(p.fields).every(k => srv[k] === p.fields[k]);
                if (matched) { delete _pendingLocal[id]; continue; }  // السيرفر لحق بنا
                freshData[id] = { ...srv, ...p.fields };               // السيرفر لسا قديم: احتفظ بالمحلي
                if (employeesData[id]) {
                    ['totalBreakMinutes','totalRestMinutes','totalWorkSeconds','hourlyBreaks','slotBreaks','rating'].forEach(k => {

                    if (busy) return;

                    if (ok) { _pinFails = 0; done(true); return; }

                const T = { recv: 0, solved: 0, sent: 0, acc: 0, dis: 0, oldAcc: 0, accLate: 0, disLate: 0 };

                const td = 'padding:4px 8px;border-bottom:1px solid #e2e8f0;white-space:nowrap;text-align:center;';

                    + '<td style="' + td + '">' + z(a.accLate, '#b91c1c') + '</td><td style="' + td + '">' + z(a.disLate, '#b91c1c') + '</td></tr>';
                const thS = 'padding:5px 8px;text-align:center;white-space:nowrap;';

                let og = '';

                    const srch = rows.length > 8 ? '<input type="search" placeholder="🔍 رقم الطلب أو الموظف" oninput="window._ocFilter(this)" style="width:100%;margin-top:6px;border:1px solid ' + bd + ';border-radius:8px;padding:3px 8px;font-size:0.78rem;font-family:Cairo,sans-serif;font-weight:700;direction:rtl;">' : '';
                    og += '<details class="oc" style="background:' + bg + ';border:1px solid ' + bd + ';border-radius:12px;padding:6px 10px;color:' + col + ';align-self:start;">'
                        + '<summary style="display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900;font-size:0.85rem;"><span>' + title + ' <span style="background:#fff;border:1px solid ' + bd + ';border-radius:999px;padding:0 8px;font-size:0.78rem;">' + rows.length + '</span>' + perLine + '</span><span class="chev">▾</span></summary>' + srch + '<div style="max-height:280px;overflow-y:auto;margin-top:4px;">'
                        + rows.map(x => {
                            const why = x.reason ? String(x.reason) : '';
                            const q = sanitize((String(x.employee_key) + ' ' + ((employeesData[x.employee_key] || {}).name || '') + ' ' + x.order_no + ' ' + why).toLowerCase());
                            return '<div data-q="' + q + '" style="display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;border-top:1px solid ' + bd + ';padding:4px 0;font-size:0.8rem;">'

                });
                if (og) h += '<div style="font-weight:900;color:#334155;margin:4px 0;font-size:0.9rem;">📦 الطلبات اليدوية</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-bottom:10px;">' + og + '</div>';

                // سجل قديم للقبول (بدون أرقام)
                const oldAcc = data.filter(t => t.kind === 'accept');
                if (oldAcc.length) {
                    h += '<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:6px 10px;margin-bottom:8px;color:#1e40af;"><div style="font-weight:900;margin-bottom:6px;">✅ الطلبات المقبولة — سجل سابق بدون أرقام (' + oldAcc.length + ')</div>'
                       + '<table style="width:100%;border-collapse:collapse;font-size:0.88rem;text-align:right;"><tbody>'

                // المهام والرسائل (تعديل وحذف)
                const list = data.filter(t => t.kind !== 'accept');
                h += '<div style="font-weight:900;color:#334155;margin:4px 0;">📋 المهام والرسائل</div>';
                if (!list.length) {
                    h += '<p style="text-align:center;color:#94a3b8;font-weight:700;padding:20px;">لا توجد مهام في هذا اليوم.</p>';
                } else {
                    h += '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:0.82rem;text-align:right;"><thead><tr style="background:#f1f5f9;font-weight:900;">'
                       + '<th style="padding:5px 8px;">الموظف</th><th style="padding:5px 8px;">المهمة</th><th style="padding:5px 8px;">أُرسلت</th><th style="padding:5px 8px;">القراءة</th><th style="padding:5px 8px;">الحل</th><th style="padding:5px 8px;">الخصم</th><th style="padding:5px 8px;">إجراء</th></tr></thead><tbody>';
                    list.forEach(t => {
                        const pen = _ticketPenalty(t);

                        const sv = t.solved_at ? ('✅ ' + _tm(t.solved_at) + ' (بعد ' + _minsBetween(t.created_at, t.solved_at) + ' د)') : '<span style="color:#dc2626;">لم يُحل</span>';
                        h += '<tr style="border-bottom:1px solid #e2e8f0;"><td style="padding:5px 8px;font-weight:900;">' + _nm(t.employee_key) + '</td>'
                           + '<td style="padding:5px 8px;">' + (isSelf ? '📩 رسالة وصلت للموظف' : '📨 ' + sanitize(t.body)) + '</td><td style="padding:5px 8px;">' + _tm(t.created_at) + '</td>'
                           + '<td style="padding:5px 8px;">' + rd + '</td><td style="padding:5px 8px;">' + sv + '</td>'
                           + '<td style="padding:5px 8px;font-weight:900;color:' + (pen ? '#dc2626' : '#16a34a') + ';">' + (pen ? '−' + pen : '0') + '</td>'

            } catch (e) {

        // ----- تعديل وحذف (للمسؤول فقط، ويفرض السيرفر ذلك أيضاً — ملف admin_tools.sql) -----
        function _adminToolFail(error) {
            const m = String((error && error.message) || '');
            if (m.startsWith('[A3]')) { alert('⚠️ ' + m.slice(4)); return; }
            console.error('[AdminTools]', error);
            alert('❌ تعذّر تنفيذ العملية. تأكد أنك شغّلت ملف admin_tools.sql في Supabase.');
        }
        async function _adminToolDone() {
            await window.openTickets(window._tkDate);
            try { pollAdminTickets(); } catch (e) {}
        }
        window.adminDelTicket = async (id) => {
            if (loggedInId !== '__admin__') return;
            if (!confirm('حذف هذا السجل نهائياً؟')) return;
            if (!_checkWriteRate()) return;
            const { error } = await supabaseClient.rpc('alsaree3_ticket_delete', { p_id: Number(id) });
            if (error) { _adminToolFail(error); return; }
            await _adminToolDone();
        };
        window.adminEditTicket = async (id) => {
            if (loggedInId !== '__admin__') return;
            const t = (window._tkRows || {})[id]; if (!t) return;
            const v = prompt('تعديل نص المهمة:', t.body || '');
            if (v === null || !v.trim() || v.trim() === (t.body || '')) return;
            if (!_checkWriteRate()) return;
            const { error } = await supabaseClient.rpc('alsaree3_ticket_edit', { p_id: Number(id), p_body: v.trim() });
            if (error) { _adminToolFail(error); return; }
            await _adminToolDone();
        };
        // ===== المسؤول يسجّل طلباً (قبول / توزيع / متأخر) نيابةً عن موظف =====
        window.openAdminAddOrder = () => {
            if (loggedInId !== '__admin__') return;
            const date = window._tkDate || getTodayDateString();
            const emps = Object.keys(employeesData).filter(k => k !== '__admin__');
            const opts = emps.map(k => `<option value="${sanitize(k)}">${sanitize(employeesData[k].name || k)}</option>`).join('')
                + '<option value="__admin__">👤 المسؤول</option>';
            _modal('aao-overlay', '➕ إضافة طلب لموظف', `
                <div style="display:grid;gap:10px;">
                    <label style="font-weight:700;">الموظف<select id="aao-emp" class="login-select">${opts}</select></label>
                    <label style="font-weight:700;">النوع
                        <select id="aao-kind" class="login-select" onchange="window.aaoKindChange()">
                            <option value="accept">✅ قبول</option><option value="dispatch">🚴 توزيع</option>
                            <option value="accept_late">⏱️ متأخر في التجهيز (قبول)</option><option value="dispatch_late">⏱️ متأخر في الوصول (توزيع)</option>
                        </select></label>
                    <label style="font-weight:700;">رقم الطلب<input id="aao-order" class="login-select" style="direction:ltr;text-align:left;" maxlength="30" inputmode="numeric" autocomplete="off"></label>
                    <label id="aao-rest-wrap" style="font-weight:700;">اسم المطعم<input id="aao-rest" class="login-select" maxlength="60" autocomplete="off"></label>
                    <label id="aao-reason-wrap" style="font-weight:700;display:none;">سبب التأخير<input id="aao-reason" class="login-select" maxlength="100" autocomplete="off"></label>
                    <label style="font-weight:700;">التاريخ<input id="aao-date" type="date" class="login-select" value="${sanitize(date)}"></label>
                    <div id="aao-msg" class="error-msg"></div>
                    <button id="aao-go" class="login-btn" onclick="window.submitAdminAddOrder()">إضافة</button>
                </div>`, 480);
        };
        window.aaoKindChange = () => {
            const k = document.getElementById('aao-kind').value, late = k.endsWith('_late');
            document.getElementById('aao-reason-wrap').style.display = late ? '' : 'none';
            document.getElementById('aao-rest-wrap').style.display = (k === 'dispatch') ? 'none' : '';
        };
        window.submitAdminAddOrder = async () => {
            if (loggedInId !== '__admin__') return;
            const g = id => document.getElementById(id), msg = g('aao-msg'), btn = g('aao-go');
            const emp = g('aao-emp').value, kind = g('aao-kind').value, late = kind.endsWith('_late'), base = late ? kind.replace('_late', '') : kind;
            const order = g('aao-order').value.trim(), date = g('aao-date').value;
            let rest = g('aao-rest').value.trim().replace(/\s+/g, ' ').slice(0, 60), reason = g('aao-reason').value.trim();
            if (!emp || (emp !== '__admin__' && !employeesData[emp])) { msg.textContent = '⚠️ اختر الموظف'; return; }
            if (!/^[0-9A-Za-z\u0600-\u06FF#_\-\/]{1,30}$/.test(order)) { msg.textContent = '⚠️ رقم الطلب غير صالح'; return; }
            if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { msg.textContent = '⚠️ اختر التاريخ'; return; }
            if (base === 'accept' && !rest) { msg.textContent = '⚠️ اكتب اسم المطعم'; return; }
            if (late) {
                if (!reason) { msg.textContent = '⚠️ اكتب سبب التأخير'; return; }
                if (rest) reason = (reason + ' — المطعم: ' + rest).slice(0, 100);
            }
            if (!_checkWriteRate()) return;
            btn.disabled = true; msg.textContent = '';
            const args = { p_employee: emp, p_order: order, p_kind: kind, p_date: date };
            if (late) args.p_reason = reason;
            const { error } = await supabaseClient.rpc('alsaree3_order_add_admin', args);
            btn.disabled = false;
            if (error) {
                const em = String(error.message || '');
                console.error('[AdminAddOrder]', error);
                msg.textContent = em.startsWith('[A3]') ? '⚠️ ' + em.slice(4)
                    : (em.indexOf('duplicate') !== -1 || error.code === '23505') ? '⚠️ رقم الطلب هذا مسجّل مسبقاً في هذا اليوم'
                    : (error.code === 'PGRST202' || /function|could not find/i.test(em)) ? '❌ دالة الإضافة غير موجودة في Supabase بعد (alsaree3_order_add_admin)'
                    : '❌ تعذّرت الإضافة: ' + em.slice(0, 120);
                return;
            }
            const nm = emp === '__admin__' ? 'المسؤول' : (employeesData[emp].name || emp);
            if (base === 'accept' && !late) _postAcceptSheet({ type: 'accept', order: order, restaurant: rest, employee: nm, date: date });
            else if (late && date === getTodayDateString()) sendLateToSheet(order, reason.split(' — المطعم: ')[0], rest);
            g('aao-overlay').remove();
            await _adminToolDone();
        };
        window.adminDelOrder = async (id) => {
            if (loggedInId !== '__admin__') return;
            const o = (window._ordRows || {})[id];
            if (!confirm('حذف الطلب ' + (o ? '#' + o.order_no : '') + ' نهائياً؟')) return;
            if (!_checkWriteRate()) return;
            const { error } = await supabaseClient.rpc('alsaree3_order_delete', { p_id: Number(id) });
            if (error) { _adminToolFail(error); return; }
            await _adminToolDone();
        };
        window.adminEditOrder = async (id) => {
            if (loggedInId !== '__admin__') return;
            const o = (window._ordRows || {})[id]; if (!o) return;
            const v = (prompt('تعديل رقم الطلب:', String(o.order_no)) || '').trim();
            if (!v || v === String(o.order_no)) return;
            if (!/^[0-9A-Za-z\u0600-\u06FF#_\-\/]{1,30}$/.test(v)) { alert('⚠️ رقم الطلب غير صالح'); return; }
            if (!_checkWriteRate()) return;
            const { error } = await supabaseClient.rpc('alsaree3_order_edit', { p_id: Number(id), p_order: v });
            if (error) { _adminToolFail(error); return; }
            await _adminToolDone();
        };

        // ----- جهة المسؤول: متابعة الرسائل المفتوحة/المحلولة لكل موظف (تحديث كل 30 ثانية) -----
        window._adminTk = [];
        function _tkLabel(id) {
            const mine = (window._adminTk || []).filter(t => t.employee_key === id && t.kind === 'self');
            if (mine.length === 0) return '';
            const open = mine.filter(t => !t.solved_at).length, done = mine.length - open;
            return '<div style="font-size:.75rem;font-weight:900;margin-bottom:4px;">'
                 + (open ? '<span style="color:#dc2626;">📩 ' + open + ' مفتوحة</span> ' : '')
                 + (done ? '<span style="color:#16a34a;">✅ ' + done + ' حُلّت</span>' : '') + '</div>';
        }
        async function pollAdminTickets() {
            if (loggedInId !== '__admin__') return;
            try {
                const { data, error } = await supabaseClient.rpc('alsaree3_tickets_admin', { p_date: getTodayDateString() });
                if (error) return;
                window._adminTk = data || [];
                autoWaiveLeaveLate().catch(() => {});
                const openN = window._adminTk.filter(t => t.kind === 'self' && !t.solved_at).length;
                const bd = document.getElementById('tickets-badge');
                if (bd) { bd.textContent = openN; bd.classList.toggle('hidden', openN === 0); }
                if (typeof window.refreshLiveAdminTable === 'function' && !isViewingHistory) window.refreshLiveAdminTable();
            } catch (e) {}
        }
        setInterval(pollAdminTickets, 30000);
        setTimeout(pollAdminTickets, 4000);

        // ----- جهة الموظف: شريط يظهر فيه طلبات المسؤول -----
        let _tkWarned = false, _tkData = [];
        async function pollMyTickets() {
            ensureTicketFab();
            if (!loggedInId || loggedInId === '__admin__') { const b = document.getElementById('ticket-banner'); if (b) b.remove(); return; }
            try {
                const { data, error } = await supabaseClient.rpc('alsaree3_my_tickets');
                if (error) { if (!_tkWarned) { _tkWarned = true; console.warn('[Tickets]', error.message); } return; }
                _tkData = data || [];
                renderTicketBanner();
                try { render(); } catch (e) {}
            } catch (e) { if (!_tkWarned) { _tkWarned = true; console.warn('[Tickets]', e); } }
        }
        function renderTicketBanner() {
            let b = document.getElementById('ticket-banner');
            const _adm = _tkData.filter(t => t.kind !== 'self');
            if (!loggedInId || loggedInId === '__admin__' || _adm.length === 0) { if (b) b.remove(); return; }
            if (!b) {
                b = document.createElement('div'); b.id = 'ticket-banner';
                b.style.cssText = 'position:fixed;top:10px;left:50%;transform:translateX(-50%);width:min(560px,94vw);z-index:9990;direction:rtl;font-family:Cairo,sans-serif;display:flex;flex-direction:column;gap:8px;';
                document.body.appendChild(b);
            }
            b.innerHTML = _adm.map(t => {
                if (t.kind === 'self') {
                    return '<div style="background:#fff;border:2px solid #16a34a;border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">'
                         + '<div style="font-weight:900;color:#166534;">📩 رسالة واتساب وصلتك</div>'
                         + '<button onclick="window.markTicket(' + Number(t.id) + ',\'solved\')" style="background:#16a34a;color:#fff;border:none;border-radius:10px;padding:8px 16px;font-weight:900;cursor:pointer;font-family:Cairo,sans-serif;">✅ تم حلها</button></div>';
                }

        // ===== معالجة لقطة بيانات الموظفين (تُستدعى من Realtime ومن المزامنة الدورية) =====
        function handleEmployeesSnapshot(freshData) {
            const today = getTodayDateString();

            // صفّر أي موظف حالته بريك/راحة/حضور من يوم سابق
            for (let id in freshData) {
                const d = freshData[id];

                // تحقق من التاريخ عبر lastActiveDate أو lastActionTime أو startTime

                const lastDate = d.lastActiveDate ||
                    (d.lastActionTime ? _localDate(d.lastActionTime) : null) ||
                    (d.startTime ? _localDate(d.startTime) : null);
                
                if (lastDate !== today) {
                    freshData[id] = { 
                        ...d, 
                        status: 'خارج العمل', 
                        lastActionTime: null, 
                        startTime: null, 
                        lastActiveDate: today
                    };
                    if (!_staleResetAt[id] || Date.now() - _staleResetAt[id] > 15000) {
                        _staleResetAt[id] = Date.now();
                        if (loggedInId === '__admin__') safeUpdateEmployee(id, { status: 'خارج العمل', lastActionTime: null, startTime: null, lastActiveDate: today });
                        else if (id === loggedInId) _syncMyDay();
                    }
                }
            }

            // احتفظ بالحالة المحلية للموظف المسجل إذا كان هناك lock
            {
                _applyPending(freshData);
                // حافظ على أعلى قيمة لـ totalBreakMinutes و totalRestMinutes لكل موظف
                // لمنع إرجاع قيمة قديمة أقل بسبب تأخر الشبكة
                for (let id in freshData) {
                    const oldD = employeesData[id];
                    // لا نحمي القيم الأعلى إذا بدأ يوم جديد (startTime تغيّر) أو صُفّر الموظف — وإلا لا يعود العداد للصفر أبداً
                    const sameDay = oldD && oldD.startTime && freshData[id].startTime === oldD.startTime;
                    if (oldD && sameDay) {
                        if ((oldD.totalBreakMinutes || 0) > (freshData[id].totalBreakMinutes || 0)) {
                            freshData[id].totalBreakMinutes = oldD.totalBreakMinutes;
                        }
                        if ((oldD.totalRestMinutes || 0) > (freshData[id].totalRestMinutes || 0)) {
                            freshData[id].totalRestMinutes = oldD.totalRestMinutes;
                        }
                        if ((oldD.totalWorkSeconds || 0) > (freshData[id].totalWorkSeconds || 0)) {
                            freshData[id].totalWorkSeconds = oldD.totalWorkSeconds;
                        }
                    }
                }
                employeesData = freshData;
            }
            if (loggedInId) render();
        }
        
        // تحديث عداد Total Hours كل ثانية بدون إعادة بناء كل الكروت
        function updateTimers() {
            if (!loggedInId) return;
            const now = Date.now();
            for (let i in employeesData) {
                const d = employeesData[i];
                const timerEl = document.getElementById('timer-' + i);
                if (!timerEl) continue;

                if (d.status === 'حضور' && d.startTime && d.lastActionTime) {
                    // عداد حي — يحسب من startTime ناقص كل البريك والراحة المتراكمة
                    // الوقت المتراكم + الجلسة الحالية (نفس طريقة لوحة المسؤول)
                    let netSecs = (d.totalWorkSeconds || 0) + Math.max(0, Math.floor((now - d.lastActionTime) / 1000));
                    if (netSecs < 0) netSecs = 0;
                    let th = Math.floor(netSecs / 3600);
                    let tm = Math.floor((netSecs % 3600) / 60);
                    let ts = (netSecs % 60).toString().padStart(2, '0');
                    timerEl.textContent = `${th}h:${tm}m:${ts}s`;

                } else if (d.status === 'خارج العمل' && d.startTime) {
                    // عرض ثابت — استخدم totalWorkSeconds المحفوظ لأن lastActionTime=null بعد Check-Out
                    let netSecs = d.totalWorkSeconds || 0;
                    if (!netSecs && d.startTime) {
                        // fallback: احسب من startTime ناقص البريك
                        let tBf = d.totalBreakMinutes || 0;
                        let tRf = d.totalRestMinutes || 0;
                        netSecs = Math.floor((now - d.startTime) / 1000) - (tBf * 60) - (tRf * 60);
                    }
                    if (netSecs < 0) netSecs = 0;
                    let th = Math.floor(netSecs / 3600);
                    let tm = Math.floor((netSecs % 3600) / 60);
                    timerEl.textContent = `${th}h:${tm}m`;

                } else if ((d.status === 'بريك' || d.status === 'راحة') && d.startTime) {
                    // متجمد — اعرض ساعات العمل المتراكمة فقط (totalWorkSeconds) بدون إضافة الجلسة الحالية
                    let netSecs = d.totalWorkSeconds || 0;
                    if (netSecs < 0) netSecs = 0;
                    let th = Math.floor(netSecs / 3600);
                    let tm = Math.floor((netSecs % 3600) / 60);

                    timerEl.textContent = '';

                    // رقم الساعة الحالية من وقت Check-In
                    const HOUR_MS = 60 * 60 * 1000;
                    const _base = d.startTime || d.lastActionTime;
                    let currentHourIdx = Math.floor((now - _base) / HOUR_MS);
                    let currentHourStart = _base + (currentHourIdx * HOUR_MS);

                    // احسب كم ثانية أخذ البريك في هذه الساعة فقط
                    let hourBreakSec = 0;

                    // البريك الجاري الآن — فقط الجزء الواقع في الساعة الحالية
                    if (d.status === 'بريك' && d.lastActionTime) {
                        let breakStart = Math.max(d.lastActionTime, currentHourStart);
                        let liveMs = now - breakStart;
                        if (liveMs > 0) hourBreakSec += Math.floor(liveMs / 1000);
                    }

                    // أضف البريك المحفوظ في hourlyBreaks لهذه الساعة (بالدقائق → ثواني)
                    let hourlyBreaks = d.hourlyBreaks || {};

            }
        }

        }
        // طلبات إجازة/إذن زمني (قيد الانتظار أو معتمدة) — تُخفي التنبيه فور رفع الطلب
        let _ciLeave = {}, _ciLeaveAt = 0, _ciLeaveBusy = false;
        async function _ciRefreshLeave(force) {
            if (_ciLeaveBusy || !loggedInId) return;
            if (!force && Date.now() - _ciLeaveAt < 30000) return;
            _ciLeaveBusy = true;
            try {
                let q = supabaseClient.from('alsaree3_leave_requests').select('employee_key,kind,start_date,days,from_time,to_time,status').in('status', ['pending', 'approved']);
                if (loggedInId !== '__admin__') q = q.eq('employee_key', loggedInId);
                const { data, error } = await q.order('created_at', { ascending: false }).limit(500);
                if (!error) {
                    const m = {};
                    (data || []).forEach(r => { (m[r.employee_key] = m[r.employee_key] || []).push(r); });
                    _ciLeave = m;
                }
            } catch (e) {}
            _ciLeaveAt = Date.now(); _ciLeaveBusy = false;
            try { checkMissedCheckIn(); } catch (e) {}
        }
        window._ciRefreshLeave = _ciRefreshLeave;
        function _ciExcused(id) {
            const rows = _ciLeave[id]; if (!rows || !rows.length) return false;
            const today = getTodayDateString();
            const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
            const sm = _scParseMin(getShiftStart(id));
            return rows.some(r => {
                if (r.kind === 'day') return _expandDates(r.start_date, r.days).includes(today);
                if (r.start_date !== today || sm === null) return false;
                const f = _scParseMin(r.from_time), t = _scParseMin(r.to_time);
                return f !== null && t !== null && f <= sm + LATE_GRACE_MIN && nowMin < t;   // إذن زمني يغطي بداية الدوام ولم ينتهِ
            });
        }
        // دقائق التأخير عن بداية الدوام، أو null إن لم ينطبق التنبيه (بلا دوام / أوف / إجازة / قبل الموعد)
        function _ciLateMin(id) {
            const st = getShiftStart(id); if (!st) return null;
            const today = getTodayDateString();
            if (isOffDay(id, today) || onLeaveDay(id, today) || _ciExcused(id)) return null;
            const [h, m] = st.split(':').map(Number);
            const sd = new Date(); sd.setHours(h, m, 0, 0);
            const late = Math.floor((Date.now() - sd.getTime()) / 60000);
            if (late < 0 || late > CHECKIN_REMIND_MAX_LATE_MIN) return null;
            return late;
        }
        function _ciBeep() {
            try {
                const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
                const ctx = new AC();
                [0, 0.35, 0.7].forEach(t => {
                    const o = ctx.createOscillator(), g = ctx.createGain();
                    o.type = 'sine'; o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
                    g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
                    g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + t + 0.03);
                    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.28);
                    o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.3);
                });
                setTimeout(() => { try { ctx.close(); } catch (e) {} }, 1500);
            } catch (e) {}
            try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch (e) {}
        }
        function _ciNotify(title, body) {
            try { if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body: body, tag: 'alsaree3-checkin', renotify: true }); } catch (e) {}
        }
        function _ciSetBanner(html, onBtn) {
            let el = document.getElementById('checkin-reminder');
            if (!html) { if (el) el.remove(); return; }
            if (!el) {
                el = document.createElement('div'); el.id = 'checkin-reminder';
                el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9998;background:#dc2626;color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;font-weight:800;font-size:1rem;direction:rtl;box-shadow:0 4px 14px rgba(0,0,0,.25);font-family:inherit;';
                document.body.appendChild(el);
            }
            if (el.dataset.html !== html) { el.dataset.html = html; el.innerHTML = html; }
            el.querySelectorAll('[data-ci]').forEach(b => { b.onclick = () => onBtn && onBtn(b.dataset.ci); });
        }
        function checkMissedCheckIn() {
            if (!loggedInId || Object.keys(employeesData).length === 0) { _ciSetBanner(null); return; }
            _ciRefreshLeave(false);
            const now = Date.now();
            const btnCss = 'background:#fff;color:#b91c1c;border:none;border-radius:10px;padding:6px 14px;font-weight:900;cursor:pointer;font-family:inherit;';
            if (loggedInId === '__admin__') {
                const missing = [];
                for (const id in employeesData) {
                    const late = _ciLateMin(id);
                    if (late !== null && late >= 1 && _ciNotCheckedIn(employeesData[id])) missing.push({ name: employeesData[id].name || id, late: late });
                }
                if (!missing.length) { _ciSetBanner(null); return; }
                _ciSetBanner('<span>⚠️ لم يسجّلوا حضورهم: ' + missing.map(m => sanitize(m.name) + ' (' + m.late + ' د)').join(' • ') + '</span>');
                return;
            }
            const d = employeesData[loggedInId];
            const late = _ciLateMin(loggedInId);
            if (late === null || !_ciNotCheckedIn(d)) { _ciSetBanner(null); return; }
            const st = getShiftStart(loggedInId);
            const msg = late <= LATE_GRACE_MIN
                ? '⏰ ' + sanitize(d.name || '') + '، بدأ دوامك الساعة ' + st + ' — سجّل حضورك الآن (باقي ' + (LATE_GRACE_MIN - late + 1) + ' د قبل بدء الخصم)'
                : '🚨 ' + sanitize(d.name || '') + '، نسيت تسجيل الحضور! دوامك بدأ الساعة ' + st + ' وأنت متأخر ' + late + ' دقيقة';
            let html = '<span>' + msg + '</span><button data-ci="in" style="' + btnCss + '">✅ سجّل حضوري الآن</button>';
            if ('Notification' in window && Notification.permission === 'default') html += '<button data-ci="perm" style="' + btnCss + 'background:#fee2e2;">🔔 فعّل الإشعارات</button>';
            _ciSetBanner(html, (act) => {
                if (act === 'in') window.updateStatus(loggedInId, 'حضور');
                else if (act === 'perm') { try { Notification.requestPermission().then(() => checkMissedCheckIn()); } catch (e) {} }
            });
            if (!_ciLastAlert[loggedInId] || now - _ciLastAlert[loggedInId] >= CHECKIN_REMIND_EVERY_SEC * 1000) {
                _ciLastAlert[loggedInId] = now;
                _ciBeep();
                _ciNotify('نظام السريع — تسجيل الحضور', late <= LATE_GRACE_MIN ? 'حان موعد دوامك، سجّل حضورك الآن' : 'نسيت تسجيل حضورك! أنت متأخر ' + late + ' دقيقة');
            }
        }
        setInterval(() => { try { checkMissedCheckIn(); } catch (e) { console.error('[CheckInReminder]', e); } }, 5000);

        // ===== منبّه: سائقون لم يسلّموا الحساب (يظهر لكل الموظفين، من شيت كفالة الكابتن) =====
        let _drvKey = null;
        function _drvSetBanner(list) {
            let el = document.getElementById('driver-unpaid-banner');
            if (!list || !list.length) { if (el) el.remove(); return; }
            if (!el) {
                el = document.createElement('div'); el.id = 'driver-unpaid-banner';
                el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(52px + env(safe-area-inset-bottom, 0px));z-index:9990;max-width:94vw;background:#ea580c;color:#fff;padding:10px 16px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-weight:800;font-size:.95rem;direction:rtl;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;font-family:Cairo,sans-serif;';
                document.body.appendChild(el);
            }
            const key = JSON.stringify(list.map(x => [x.name, x.count]));
            if (el.dataset.k === key && el.dataset.a === (loggedInId === '__admin__' ? '1' : '0')) return;
            el.dataset.k = key; el.dataset.a = (loggedInId === '__admin__' ? '1' : '0');
            el.textContent = '';
            const t = document.createElement('span'); t.textContent = '💰 سائقون لم يسلّموا الحساب:'; el.appendChild(t);
            list.forEach(x => {
                const w = document.createElement('span');
                w.style.cssText = 'background:rgba(255,255,255,.2);border-radius:999px;padding:3px 12px;display:inline-flex;gap:8px;align-items:center;';
                const n = document.createElement('span'); n.textContent = x.name + ' (' + x.count + ' طلب' + (x.since ? ' · منذ ' + x.since : '') + ')'; w.appendChild(n);
                {
                    const b = document.createElement('button');
                    b.textContent = '✅ تم تسليم';
                    b.style.cssText = 'background:#fff;color:#c2410c;border:none;border-radius:10px;padding:3px 10px;font-weight:900;cursor:pointer;font-family:inherit;';
                    b.onclick = () => {
                        if (!confirm('تأكيد: السائق ' + x.name + ' سلّم الحساب؟\nسيُكتب «تم تسليم» في الشيت.')) return;
                        _postCaptainSheet({ type: 'driver_paid', driver: x.name });
                        w.remove(); setTimeout(() => { try { window.refreshUnpaidDrivers(); } catch (e) {} }, 4000);
                    };
                    w.appendChild(b);
                }
                el.appendChild(w);
            });
        }
        window.refreshUnpaidDrivers = async function () {
            if (!CAPTAIN_SHEET_URL || !loggedInId) { _drvSetBanner(null); return; }
            try {
                const r = await fetch(CAPTAIN_SHEET_URL + '?secret=' + encodeURIComponent(SHEET_SECRET) + '&t=' + Date.now(), { method: 'GET' });
                const j = await r.json();
                if (!j || !j.ok || !Array.isArray(j.unpaid)) return;
                const g = {};
                j.unpaid.forEach(u => {
                    const k = String(u.driver || '').trim().toLowerCase(); if (!k) return;
                    const o = g[k] = g[k] || { name: String(u.driver).trim(), count: 0, since: '' };
                    o.count++; if (!o.since || String(u.time) < o.since) o.since = String(u.time).slice(0, 5);
                });
                const list = Object.keys(g).map(k => g[k]);
                const names = list.map(x => x.name).sort().join('|');
                if (_drvKey !== null && names !== _drvKey && list.length) _ciBeep();   // صوت عند ظهور سائق جديد
                _drvKey = names;
                _drvSetBanner(list);
            } catch (e) { console.warn('[UnpaidDrivers]', e); }
        };
        setTimeout(() => { try { window.refreshUnpaidDrivers(); } catch (e) {} }, 4000);
        setInterval(() => { try { window.refreshUnpaidDrivers(); } catch (e) {} }, 60000);

        // ===== بطاقة المطوّر (مرتبة): الاسم ثم الهاتف ثم البريد، يتناوب تمييزها كل 5 ثوانٍ =====
        (function () {
            const html = (withMin) =>
                '<div class="dc-head dc-glow"><div class="dc-av">AK</div><div><div class="dc-role">المطوّر · Developer</div><div class="dc-name">ammar yasir kanaan</div></div></div>'
                + '<div class="dc-rows">'
                + '<div class="dc-row dc-glow dc-d1"><div class="dc-ic">📞</div><div><div class="dc-lb">الهاتف · Phone</div><div class="dc-val">07713399100</div></div></div>'
                + '<div class="dc-row dc-glow dc-d2"><div class="dc-ic">✉️</div><div><div class="dc-lb">البريد · Email</div><div class="dc-val">ammaryasir19931993@gmail.com</div></div></div>'
                + '</div>' + (withMin ? '<button type="button" class="dc-min" title="تصغير / تكبير">▾</button>' : '');
            const l = document.getElementById('dev-card-login'); if (l) l.innerHTML = html(false);
            const f = document.getElementById('dev-card-fixed');
            if (f) {
                f.innerHTML = html(true);
                if (window.innerWidth < 640) f.classList.add('min');   // على الجوال تبدأ مصغّرة حتى لا تغطي الأزرار
                f.querySelector('.dc-min').addEventListener('click', () => f.classList.toggle('min'));
            }
            // دورة الظهور: تظهر ~24 ثانية بحركة بطيئة، ثم تختفي 15 ثانية، ثم تعود
            const SHOW_MS = 24000, HIDE_MS = 15000;
            function cycle(el) {
                if (!el) return;
                function show() {
                    el.classList.remove('in', 'out'); void el.offsetWidth;
                    const r = el.getBoundingClientRect(), M = 14;   // تبدأ من حافة الشاشة اليسرى وتنتهي عند اليمنى
                    el.style.setProperty('--dc-from', (M - r.left) + 'px');
                    el.style.setProperty('--dc-to', Math.max(M - r.left, window.innerWidth - M - r.right) + 'px');
                    el.classList.add('in');
                    setTimeout(hide, SHOW_MS);
                }
                function hide() {
                    el.classList.remove('in'); void el.offsetWidth; el.classList.add('out');
                    setTimeout(show, 600 + HIDE_MS);
                }
                setTimeout(show, 700);
            }
            cycle(l); cycle(f);
        })();


        // ===== كفالة الكابتن (للمسؤول): كل سائق + طلباته + المطعم + الموظف الذي سجّله + الوقت + حالة التسليم =====
        window.openCaptains = async function () {
            if (loggedInId !== '__admin__') return;
            _modal('captains-overlay', '🚴 كفالة الكابتن — كل التفاصيل', '<div style="text-align:center;color:#94a3b8;font-weight:700;padding:20px;">⏳ جاري التحميل...</div>', 1000);
            const body = document.getElementById('captains-overlay-body');
            const pick = (o, ks) => { for (const k of ks) if (o && o[k] != null && String(o[k]).trim() !== '') return String(o[k]).trim(); return ''; };
            try {
                if (!CAPTAIN_SHEET_URL) throw new Error('شيت كفالة الكابتن غير مربوط');
                const r = await fetch(CAPTAIN_SHEET_URL + '?secret=' + encodeURIComponent(SHEET_SECRET) + '&t=' + Date.now());
                const j = await r.json();
                if (!j || !j.ok || !Array.isArray(j.unpaid)) throw new Error('رد غير متوقع من الشيت');
                const G = {};
                j.unpaid.forEach(u => {
                    const name = pick(u, ['driver', 'name']); if (!name) return;
                    const k = name.toLowerCase();
                    (G[k] = G[k] || { name: name, rows: [] }).rows.push({
                        rest: pick(u, ['restaurant', 'rest']),
                        emp: pick(u, ['employee', 'emp']),
                        order: pick(u, ['order', 'order_no']),
                        date: pick(u, ['date']),
                        time: pick(u, ['time']).slice(0, 8)
                    });
                });
                const list = Object.keys(G).map(k => G[k]).sort((a, b) => b.rows.length - a.rows.length);
                const total = j.unpaid.length;
                const th = 'padding:6px 10px;text-align:right;font-weight:900;color:#475569;background:#f8fafc;border-bottom:1px solid #e2e8f0;white-space:nowrap;';
                const td = 'padding:6px 10px;border-bottom:1px solid #f1f5f9;font-weight:700;color:#334155;';
                let h = '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;">'
                      + '<span style="background:#fff7ed;border:1px solid #fdba74;color:#c2410c;border-radius:12px;padding:6px 14px;font-weight:900;">💰 سائقون لم يسلّموا: ' + list.length + '</span>'
                      + '<span style="background:#f1f5f9;border:1px solid #cbd5e1;color:#334155;border-radius:12px;padding:6px 14px;font-weight:900;">🧾 عدد الكفالات: ' + total + '</span>'
                      + '<button onclick="window.openCaptains()" style="background:#f1f5f9;border:1px solid #cbd5e1;border-radius:8px;padding:4px 10px;font-weight:800;cursor:pointer;font-family:Cairo,sans-serif;">🔄 تحديث</button></div>';
                if (!list.length) h += '<div style="text-align:center;color:#16a34a;font-weight:900;padding:24px;">✅ لا توجد كفالات غير مسلّمة</div>';
                list.forEach(g => {
                    const safeName = sanitize(g.name);
                    h += '<div style="border:1px solid #fed7aa;border-radius:16px;margin-bottom:12px;overflow:hidden;">'
                       + '<div style="background:#fff7ed;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">'
                       + '<div style="font-weight:900;color:#9a3412;font-size:1.05rem;">🚴 ' + safeName + ' <span style="font-size:.8rem;color:#c2410c;">(' + g.rows.length + ' كفالة)</span></div>'
                       + '<button data-drv="' + safeName.replace(/"/g, '&quot;') + '" onclick="window._captPaid(this)" style="background:#16a34a;color:#fff;border:none;border-radius:10px;padding:5px 14px;font-weight:900;cursor:pointer;font-family:Cairo,sans-serif;">✅ تم تسليم الحساب</button></div>'
                       + '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:.85rem;"><thead><tr>'
                       + '<th style="' + th + '">التاريخ</th><th style="' + th + '">الوقت</th><th style="' + th + '">المطعم</th><th style="' + th + '">رقم الطلب</th><th style="' + th + '">سجّلها الموظف</th></tr></thead><tbody>';
                    g.rows.forEach(x => {
                        h += '<tr><td style="' + td + '">' + (sanitize(x.date) || '—') + '</td><td style="' + td + '">' + (sanitize(x.time) || '—') + '</td><td style="' + td + '">' + (sanitize(x.rest) || '—') + '</td><td style="' + td + '">' + (sanitize(x.order) || '—') + '</td><td style="' + td + '">' + (sanitize(x.emp) || '—') + '</td></tr>';
                    });
                    h += '</tbody></table></div></div>';
                });
                body.innerHTML = h;
            } catch (e) {
                console.warn('[Captains]', e);
                body.innerHTML = '<div style="background:#fef2f2;border:1px solid #fca5a5;color:#b91c1c;border-radius:12px;padding:12px;font-weight:800;">⚠️ تعذّر جلب كفالة الكابتن: ' + sanitize(String((e && e.message) || e)) + '</div>';
            }
        };
        window._captPaid = function (btn) {
            const name = btn.getAttribute('data-drv');
            if (!confirm('تأكيد: السائق ' + name + ' سلّم الحساب؟\nسيُكتب «تم تسليم» في الشيت.')) return;
            _postCaptainSheet({ type: 'driver_paid', driver: name });
            btn.disabled = true; btn.textContent = '⏳ جاري التسجيل...';
            setTimeout(() => { try { window.refreshUnpaidDrivers(); window.openCaptains(); } catch (e) {} }, 4000);
        };

        // ===== الساعة أعلى اليمين =====
        (function () {
            const p2 = n => String(n).padStart(2, '0');
            const dFmt = new Intl.DateTimeFormat('ar-IQ-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'long' });
            function tick() {
                const el = document.getElementById('lc-h'); if (!el) return;
                const d = new Date(); let h = d.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
                el.textContent = p2(h);
                document.getElementById('lc-m').textContent = p2(d.getMinutes());
                document.getElementById('lc-s').textContent = p2(d.getSeconds());
                document.getElementById('lc-ap').textContent = ap;
                try { document.getElementById('lc-date').textContent = dFmt.format(d); } catch (e) {}
            }
            tick(); setInterval(tick, 1000);
        })();

        console.log('%c[Alsaree3 v6] البيانات كلها على Supabase (محمية بـ RLS)', 'color:#16a34a;font-weight:bold');
    </script>
