    <script>
        (function () {
            var t = null; try { t = localStorage.getItem('a3_theme'); } catch (e) {}
            if (!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            if (t === 'dark') document.documentElement.classList.add('a3-dark');
            window.toggleTheme = function () {
                var h = document.documentElement, dark = !h.classList.contains('a3-dark');
                h.classList.add('a3-theme-anim');
                h.classList.toggle('a3-dark', dark);

    <style>
        body { background-color: #e2e8f0; color: #000000; font-family: 'Cairo', sans-serif; min-height: 100vh; padding: 24px; }
        .system-container { background-color: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 32px; padding: 32px; box-shadow: inset 0 2px 4px 0 rgba(255, 255, 255, 0.5), 0 20px 25px -5px rgba(0, 0, 0, 0.05); }
        .card-box { background-color: #ffffff; border: 1px solid #cbd5e1; padding: 24px; border-radius: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02); transition: all 0.3s; text-align: left; direction: ltr; }
        .card-box.attendance-active { background-color: #f0fdf4; border-color: #86efac; }
        .card-box:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08); border-color: #22c55e; }

        .tk-row { display:flex; gap:8px; margin-bottom:12px; }

        .tk-input { flex:1; min-width:0; padding:7px 10px; border-radius:12px; border:1px solid #cbd5e1; background:#fff; font-family:inherit; font-size:0.85rem; font-weight:700; color:#0f172a; direction:ltr; text-align:center; }
        .tk-input:focus { outline:none; border-color:#f59e0b; box-shadow:0 0 0 2px #fde68a; }

        .act-toggle:hover { border-color:#22c55e; background:#fff; }

        /* ===== مشهد الدلفري (دورة 16 ثانية): السايق ينتظر ← يوصله طلب ← يروح للمطعم ويستلم ← يوصل للزبون ← يرجع ينتظر ===== */
        .dlv-road { --s:1; position:relative; height:calc(168px * var(--s)); max-width:860px; margin:18px auto 0; overflow:hidden;
            -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%); mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%); }
        .dlv-road::before { content:''; position:absolute; left:0; right:0; bottom:0; height:calc(18px * var(--s)); border-radius:999px;
            background:linear-gradient(180deg,#1f6168 0%,#103d42 60%,#0b2f33 100%); box-shadow:inset 0 2px 0 rgba(255,255,255,.12), 0 6px 14px -8px rgba(16,61,66,.6); }
        .dlv-road::after { content:''; position:absolute; left:0; right:0; bottom:calc(8px * var(--s)); height:2px; border-radius:2px;
            background:repeating-linear-gradient(90deg,#d6fd26 0 22px,transparent 22px 40px); opacity:.85; z-index:1; }
        @media (max-width:820px) { .dlv-road { --s:.8; } }
        @media (max-width:640px) { .dlv-road { --s:.5; } }
        .dlv-stage { position:absolute; bottom:0; left:50%; width:760px; height:168px; margin-left:-380px; transform:scale(var(--s)); transform-origin:50% 100%; z-index:2; }
        .dlv-stage svg { display:block; }
        .dlv-house { position:absolute; bottom:16px; left:10px; z-index:0; }
        .dlv-rest { position:absolute; bottom:16px; left:600px; z-index:0; }
        .dlv-rest svg { overflow:visible; }
        .dlv-sign { animation:dlvSign 1.2s steps(1) infinite; } .dlv-sign.s2 { animation-delay:.6s; }
        @keyframes dlvSign { 50% { fill:#fb923c; } }
        .dlv-steam { opacity:.7; animation:dlvSteam 2.4s ease-in-out infinite; }
        @keyframes dlvSteam { 0% { opacity:0; transform:translate(0px,40px); } 40% { opacity:.8; } 100% { opacity:0; transform:translate(3px,30px); } }
        /* الطبّاخ يطلع بالباب ويسلّم الكيس */
        .dlv-chef { transform-box:fill-box; transform-origin:50% 100%; animation:dlvChef 16s ease-in-out infinite; }
        @keyframes dlvChef { 0%, 22% { opacity:0; transform:translateY(14px); } 26%, 39% { opacity:1; transform:translateY(0); } 43%, 100% { opacity:0; transform:translateY(14px); } }
        .dlv-chef-arm { transform-box:fill-box; transform-origin:0% 100%; animation:dlvWave 16s ease-in-out infinite; }
        @keyframes dlvWave { 0%, 36% { transform:rotate(0); } 37.5% { transform:rotate(-35deg); } 39% { transform:rotate(10deg); } 40.5% { transform:rotate(-35deg); } 42%, 100% { transform:rotate(0); } }

        /* الدراجة: الموقع + اتجاه الوجه */
        .dlv-bike { position:absolute; bottom:9px; left:300px; z-index:4; animation:dlvRide 16s linear infinite; }
        @keyframes dlvRide {
            0%, 14% { left:300px; animation-timing-function:cubic-bezier(.45,0,.55,1); }
            26%, 40% { left:520px; animation-timing-function:cubic-bezier(.45,0,.55,1); }
            58%, 74% { left:214px; animation-timing-function:cubic-bezier(.45,0,.55,1); }
            86%, 100% { left:300px; } }
        .dlv-dir { animation:dlvFlip 16s ease-in-out infinite; }
        @keyframes dlvFlip { 0%, 40% { transform:scaleX(1); } 42.5%, 74% { transform:scaleX(-1); } 76.5%, 100% { transform:scaleX(1); } }
        .dlv-bob { position:relative; animation:dlvBob .3s ease-in-out infinite alternate; }
        .dlv-bob .adm-logo.dlv-boxlogo { position:absolute; left:4px; top:-4px; width:38px !important; height:38px !important; border-radius:7px !important; margin:0 !important; background-size:82% !important; background-position:center 62% !important; background-repeat:no-repeat !important; background-color:#d6fd26 !important; border:2px solid #0b2f33; border-top-width:6px; box-shadow:inset -7px -5px 0 rgba(0,0,0,.14), inset 3px 3px 0 rgba(255,255,255,.35), 0 3px 6px rgba(16,61,66,.35) !important; z-index:1; animation:dlvFlip 16s ease-in-out infinite; }
        .dlv-bike svg { overflow:visible; filter:drop-shadow(0 4px 6px rgba(16,61,66,.18)); }
        .dlv-wheel { transform-box:fill-box; transform-origin:center; animation:dlvSpin 16s infinite; }
        @keyframes dlvSpin {
            0%, 14% { transform:rotate(0deg); animation-timing-function:cubic-bezier(.45,0,.55,1); }
            26%, 40% { transform:rotate(720deg); animation-timing-function:cubic-bezier(.45,0,.55,1); }
            58%, 74% { transform:rotate(1800deg); animation-timing-function:cubic-bezier(.45,0,.55,1); }
            86%, 100% { transform:rotate(2520deg); } }
        .dlv-puff { fill:#cbd5e1; transform-box:fill-box; transform-origin:center; animation:dlvPuff .9s ease-out infinite; }
        .dlv-puff.p2 { animation-delay:.3s; } .dlv-puff.p3 { animation-delay:.6s; }
        @keyframes dlvBob { from { transform:translateY(0); } to { transform:translateY(-1.5px); } }
        @keyframes dlvPuff { 0% { opacity:.8; transform:translateX(0) scale(.6); } 100% { opacity:0; transform:translateX(-10px) scale(1.8); } }

        /* إشعار «طلب جديد» فوق السايق وهو ينتظر */
        .dlv-ping { position:absolute; left:50%; top:-30px; z-index:5; white-space:nowrap; direction:rtl; padding:4px 12px; border-radius:999px;
            background:#fff; border:2px solid #22c55e; color:#15803d; font:900 13px/1.4 Cairo,sans-serif; box-shadow:0 8px 18px -6px rgba(22,163,74,.55);
            opacity:0; transform:translateX(-50%) scale(.5); animation:dlvPing 16s ease-out infinite; }
        .dlv-ping::after { content:''; position:absolute; left:50%; bottom:-7px; width:10px; height:10px; margin-left:-5px; background:#fff; border-right:2px solid #22c55e; border-bottom:2px solid #22c55e; transform:rotate(45deg); }
        .dlv-bell { display:inline-block; animation:dlvRing .5s ease-in-out infinite; }
        @keyframes dlvPing { 0%, 3% { opacity:0; transform:translateX(-50%) translateY(8px) scale(.5); } 5% { opacity:1; transform:translateX(-50%) translateY(0) scale(1.12); }
            6.5%, 13% { opacity:1; transform:translateX(-50%) scale(1); } 15.5%, 100% { opacity:0; transform:translateX(-50%) translateY(-8px) scale(.8); } }
        @keyframes dlvRing { 0%, 100% { transform:rotate(0); } 25% { transform:rotate(-18deg); } 75% { transform:rotate(18deg); } }

        /* كيس الطلب: من باب المطعم إلى صندوق الدراجة */
        .dlv-bag { position:absolute; z-index:5; left:690px; bottom:26px; opacity:0; animation:dlvBag 16s ease-in-out infinite; }
        @keyframes dlvBag { 0%, 28% { opacity:0; left:690px; bottom:26px; transform:scale(.6); }
            30% { opacity:1; left:690px; bottom:30px; transform:scale(1); }
            35.5% { opacity:1; left:528px; bottom:72px; transform:scale(1); }
            38%, 100% { opacity:0; left:528px; bottom:66px; transform:scale(.5); } }
        /* الطرد: من الصندوق إلى يد الزبون */
        .dlv-parcel { position:absolute; z-index:5; left:300px; bottom:66px; opacity:0; animation:dlvParcel 16s ease-in-out infinite; }
        @keyframes dlvParcel { 0%, 59% { opacity:0; left:300px; bottom:66px; transform:scale(.6); }
            61% { opacity:1; left:300px; bottom:70px; transform:scale(1); }
            66% { opacity:1; left:200px; bottom:46px; transform:scale(1); }
            68.5% { opacity:1; left:200px; bottom:46px; transform:scale(1); }
            71%, 100% { opacity:0; left:200px; bottom:46px; transform:scale(.6); } }

        /* الزبون: يطلع من البيت، يستلم، ياكل ويفرح، ويرجع */
        .dlv-cust { position:absolute; bottom:16px; left:150px; z-index:3; opacity:0; animation:dlvWalk 16s ease-in-out infinite; }
        @keyframes dlvWalk { 0%, 44% { opacity:0; transform:translateX(-36px); } 47% { opacity:1; transform:translateX(-36px); } 55%, 93% { opacity:1; transform:translateX(0); }
            98% { opacity:1; transform:translateX(-36px); } 99%, 100% { opacity:0; transform:translateX(-36px); } }
        .dlv-cust .dlv-person { display:block; overflow:visible; transform-origin:50% 100%; animation:dlvHappy 16s ease-in-out infinite; }
        @keyframes dlvHappy { 0%, 66%, 72%, 86%, 94%, 100% { transform:translateY(0) rotate(0); } 67.5% { transform:translateY(-5px); } 69% { transform:translateY(0); } 70.5% { transform:translateY(-3px); }
            87.5% { transform:translateY(-4px) rotate(-2deg); } 89% { transform:translateY(0) rotate(0); } 90.5% { transform:translateY(-4px) rotate(2deg); } 92% { transform:translateY(0) rotate(0); } }
        .dlv-ok { position:absolute; top:-14px; left:30px; width:22px; height:22px; border-radius:50%; background:#22c55e; color:#fff; font:900 13px/22px Cairo,sans-serif; text-align:center; box-shadow:0 4px 10px -3px rgba(22,163,74,.6); opacity:0; animation:dlvOk 16s ease-out infinite; }
        @keyframes dlvOk { 0%, 66% { opacity:0; transform:scale(.3) translateY(6px); } 67.5% { opacity:1; transform:scale(1.15) translateY(0); } 69%, 71.5% { opacity:1; transform:scale(1); } 73.5%, 100% { opacity:0; transform:scale(.6); } }
        .dlv-food { position:absolute; z-index:5; left:200px; bottom:44px; opacity:0; animation:dlvFood 16s ease-in-out infinite; }
        @keyframes dlvFood {
            0%, 70% { opacity:0; left:200px; bottom:44px; transform:scale(.5); }
            72% { opacity:1; left:200px; bottom:44px; transform:scale(1); }
            74.5% { left:195px; bottom:60px; } 76.5% { left:200px; bottom:46px; }
            78.5% { left:195px; bottom:60px; } 80.5% { left:200px; bottom:46px; }
            82.5% { left:195px; bottom:60px; } 84.5% { left:200px; bottom:46px; transform:scale(1); }
            86% { opacity:1; transform:scale(.55); } 88%, 100% { opacity:0; left:200px; bottom:46px; transform:scale(.3); } }
        .dlv-mouth { transform-box:fill-box; transform-origin:50% 0; animation:dlvChew 16s linear infinite; }
        @keyframes dlvChew { 0%, 74% { transform:scaleY(1); } 75% { transform:scaleY(.3); } 75.5% { transform:scaleY(1.3); } 76.5% { transform:scaleY(.3); }
            79% { transform:scaleY(.3); } 79.5% { transform:scaleY(1.3); } 80.5% { transform:scaleY(.3); }
            83% { transform:scaleY(.3); } 83.5% { transform:scaleY(1.3); } 84.5% { transform:scaleY(.3); } 85.5% { transform:scaleY(1); }
            87%, 95% { transform:scaleY(1.6); } 98%, 100% { transform:scaleY(1); } }
        .dlv-belly { transform-box:fill-box; transform-origin:0% 50%; animation:dlvBelly 16s ease-in-out infinite; }
        @keyframes dlvBelly { 0%, 73% { opacity:0; transform:scale(.15,.55); } 74% { opacity:1; } 76% { transform:scale(.55,.8); } 79% { transform:scale(.85,.92); } 82% { transform:scale(1.15,1); }
            85% { transform:scale(1.3,1.05); } 87% { transform:scale(1.42,1.08); } 88.5% { transform:scale(1.3,1.04); } 90%, 95% { opacity:1; transform:scale(1.38,1.06); } 98%, 100% { opacity:0; transform:scale(.15,.55); } }
        .dlv-cheek { opacity:0; animation:dlvCheek 16s ease-in-out infinite; }
        @keyframes dlvCheek { 0%, 84% { opacity:0; } 87%, 95% { opacity:.75; } 98%, 100% { opacity:0; } }
        .dlv-heart { position:absolute; left:36px; top:-6px; opacity:0; animation:dlvHeart 16s ease-out infinite; }
        .dlv-heart.h2 { left:24px; animation-delay:.35s; }
        .dlv-heart.h3 { left:46px; animation-delay:.7s; }
        @keyframes dlvHeart { 0%, 85% { opacity:0; transform:translateY(10px) scale(.4); } 87% { opacity:1; transform:translateY(0) scale(1); } 94% { opacity:0; transform:translateY(-22px) scale(1.1); } 100% { opacity:0; } }

        @media (prefers-reduced-motion: reduce) {
            .dlv-bike, .dlv-dir, .dlv-bob, .dlv-bob .adm-logo.dlv-boxlogo, .dlv-wheel, .dlv-puff, .dlv-sign, .dlv-steam, .dlv-chef, .dlv-chef-arm,
            .dlv-cust, .dlv-cust .dlv-person, .dlv-mouth, .dlv-belly, .dlv-cheek, .dlv-bell { animation:none; }
            .dlv-ping, .dlv-bag, .dlv-parcel, .dlv-ok, .dlv-food, .dlv-heart, .dlv-chef { animation:none; opacity:0; }
            .dlv-cust { opacity:0; }
        }
        .ord-tabs { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:8px; direction:rtl; }
        .ord-tab { --c:#64748b; position:relative; display:flex; align-items:center; gap:6px; padding:8px 10px; border-radius:12px; border:1px solid #e2e8f0; background:#fff; font-family:inherit; font-size:0.8rem; font-weight:800; color:#334155; cursor:pointer; text-align:right; transition:background .15s, border-color .15s, transform .12s; }
        .ord-tab:hover { border-color:var(--c); }
        .ord-tab:active { transform:scale(.97); }
        .ord-tab .ot-lb { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .ord-tab .ot-n { min-width:20px; padding:0 6px; border-radius:999px; background:#f1f5f9; color:#475569; font-size:0.7rem; font-weight:900; text-align:center; line-height:18px; }

        .ord-tab.on .ot-n { background:rgba(255,255,255,.25); color:#fff; }
        .ord-panel { --c:#64748b; border:1px solid #e2e8f0; border-top:3px solid var(--c); border-radius:14px; padding:8px; margin-bottom:8px; background:#fff; }
        .ord-panel .op-t { font-weight:900; font-size:0.8rem; color:var(--c); text-align:center; margin-bottom:8px; }
        .tk-stat { text-align:center; font-size:0.72rem; font-weight:800; color:#64748b; margin:-4px 0 12px; }
        .task-btn { background: #ffffff; border: 1px solid #cbd5e1; color: #000000; padding: 12px 8px; border-radius: 14px; font-size: 0.9rem; font-weight: 700; width: 100%; cursor: pointer; transition: all 0.2s; }
        .task-btn:hover { border-color: #22c55e; }
        .task-btn.active { background: #22c55e; color: #ffffff !important; border-color: #22c55e; }
        .admin-panel { background-color: #ffffff; border: 1px solid #cbd5e1; padding: 30px; border-radius: 24px; margin-top: 25px; text-align: right; direction: rtl; }
        details.oc > summary { list-style: none; cursor: pointer; }
        details.oc > summary::-webkit-details-marker { display: none; }

        details.oc[open] .chev { transform: rotate(180deg); }
        .timer-text { color: #16a34a !important; font-weight: 900; font-size: 1.2rem; margin-left: 10px; }

        /* شاشة تسجيل الدخول */
        #login-screen { position:fixed; inset:0; flex-direction:column; background:linear-gradient(135deg,#dcfce7 0%,#bbf7d0 50%,#86efac 100%); display:flex; align-items:center; justify-content:center; z-index:9999; font-family:'Cairo',sans-serif; }
        .login-card { background:#ffffff; border-radius:32px; padding:40px 36px; box-shadow:0 25px 50px rgba(0,0,0,0.12); width:100%; max-width:420px; border:1px solid #bbf7d0; }
        .login-select { width:100%; padding:14px 16px; border-radius:16px; border:2px solid #d1fae5; font-family:'Cairo',sans-serif; font-size:1rem; font-weight:700; background:#f0fdf4; color:#000; cursor:pointer; outline:none; transition:border 0.2s; direction:rtl; }
        .login-select:focus { border-color:#22c55e; }
        .pin-input { width:100%; padding:14px 16px; border-radius:16px; border:2px solid #d1fae5; font-family:'Cairo',sans-serif; font-size:1.4rem; font-weight:900; background:#f0fdf4; color:#000; letter-spacing:8px; text-align:center; outline:none; transition:border 0.2s; }
        .pin-input:focus { border-color:#22c55e; }
        .login-btn { width:100%; padding:16px; border-radius:18px; background:#22c55e; color:#fff; font-family:'Cairo',sans-serif; font-size:1.1rem; font-weight:900; border:none; cursor:pointer; transition:background 0.2s; }
        .login-btn:hover { background:#16a34a; }
        .login-btn:disabled { background:#86efac; cursor:not-allowed; }
        .error-msg { color:#dc2626; font-weight:700; font-size:0.9rem; text-align:center; min-height:22px; }
        .my-card-highlight { border:3px solid #22c55e !important; box-shadow:0 0 0 6px #bbf7d030 !important; }
        /* بطاقة المطوّر: مربعة ومرتبة، يتناوب تمييز أقسامها كل 5 ثوانٍ (دورة 15 ثانية) */
        body { padding-bottom: 64px; }
        .dev-card { width:min(92vw,300px); box-sizing:border-box; padding:14px; border-radius:22px; direction:ltr; text-align:left; font-family:'Cairo',sans-serif; color:#ecfdf5; background:linear-gradient(145deg,#0b2f33 0%,#103d42 55%,#16626a 100%); border:1px solid rgba(190,242,100,.35); box-shadow:0 14px 30px rgba(16,61,66,.30), inset 0 1px 0 rgba(255,255,255,.10); }
        .dev-card.in-login { margin-top:18px; flex:none; }
        .dev-card.fixed-bl { position:fixed; left:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:90; width:262px; }
        .dev-card .dc-head { display:flex; align-items:center; gap:10px; padding:8px; border-radius:16px; border:1px solid transparent; }
        .dev-card .dc-av { width:42px; height:42px; flex:none; border-radius:14px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:1rem; color:#0f172a; background:linear-gradient(135deg,#d9f99d,#a3e635); box-shadow:0 4px 10px rgba(163,230,53,.35); }
        .dev-card .dc-role { font-size:.66rem; font-weight:800; letter-spacing:.6px; color:#86efac; text-transform:uppercase; }
        .dev-card .dc-name { font-size:1rem; font-weight:900; color:#fff; line-height:1.25; }
        .dev-card .dc-min { margin-left:auto; flex:none; width:26px; height:26px; border-radius:8px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08); color:#ecfdf5; font-weight:900; line-height:1; cursor:pointer; font-family:inherit; }
        .dev-card .dc-min:hover { background:rgba(255,255,255,.18); }
        .dev-card .dc-rows { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
        .dev-card .dc-row { --ib:rgba(255,255,255,.06); --ibd:rgba(255,255,255,.08); display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); }
        .dev-card .dc-ic { width:34px; height:34px; flex:none; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:1rem; background:rgba(217,249,157,.14); }
        .dev-card .dc-lb { font-size:.66rem; font-weight:800; color:#a7f3d0; line-height:1.1; }
        .dev-card .dc-val { font-size:.86rem; font-weight:900; color:#fff; direction:ltr; word-break:break-all; line-height:1.3; }
        /* ظهور/اختفاء: تظهر بحركة جاذبة ~10 ثوانٍ ثم تختفي 15 ثانية وتعود */
        .dev-card { position:relative; overflow:hidden; opacity:0; transform:translateY(46px) scale(.82); pointer-events:none; }
        .dev-card.fixed-bl { position:fixed; }
        .dev-card::after { content:''; position:absolute; top:0; bottom:0; left:-60%; width:45%; transform:skewX(-20deg); background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent); opacity:0; pointer-events:none; }
        .dev-card.in { pointer-events:auto; animation:dcIn .9s cubic-bezier(.2,.9,.3,1.25) forwards, dcFloat 3.2s ease-in-out .9s infinite; }
        .dev-card.in::after { animation:dcShine 1.4s ease-out .5s 1 both, dcShine 1.4s ease-out 5s 1 both; }
        .dev-card.out { animation:dcOut .6s ease-in forwards; pointer-events:none; }
        .dev-card.in .dc-glow { animation:dcGlowOnce 2.6s ease-in-out .8s 1 both; }
        .dev-card.in .dc-glow.dc-d1 { animation-delay:3.4s; }
        .dev-card.in .dc-glow.dc-d2 { animation-delay:6s; }
        .dev-card.in .dc-av { animation:dcPulse 1.6s ease-in-out .9s 3; }
        @keyframes dcIn { 0% { opacity:0; transform:translateY(46px) scale(.82) rotate(-2deg); } 60% { opacity:1; transform:translateY(-10px) scale(1.05) rotate(1deg); } 100% { opacity:1; transform:translateY(0) scale(1) rotate(0); } }
        @keyframes dcFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-5px); } }
        @keyframes dcOut { 0% { opacity:1; transform:translateY(0) scale(1); } 100% { opacity:0; transform:translateY(40px) scale(.85); } }
        @keyframes dcShine { 0% { left:-60%; opacity:1; } 100% { left:130%; opacity:1; } }
        @keyframes dcPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.12) rotate(-4deg); } }
        @keyframes dcGlowOnce { 0%,100% { background-color:var(--ib,transparent); border-color:var(--ibd,transparent); box-shadow:none; } 15%,85% { background-color:rgba(217,249,157,.16); border-color:rgba(217,249,157,.6); box-shadow:0 0 0 3px rgba(217,249,157,.10); } }
        .dev-card.min .dc-rows, .dev-card.min .dc-role { display:none; }
        .dev-card.min { width:auto; padding:8px; border-radius:18px; }
        .dev-card.min .dc-min { transform:rotate(180deg); }
        /* ساعة أعلى اليمين */
        #live-clock { position:fixed; top:14px; right:18px; z-index:100; display:flex; align-items:center; gap:12px; direction:ltr; padding:8px 16px 8px 12px; border-radius:20px; color:#fff; background:linear-gradient(135deg,#103d42 0%,#16626a 100%); border:1px solid rgba(255,255,255,.14); box-shadow:0 8px 22px rgba(16,61,66,.28), inset 0 1px 0 rgba(255,255,255,.12); font-family:'Cairo',sans-serif; user-select:none; pointer-events:none; }
        #live-clock .lc-ic { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(228,255,26,.14); font-size:1.05rem; }
        #live-clock .lc-time { display:flex; align-items:baseline; gap:2px; font-weight:900; font-size:1.55rem; line-height:1; letter-spacing:.5px; font-variant-numeric:tabular-nums; }
        #live-clock .lc-sec { font-size:.85rem; font-weight:800; color:#bef264; margin-left:3px; }
        #live-clock .lc-ap { font-size:.7rem; font-weight:800; color:#0f172a; background:#d9f99d; border-radius:6px; padding:1px 5px; margin-left:6px; align-self:center; }
        #live-clock .lc-colon { animation:lcBlink 1s steps(1) infinite; }
        #live-clock .lc-date { font-size:.72rem; font-weight:700; color:#a7f3d0; margin-top:3px; direction:rtl; text-align:left; white-space:nowrap; }
        @keyframes lcBlink { 50% { opacity:.25; } }
        @media (max-width:640px) { #live-clock { top:auto; bottom:calc(50px + env(safe-area-inset-bottom,0px)); right:10px; padding:6px 12px 6px 8px; gap:8px; } #live-clock .lc-time { font-size:1.2rem; } #live-clock .lc-ic { width:28px; height:28px; font-size:.9rem; } }
        #logout-btn { position:fixed; top:18px; left:18px; z-index:100; background:#fff; border:2px solid #cbd5e1; border-radius:14px; padding:8px 18px; font-family:'Cairo',sans-serif; font-weight:700; font-size:0.9rem; cursor:pointer; color:#374151; transition:all 0.2s; box-shadow:0 2px 8px rgba(0,0,0,0.07); }

        .adm-brand-t { color: #fff; font-weight: 900; font-size: 1.05rem; line-height: 1.1; text-align: left; }
        .adm-brand-s { color: #8fb5b3; font-weight: 700; font-size: .72rem; text-align: left; }
        .adm-side > button { width: 100% !important; justify-content: flex-start !important; gap: 12px !important; background: transparent !important; border: 0 !important; border-radius: 12px !important; color: #a9c9c7 !important; padding: 11px 14px !important; font-size: .92rem !important; box-shadow: none !important; transform: none !important; }
        .adm-side > button > span:first-child { filter: grayscale(1) brightness(1.7); opacity: .9; font-size: 1.05rem; }
        .adm-side > button:hover { background: #16494e !important; color: #d6fd26 !important; box-shadow: inset -3px 0 0 #d6fd26 !important; }
        .adm-side > button:hover > span:first-child { filter: none; }
        .adm-side > span { display: block !important; width: 100% !important; height: 1px !important; margin: 6px 0 !important; background: #1f5a5f !important; }
        @media (max-width: 820px) {
            #admin-section:has(> .adm-side) { display: block; }
            .adm-side { position: static !important; margin-bottom: 16px; }
        }
    
        /* ===== جدول المسؤول (نفس ألوان القائمة الجانبية) ===== */
        .adm-tablewrap { border: 1px solid #cfe3e1 !important; border-radius: 20px !important; box-shadow: 0 6px 18px rgba(16,61,66,.08); background: #fff; }
        #reportTable thead tr { background: #103d42 !important; border-bottom: 0 !important; }
        #reportTable thead th { color: #e6f4f2 !important; font-weight: 800 !important; padding: 14px 12px !important; white-space: nowrap; }
        #reportTable thead th:first-child { color: #d6fd26 !important; }
        #reportTable thead th.text-amber-700 { color: #fcd34d !important; }
        #reportTable thead th.text-emerald-700 { color: #86efac !important; }
        #reportTable thead th.text-blue-700 { color: #93c5fd !important; }
        #reportTable thead th.text-red-700 { color: #fca5a5 !important; }
        #reportTable tbody tr { border-bottom: 1px solid #e3efee !important; transition: background .15s; }
        #reportTable tbody tr:nth-child(even) { background: #f6fbfa; }
        #reportTable tbody tr:hover { background: #e8f5f3; }
        #reportTable tbody td:first-child { color: #103d42 !important; font-weight: 900; }
        #reportTable tbody button { border-radius: 999px !important; }
    
        .adm-side > .adm-sec-label { color: #fca5a5; font-size: .72rem; font-weight: 800; padding: 4px 14px 2px; text-align: right; }
        .adm-side > button.adm-primary { background: #d6fd26 !important; color: #103d42 !important; font-weight: 900 !important; margin-top: 2px; }
        .adm-side > button.adm-primary > span:first-child { filter: none; opacity: 1; }
        .adm-side > button.adm-primary:hover { filter: brightness(.95); box-shadow: none !important; color: #103d42 !important; }
        .adm-side > button.adm-danger:hover { color: #fca5a5 !important; box-shadow: inset -3px 0 0 #f87171 !important; }
    
        /* ===== تصميم بطاقات الموظفين الجديد ===== */
        #app { gap: 22px; }
        .card-box { position: relative; overflow: hidden; border: 1px solid #e2e8f0; border-radius: 28px; padding: 24px;
            box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 12px 28px -12px rgba(15,23,42,.14); background: #fff; }
        .card-box::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 5px; background: #cbd5e1; }
        .card-box.attendance-active { background: linear-gradient(180deg,#f0fdf4 0%,#fff 38%); border-color: #bbf7d0; }
        .card-box.attendance-active::before { background: linear-gradient(90deg,#22c55e,#86efac); }
        .card-box.break-active { background: linear-gradient(180deg,#fef2f2 0%,#fff 38%); border-color: #fecaca; }
        .card-box.break-active::before { background: linear-gradient(90deg,#ef4444,#fca5a5); }
        .card-box.rest-active { background: linear-gradient(180deg,#fff7ed 0%,#fff 38%); border-color: #fed7aa; }
        .card-box.rest-active::before { background: linear-gradient(90deg,#f97316,#fdba74); }
        .card-box.off-active { background: linear-gradient(180deg,#eff6ff 0%,#fff 38%); border-color: #bfdbfe; }
        .card-box.off-active::before { background: linear-gradient(90deg,#3b82f6,#93c5fd); }
        .card-box:hover { transform: translateY(-4px); box-shadow: 0 2px 4px rgba(15,23,42,.05), 0 24px 40px -14px rgba(15,23,42,.22); }
        .my-card-highlight { border: 2px solid #22c55e !important; box-shadow: 0 0 0 5px rgba(34,197,94,.14), 0 12px 28px -12px rgba(15,23,42,.14) !important; }

        .card-box > .emp-brand { background: linear-gradient(135deg,#103d42,#1b5a60); margin: -24px -24px 20px; padding: 14px 20px 12px; border-radius: 0; border-bottom: 5px solid transparent; }
        .card-box > .emp-brand .adm-logo { width: 36px; height: 36px; border-radius: 10px; box-shadow: 0 0 0 2px rgba(255,255,255,.15); }

        .emp-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
        .emp-avatar { width: 54px; height: 54px; flex: none; border-radius: 18px; display: grid; place-items: center; font-weight: 900; font-size: 1.5rem; color: #fff; text-transform: uppercase;
            background: linear-gradient(135deg,#64748b,#94a3b8); box-shadow: 0 6px 14px -4px rgba(15,23,42,.3); }
        .attendance-active .emp-avatar { background: linear-gradient(135deg,#16a34a,#4ade80); }
        .break-active .emp-avatar { background: linear-gradient(135deg,#dc2626,#f87171); }
        .rest-active .emp-avatar { background: linear-gradient(135deg,#ea580c,#fb923c); }
        .off-active .emp-avatar { background: linear-gradient(135deg,#2563eb,#60a5fa); }
        .emp-id { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
        .emp-name { font-weight: 900; font-size: 1.2rem; color: #0f172a; line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .emp-name span { vertical-align: middle; }
        .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px 3px 9px; border-radius: 999px; font-size: .75rem; font-weight: 800; background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
        .status-pill i { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
        .attendance-active .status-pill { background: #dcfce7; color: #15803d; border-color: #86efac; }
        .attendance-active .status-pill i { background: #22c55e; animation: pulseDot 1.6s infinite; }
        .break-active .status-pill { background: #fee2e2; color: #b91c1c; border-color: #fca5a5; }
        .break-active .status-pill i { background: #ef4444; animation: pulseDot 1.2s infinite; }
        .rest-active .status-pill { background: #ffedd5; color: #c2410c; border-color: #fdba74; }
        .rest-active .status-pill i { background: #f97316; }
        .off-active .status-pill { background: #dbeafe; color: #1d4ed8; border-color: #93c5fd; }
        .off-active .status-pill i { background: #3b82f6; }
        @keyframes pulseDot { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.55); } 70% { box-shadow: 0 0 0 7px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
        .emp-time { text-align: right; line-height: 1.15; flex: none; }
        .emp-time small { display: block; font-size: .65rem; font-weight: 800; color: #94a3b8; margin-bottom: 2px; }
        .emp-time .timer-text { margin: 0; font-size: 1.35rem; font-variant-numeric: tabular-nums; letter-spacing: .3px; }

        .emp-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 20px; }
        .stat-tile { background: rgba(255,255,255,.85); border: 1px solid #e2e8f0; border-radius: 16px; padding: 10px 8px; text-align: center; }
        .stat-tile span { display: block; font-size: .66rem; font-weight: 800; color: #94a3b8; margin-bottom: 3px; }
        .stat-tile b { font-size: .9rem; font-weight: 900; color: #0f172a; }
        .stat-tile .task-val { color: #2563eb; }
        .emp-stats { gap: 10px; margin-bottom: 18px; }
        .stat-tile { padding: 11px 8px; border-radius: 16px; display: flex; flex-direction: column; justify-content: center; min-height: 72px; }
        .stat-tile span { font-size: .74rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stat-tile { min-width: 0; } .stat-tile b { overflow: hidden; text-overflow: ellipsis; }
        .card-box { container-type: inline-size; }
        @container (max-width: 330px) { .emp-stats { gap: 6px; } .stat-tile { padding: 9px 4px; min-height: 64px; } .stat-tile span { font-size: .64rem; } .stat-tile b { font-size: .84rem; white-space: normal; overflow: visible; line-height: 1.25; } .stat-tile b .st-sub { font-size: .66rem; } }
        .stat-tile b { font-size: 1.02rem; line-height: 1.3; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .stat-tile b .st-sub { display: block; font-size: .74rem; font-weight: 800; color: #94a3b8; margin-top: 2px; }
        html.a3-dark .stat-tile b .st-sub { color: #7c8ba3; }

        .task-btn { border-radius: 999px; padding: 10px 6px; font-size: .82rem; background: #f8fafc; box-shadow: 0 1px 0 rgba(15,23,42,.04); }
        .task-btn:hover { background: #fff; transform: translateY(-1px); }
        .task-btn.active { background: linear-gradient(135deg,#16a34a,#22c55e); box-shadow: 0 6px 14px -4px rgba(34,197,94,.55); }
        .btn-opt { border-radius: 16px; background: #f8fafc; box-shadow: 0 1px 0 rgba(15,23,42,.04); transition: all .18s; }
        .btn-opt:hover { background: #fff; transform: translateY(-1px); box-shadow: 0 6px 14px -6px rgba(15,23,42,.25); }
        .btn-opt:active, .task-btn:active { transform: scale(.97); }
    
        /* ===== القائمة الجانبية بالإنكليزي: اتجاه LTR ===== */
        .adm-side { direction: ltr; }
        html.a3-ar .adm-side { direction: rtl; }
        html.a3-ar .adm-side > button, html.a3-ar .adm-side > .adm-sec-label { text-align: right; }
        html.a3-ar .adm-side > button:hover { box-shadow: inset -3px 0 0 #d6fd26 !important; }
        html.a3-ar .adm-side > button.adm-danger:hover { box-shadow: inset -3px 0 0 #f87171 !important; }
        html.a3-ar .adm-side > button.adm-primary:hover { box-shadow: none !important; }
        .adm-side > button { text-align: left; }
        .adm-side > .adm-sec-label { text-align: left; }
        .adm-side > button:hover { box-shadow: inset 3px 0 0 #d6fd26 !important; }
        .adm-side > button.adm-danger:hover { box-shadow: inset 3px 0 0 #f87171 !important; }
        .adm-side > button.adm-primary:hover { box-shadow: none !important; }
        /* ===== بطاقة المطوّر: موضع أعلى + حركة من اليسار إلى اليمين ===== */
        .dev-card.fixed-bl { top:auto; bottom:calc(14px + env(safe-area-inset-bottom,0px)); }   /* أسفل الصفحة بعد الدخول */
        .dev-card.in-login { order:0; margin-top:18px; margin-bottom:0; }   /* الشريط أسفل بطاقة الدخول */
        .dev-card.in, .dev-card.in.fixed-bl { animation:dcSlideLR 24s linear forwards; }
        .dev-card.out { animation:none; }
        @keyframes dcSlideLR {

        const SUPABASE_URL = 'https://eygohyybhidlsycblfop.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_6Y3sDrJirAA8O2j2Iugpfg_WUOr8IBm';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
            auth: { persistSession: false, autoRefreshToken: true, detectSessionInUrl: false }
        });
        // الشاشة مشتركة بين الموظفين: لا نحتفظ بجلسة قديمة بعد إعادة تحميل الصفحة

        // ===== إعدادات قواعد العمل الجديدة =====
        const WORK_LOCATION = { lat: 33.293117, lng: 44.433205 };   // موقع العمل
        const WORK_RADIUS_METERS = 100;                   // أقصى مسافة مسموحة لتسجيل الحضور (100 متر)
        // المجموعات: كل مجموعة قائمة بمفاتيح الموظفين (employee_key). الموظفون غير المذكورين يُعتبرون في مجموعة واحدة مشتركة.
        // ===== خصم التأخير عن بداية الدوام =====
        // مفتاح الموظف أو جزء من اسمه (عربي/إنجليزي) => وقت بداية الدوام
        const SHIFT_RULES = [
            // off = يوم الأوف الأسبوعي (0=الأحد 1=الاثنين 2=الثلاثاء 3=الأربعاء 4=الخميس 5=الجمعة 6=السبت)
            { match: /نور|nour|noor/i,                    start: '11:00', off: 0 },
            { match: /فاروق|farouk|farouq|farooq|faruq|faroq/i,       start: '11:00', off: 2 },
            { match: /هبه|hiba|heba|hebah/i,             start: '10:00', off: 5 },
            { match: /احمد|ahmed|ahmad/i,                start: '07:30', off: 6 }
        ];
        let LATE_GRACE_MIN = 5;         // سماحية بالدقائق بعد بداية الدوام
        let LATE_BASE_POINTS = 5;       // الخصم الأساسي عند تجاوز السماحية
        let LATE_EXTRA_POINTS = 3;      // خصم إضافي لكل خطوة تأخير إضافية
        let LATE_EXTRA_STEP_MIN = 5;    // طول الخطوة بالدقائق
        let LATE_MAX_POINTS = 30;       // أقصى خصم للتأخير في اليوم
        function _normAr(s) { return String(s || '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه'); }
        function _ruleFor(id) {
            const hay = _normAr(id) + ' ' + _normAr((employeesData[id] || {}).name);
            return SHIFT_RULES.find(x => x.match.test(hay)) || null;
        }
        function getShiftStart(id) {
            const m = _empMeta[id];
            if (m && m.shift) return String(m.shift).slice(0, 5);
            const r = _ruleFor(id); return r ? r.start : null;
        }
        function getOffDay(id) {
            const m = _empMeta[id];
            if (m && m.off !== null && m.off !== undefined) return m.off;   // المحفوظ من لوحة المسؤول (أوقات الدوام) هو المرجع
            const r = _ruleFor(id); return r ? r.off : null;                // وإلا القواعد الثابتة SHIFT_RULES
        }
        function isOffDay(id, dateStr) {
            const od = getOffDay(id); if (od === null || od === undefined) return false;
            const p = String(dateStr).split('-').map(Number); if (p.length < 3) return false;
            return new Date(p[0], p[1] - 1, p[2]).getDay() === od;
        }
        function _startLabel(id, dateStr, st) {
            const v = String(st || '');
            if (!v || v === 'Absent' || v === 'لم يحضر') return isOffDay(id, dateStr) ? 'OFF' : (v ? 'Absent' : '-');
            return v;
        }
        function calcLatePenalty(id, now) {
            const st = getShiftStart(id); if (!st) return null;
            if (isOffDay(id, _ymd(new Date(now)))) return null;   // يوم الأوف: لا خصم أبداً
            const [h, m] = st.split(':').map(Number);
            const sd = new Date(now); sd.setHours(h, m, 0, 0);
            const late = Math.floor((now - sd.getTime()) / 60000);
            if (late <= LATE_GRACE_MIN) return null;
            const pts = Math.min(LATE_MAX_POINTS, LATE_BASE_POINTS + LATE_EXTRA_POINTS * Math.floor((late - LATE_GRACE_MIN) / LATE_EXTRA_STEP_MIN));
            return { late, points: pts, start: st };
        }

        const MAX_BREAK_MINUTES = 15;   // البريك ينتهي تلقائياً بعد هذه المدة (غيّر الرقم أو ضع 0 للتعطيل)
        const MAX_REST_MINUTES = 20;    // الراحة تنتهي تلقائياً بعد هذه المدة (0 للتعطيل)
        let BREAK_SCORE_MAX_PENALTY = 10;      // أقصى خصم متدرج على استهلاك البريك (من 100). من يأخذ بريك أقل يحصل على تقييم أعلى. ضع 0 للتعطيل
        let BREAK_SCORE_ALLOW_PER_HOUR = 5;    // مسموح البريك (دقائق لكل ساعة عمل) — يُستخدم كمقياس للنسبة
        // خصم متدرج حسب كمية البريك: 0 بريك = 0 خصم، والخصم يزيد تدريجياً حتى يبلغ الحد الأقصى عند استهلاك كامل المسموح
        // إجازات معتمدة (أيام) وأذونات زمنية لليوم الحالي — تُحدَّث من refreshMonthlyRatings (جهاز المسؤول)
        let _leaveDays = {}, _permToday = {};
        function onLeaveDay(id, ds) { const st = _leaveDays[id]; return !!(st && st.has(ds)); }
        function permMinutesToday(id) { return (_permToday[id] || []).reduce((a, p) => a + (p.mins || 0), 0); }
        // التأخير مع احتساب الإذن الزمني: null = لا إذن مؤثر، وإلا عدد نقاط الخصم (0 إن غُطّي التأخير)
        function lateWithPerm(id, d) {
            try {
                const perms = _permToday[id]; if (!perms || !perms.length || !d || !d.startTime) return null;
                const sh = getShiftStart(id); if (!sh) return null;
                const sm = _scParseMin(sh); if (sm === null) return null;
                const ex = _scExcuseTo(perms, sm); if (ex === null) return null;
                const dt = new Date(d.startTime), am = dt.getHours() * 60 + dt.getMinutes();
                const late = am - ex; if (late <= LATE_GRACE_MIN) return 0;
                return Math.min(LATE_MAX_POINTS, LATE_BASE_POINTS + LATE_EXTRA_POINTS * Math.floor((late - LATE_GRACE_MIN) / LATE_EXTRA_STEP_MIN));
            } catch (e) { return null; }
        }

        // ===== البريك بالثواني: الخصم يبدأ عند تجاوز 5:00 (أي من 5:01) =====
        const BREAK_HOUR_LIMIT_SEC = 300;
        const _BRK_REM_KEY = 'a3_brk_rem_v1';   // بقايا ثواني البريك (السيرفر يحفظ دقائق كاملة فقط)
        function _brkRemAll() { try { return JSON.parse(localStorage.getItem(_BRK_REM_KEY) || '{}') || {}; } catch (e) { return {}; } }
        function _brkRemGet(id, hIdx) {
            const all = _brkRemAll(), day = all[getTodayDateString()] || {};
            return Number((day[id] || {})[hIdx]) || 0;
        }
        function _brkRemAdd(id, hIdx, sec) {
            try {
                const all = _brkRemAll(), t = getTodayDateString();
                const out = {}; out[t] = all[t] || {};            // نحتفظ باليوم الحالي فقط
                out[t][id] = out[t][id] || {};
                out[t][id][hIdx] = Math.min(59, Math.max(0, Math.floor(sec)));
                localStorage.setItem(_BRK_REM_KEY, JSON.stringify(out));
            } catch (e) {}
        }
        // ثواني البريك داخل ساعة الدوام رقم hIdx (المحفوظ + بقايا الثواني + الجاري الآن)
        function breakSecInHour(d, id, hIdx, now) {
            const hb = (d && d.hourlyBreaks) || {};
            let sec = (Number(hb[hIdx]) || 0) * 60 + _brkRemGet(id, hIdx);
            if (d && d.status === 'بريك' && d.lastActionTime && d.startTime) {
                const hs = d.startTime + hIdx * 3600000, he = hs + 3600000;
                const a = Math.max(d.lastActionTime, hs), b = Math.min(now, he);
                if (b > a) sec += Math.floor((b - a) / 1000);
            }
            return sec;
        }
        function breakViolations(sec) { return sec > BREAK_HOUR_LIMIT_SEC ? Math.floor((sec - BREAK_HOUR_LIMIT_SEC - 1) / 3600) + 1 : 0; }
        function mmss(sec) { sec = Math.max(0, Math.floor(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }

        function breakUsagePenalty(d, now, id) {
            if (!BREAK_SCORE_MAX_PENALTY || !d || !d.startTime) return 0;
            const live = (d.status === 'بريك' && d.lastActionTime) ? Math.max(0, Math.floor((now - d.lastActionTime) / 60000)) : 0;
            const used = (Number(d.totalBreakMinutes) || 0) + live;
            if (used <= 0) return 0;
            const hrs = Math.min(12, Math.max(1, (now - d.startTime) / 3600000));
            const allow = BREAK_SCORE_ALLOW_PER_HOUR * hrs + (id ? permMinutesToday(id) : 0);
            return Math.round(BREAK_SCORE_MAX_PENALTY * Math.min(1, used / allow));
        }
        let VIOLATION_POINTS = 3;             // خصم كل مخالفة (ساعة بريك زائدة / استراحة زائدة)
        let REST_SCORE_MAX_PENALTY = 5;        // أقصى خصم متدرج على استهلاك الاستراحة (المسموح 20 د). من يأخذ استراحة أقل تقييمه أعلى. 0 للتعطيل
        let REST_SCORE_ALLOW_MIN = 20;         // مسموح الاستراحة يومياً (دقيقة) كمقياس للنسبة
        let ORDERS_BONUS_MAX = 5;              // أقصى مكافأة على الطلبات (قبول + توزيع) في اليوم، تُبلغ حدها عند الوصول لهدف SC_ORDERS_DAILY_TARGET. 0 للتعطيل
        function restUsagePenalty(d, now, id) {
            if (!REST_SCORE_MAX_PENALTY || !d || !d.startTime) return 0;
            const live = (d.status === 'راحة' && d.lastActionTime) ? Math.max(0, Math.floor((now - d.lastActionTime) / 60000)) : 0;
            const used = (Number(d.totalRestMinutes) || 0) + live;
            if (used <= 0) return 0;
            return Math.round(REST_SCORE_MAX_PENALTY * Math.min(1, used / (REST_SCORE_ALLOW_MIN + (id ? permMinutesToday(id) : 0))));
        }
        // جلب طلبات يوم للمسؤول: الدالة الأحدث alsaree3_orders_admin ثم القديمة alsaree3_dispatch_admin كاحتياط (نفس منطق نافذة المهام)
        async function _ordersAdminRpc(date) {
            try {
                const r = await supabaseClient.rpc('alsaree3_orders_admin', { p_date: date });
                if (!r.error) return r;
                const r2 = await supabaseClient.rpc('alsaree3_dispatch_admin', { p_date: date });
                return r2.error ? r2 : r2;
            } catch (e) { return { error: { message: String((e && e.message) || e) } }; }
        }
        // عدد طلبات اليوم (قبول + توزيع، بدون المتأخرة) لكل موظف — يُحدَّث من السيرفر بشكل دوري
        let _ordCountToday = {}, _ordCountDate = '', _ordCountBusy = false, _ordCountAt = 0;
        async function refreshOrderCounts(force) {
            if (!loggedInId || _ordCountBusy) return;
            if (!force && Date.now() - _ordCountAt < 45000) return;
            _ordCountBusy = true;
            try {
                const today = getTodayDateString();
                const cnt = {};
                if (loggedInId === '__admin__') {
                    const [o, t] = await Promise.all([
                        _ordersAdminRpc(today),
                        supabaseClient.rpc('alsaree3_tickets_admin', { p_date: today })
                    ]);
                    if (o.error) return;
                    (o.data || []).forEach(r => { if (String(r.kind || '').endsWith('_late')) return; cnt[r.employee_key] = (cnt[r.employee_key] || 0) + 1; });
                    if (!t.error) (t.data || []).forEach(r => { if (r.kind === 'accept' || (r.kind === 'self' && r.solved_at)) cnt[r.employee_key] = (cnt[r.employee_key] || 0) + 1; });   // التكتات المضافة تحسب بالمكافأة
                } else {
                    const [a, b] = await Promise.all(['accept', 'dispatch'].map(k => supabaseClient.rpc('alsaree3_dispatch_my_today', { p_kind: k })));
                    if (a.error || b.error) return;
                    const _tkToday = (typeof _tkData !== 'undefined' ? _tkData : []).filter(x => x.kind === 'self' && x.solved_at && _ymd(new Date(x.created_at)) === today).length;
                    cnt[loggedInId] = (a.data || []).length + (b.data || []).length + _tkToday;
                }
                _ordCountToday = cnt; _ordCountDate = today; _ordCountAt = Date.now();
                try { checkAndApplyRatings(); } catch (e) {}
            } catch (e) { console.warn('[OrderCounts]', e); }
            finally { _ordCountBusy = false; }
        }
        function ordersBonus(id) {
            if (!ORDERS_BONUS_MAX || _ordCountDate !== getTodayDateString()) return 0;
            const n = _ordCountToday[id] || 0;
            if (n <= 0) return 0;
            return Math.round(ORDERS_BONUS_MAX * Math.min(1, n / SC_ORDERS_DAILY_TARGET));
        }
        // خصم التأخير عن بداية الدوام المحددة للموظف (احتياطي إن لم يسجّله السيرفر). يحترم المسامحة ويوم الأوف
        function lateFallbackPenalty(id, d) {
            try {
                if (!d || !d.startTime) return 0;
                const hb = d.hourlyBreaks || {};
                if (hb.lateWaived) return 0;
                if (onLeaveDay(id, getTodayDateString())) return 0;
                if (lateWithPerm(id, d) !== null) return 0;
                if (_ymd(new Date(d.startTime)) !== getTodayDateString()) return 0;
                const lp = calcLatePenalty(id, d.startTime);
                if (!lp) return 0;
                return Math.max(0, lp.points - (Number(hb.latePenalty) || 0));   // الفرق فقط، حتى لا يُخصم مرتين
            } catch (e) { return 0; }
        }
        // ===== التقييم الشهري الحي: متوسط التقييم اليومي لأيام الدوام الفعلية في الشهر + تقييم اليوم الحالي =====
        let _monthHist = {}, _todayHist = {}, _monthHistAt = 0, _monthHistBusy = false;
        async function refreshMonthlyRatings(force) {
            if (loggedInId !== '__admin__' || _monthHistBusy) return;
            if (!force && Date.now() - _monthHistAt < 120000) return;
            _monthHistBusy = true;
            try {
                const today = getTodayDateString(), start = today.slice(0, 7) + '-01';
                const { data, error } = await supabaseClient.from('alsaree3_history')
                    .select('employee_key,history_date,start_time_str,rating').gte('history_date', start).lte('history_date', today).limit(5000);
                if (error) return;
                try { await _loadEmpMeta(); } catch (e) {}
                const leaveSet = {};
                try {
                    const { data: lv } = await supabaseClient.from('alsaree3_leave_requests').select('employee_key,kind,start_date,days,from_time,to_time').eq('status', 'approved');
                    const _pt = {};
                    (lv || []).forEach(q => {
                        if (q.kind === 'day') _expandDates(q.start_date, q.days).forEach(ds => { (leaveSet[q.employee_key] = leaveSet[q.employee_key] || new Set()).add(ds); });
                        else if (q.start_date === today) { const f = _scParseMin(q.from_time), t = _scParseMin(q.to_time); if (f !== null && t !== null && t > f) (_pt[q.employee_key] = _pt[q.employee_key] || []).push({ from: f, to: t, mins: t - f }); }
                    });
                    _leaveDays = leaveSet; _permToday = _pt;
                } catch (e) {}
                const agg = {}, tod = {};
                (data || []).forEach(r => {
                    const k = r.employee_key;
                    const rd = _resetUpTo(k);
                    if (rd && r.history_date <= rd) return;                          // قبل التصفير
                    if (leaveSet[k] && leaveSet[k].has(r.history_date)) return;      // إجازة معتمدة
                    const st = String(r.start_time_str || '');
                    if (!st || st === 'EXCLUDED' || st === 'Absent' || st === 'لم يحضر' || st.toUpperCase().startsWith('OFF')) return;
                    if (isOffDay(k, r.history_date)) return;
                    const rt = r.rating == null ? 100 : (Number(r.rating) || 0);
                    if (r.history_date === today) { tod[k] = rt; return; }
                    const a = agg[k] = agg[k] || { sum: 0, days: 0 };
                    a.sum += rt; a.days++;
                });
                _monthHist = agg; _todayHist = tod; _monthHistAt = Date.now();
                applyMonthlyRatings();
            } catch (e) { console.warn('[MonthlyRatings]', e); }
            finally { _monthHistBusy = false; }
        }
        function monthlyWith(id, todayRating) {
            if (!_monthHistAt) return null;
            const h = _monthHist[id] || { sum: 0, days: 0 };
            let sum = h.sum, days = h.days;
            if (todayRating !== null && todayRating !== undefined && !isNaN(todayRating)) { sum += Number(todayRating); days++; }
            return days > 0 ? Math.round(sum / days) : 100;
        }
        function applyMonthlyRatings() {
            if (loggedInId !== '__admin__' || !_monthHistAt) return;
            const today = getTodayDateString();
            for (const id in employeesData) {
                const d = employeesData[id]; if (!d) continue;
                const hb = d.hourlyBreaks || {};
                let tr = null;
                if (isOffDay(id, today) || onLeaveDay(id, today) || (_resetUpTo(id) && _resetUpTo(id) >= today)) tr = null;
                else if (d.startTime && d.status !== 'أوف' && _ymd(new Date(d.startTime)) === today && hb.excluded !== today) tr = Number(d.rating);
                else if (!isOffDay(id, today) && !onLeaveDay(id, today) && _todayHist[id] !== undefined) tr = _todayHist[id];
                d.monthlyRating = monthlyWith(id, tr);
            }
        }
        const BREAK_GROUPS = [];                          // مثال: [['ahmed','ali','sara'], ['omar','huda']]
        const BLOCK_BREAK_IF_GROUP_BUSY = true;           // true = منع البريك | false = السماح مع خصم من التقييم
        const GROUP_BREAK_PENALTY_POINTS = 5;             // الخصم عند بريك أثناء بريك زميل (يُطبق فقط إذا BLOCK = false)

        function getGroupMates(id) {
            const g = BREAK_GROUPS.find(arr => arr.includes(id));
            const all = Object.keys(employeesData);
            if (g) return g.filter(k => k !== id && employeesData[k]);
            const grouped = new Set(BREAK_GROUPS.flat());
            return all.filter(k => k !== id && !grouped.has(k));
        }
        function getMateOnBreak(id) {
            const _today = getTodayDateString();
            const _now = Date.now();
            const k = getGroupMates(id).find(m => {
                const e = employeesData[m];
                if (!e || e.status !== 'بريك' || e.lastActiveDate !== _today) return false;
                // بريك تجاوز الحد الأقصى (مثلاً جهاز الزميل مغلق) لا يجب أن يمنع الآخرين للأبد
                if (MAX_BREAK_MINUTES > 0 && e.lastActionTime && (_now - e.lastActionTime) >= MAX_BREAK_MINUTES * 60000) return false;
                return true;
            });   // بريك قديم عالق من أمس لا يمنع الآخرين
            return k ? employeesData[k] : null;
        }
        function distanceMeters(lat1, lng1, lat2, lng2) {
            const R = 6371000, toRad = x => x * Math.PI / 180;
            const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
            const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
            return 2 * R * Math.asin(Math.sqrt(a));
        }
        // يرجع { ok, msg } — الدخول والحضور مسموحان فقط ضمن نصف قطر WORK_RADIUS_METERS من موقع العمل
        // موقع العمل الخاص بالموظف (يحدده المسؤول) — إن لم يُحدَّد أو لم تُضف الأعمدة نستخدم الموقع العام
        async function getEmployeeGeo(empKey) {
            const def = { lat: WORK_LOCATION.lat, lng: WORK_LOCATION.lng, radius: WORK_RADIUS_METERS };
            if (!empKey) return def;
            try {
                const { data, error } = await supabaseClient.from('alsaree3_employees')
                    .select('work_lat, work_lng, work_radius').eq('employee_key', empKey).maybeSingle();
                if (error || !data) return def;
                const la = Number(data.work_lat), ln = Number(data.work_lng), rd = Number(data.work_radius);
                const radius = (isFinite(rd) && rd > 0) ? rd : WORK_RADIUS_METERS;
                if (data.work_lat === null || data.work_lng === null || !isFinite(la) || !isFinite(ln)) return { lat: def.lat, lng: def.lng, radius };   // نطاق خاص بالموقع العام
                return { lat: la, lng: ln, radius };
            } catch (e) { return def; }
        }
        async function verifyWorkLocation(empKey) {
            const geo = await getEmployeeGeo(empKey);
            return new Promise(resolve => {
                if (geo.lat === null || geo.lng === null) {
                    console.warn('[Geofence] لم يتم ضبط WORK_LOCATION — التحقق من الموقع معطّل');
                    return resolve({ ok: true });
                }
                if (!navigator.geolocation) return resolve({ ok: false, msg: 'This browser does not support location services' });
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        const dist = distanceMeters(pos.coords.latitude, pos.coords.longitude, geo.lat, geo.lng);
                        if (dist <= geo.radius) resolve({ ok: true, lat: pos.coords.latitude, lng: pos.coords.longitude });
                        else resolve({ ok: false, msg: 'You are too far from your assigned work location (' + Math.round(dist) + ' m). You must be within ' + geo.radius + ' m.' });
                    },
                    err => resolve({ ok: false, msg: err.code === 1 ? 'Please allow Location access in your browser to check in' : 'Could not determine your location, please try again' }),
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            });
        }

        // ===== تحويل بين أسماء الحقول في التطبيق (camelCase) وأعمدة قاعدة البيانات (snake_case) =====
        const EMP_FIELDS = {
            name: 'name', status: 'status', startTime: 'start_time', lastActionTime: 'last_action_time',
            lastActiveDate: 'last_active_date', totalBreakMinutes: 'total_break_minutes',
            totalRestMinutes: 'total_rest_minutes', totalWorkSeconds: 'total_work_seconds',
            hourlyBreaks: 'hourly_breaks', slotBreaks: 'slot_breaks', rating: 'rating',
            allowedBreakSaved: 'allowed_break_saved', currentTask: 'current_task',
            monthlyRating: 'monthly_rating', monthlyHistory: 'monthly_history'
        };
        const NUMERIC_COLS = new Set(['start_time','last_action_time','total_break_minutes','total_rest_minutes','total_work_seconds','rating','allowed_break_saved','monthly_rating']);
        const JSON_COLS = new Set(['hourly_breaks','slot_breaks','monthly_history']);

        function empFromRow(r) {           // صف من القاعدة → كائن التطبيق (الأعمدة غير الموجودة تُترك undefined)
            const o = {};
            for (const [camel, col] of Object.entries(EMP_FIELDS)) {
                if (!(col in r)) continue;
                let v = r[col];
                if (v !== null && v !== undefined) {
                    if (NUMERIC_COLS.has(col)) v = Number(v);
                    else if (JSON_COLS.has(col) && typeof v === 'string') { try { v = JSON.parse(v); } catch(e) { v = {}; } }
                }
                o[camel] = v;
            }
            return o;
        }
        function empToRow(obj) {           // كائن التطبيق → صف للقاعدة
            const row = {};
            for (const [camel, col] of Object.entries(EMP_FIELDS)) {
                if (obj[camel] === undefined) continue;
                let v = obj[camel];
                if (JSON_COLS.has(col) && (v === null)) v = {};
                row[col] = v;
            }
            return row;
        }
        function historyToRow(date, id, p) {
            const row = { history_date: date, employee_key: id };
            const map = { name:'name', startTimeStr:'start_time_str', totalDurationStr:'total_duration_str', currentTask:'current_task',
                          totalBreakMinutes:'total_break_minutes', totalRestMinutes:'total_rest_minutes', totalWorkSeconds:'total_work_seconds',
                          rating:'rating', monthlyRating:'monthly_rating', savedAt:'saved_at' };
            for (const [k, col] of Object.entries(map)) if (p[k] !== undefined) row[col] = p[k];
            return row;
        }
        function historyFromRow(r) {
            return { name: r.name, startTimeStr: r.start_time_str, totalDurationStr: r.total_duration_str, currentTask: r.current_task,
                     totalBreakMinutes: r.total_break_minutes, totalRestMinutes: r.total_rest_minutes, totalWorkSeconds: r.total_work_seconds,
                     rating: r.rating, monthlyRating: r.monthly_rating, savedAt: r.saved_at };
        }

        // ===== طبقة البيانات (كل القراءة/الكتابة تمر من هنا، والحماية الحقيقية في RLS) =====
        let _syncErrAt = 0;
        function reportSyncError(err, what) {
            console.error('[Supabase] فشل ' + what + ':', err);
            if (Date.now() - _syncErrAt > 30000) {
                _syncErrAt = Date.now();
                alert('⚠️ تعذّر حفظ التغيير على السيرفر (' + what + ').\nتحقق من الاتصال بالإنترنت، وإن استمرت المشكلة سجّل الخروج وادخل من جديد.');
            }
        }

        // ===== تطبيق نتيجة السيرفر على الواجهة (السيرفر هو المرجع الوحيد للأوقات والتقييم) =====
        function _applyServerRow(id, row) {
            if (!row || typeof row !== 'object') return;
            const parsed = empFromRow(row);
            _serverEmployees[id] = Object.assign({}, _serverEmployees[id] || {}, parsed);

        // تحديث بطاقة موظف واحد (للمسؤول فقط الآن؛ الموظف يمر عبر دوال السيرفر — والسيرفر يفرض ذلك أيضاً)
        const _writeChain = {};   // id -> آخر عملية كتابة (لضمان ترتيب الكتابات وعدم تقدّم القديمة على الجديدة)
        function safeUpdateEmployee(id, data) {
            const prev = _writeChain[id] || Promise.resolve();
            const next = prev.catch(() => {}).then(() => _doUpdateEmployee(id, data));
            _writeChain[id] = next;
            return next;
        }
        async function _doUpdateEmployee(id, data) {
            if (loggedInId !== '__admin__' && loggedInId !== id) return { ok: false, skipped: true };
            const row = empToRow(data);
            if (Object.keys(row).length === 0) return { ok: true };
            let lastErr = null;
            for (let attempt = 0; attempt < 3; attempt++) {
                if (attempt > 0) await new Promise(r => setTimeout(r, 600 * attempt));
                if (!_checkWriteRate()) return { ok: false, skipped: true };
                try {
                    const { data: res, error } = await supabaseClient.from('alsaree3_employees')
                        .update(row).eq('employee_key', id).select('employee_key');
                    if (!error && res && res.length > 0) return { ok: true };
                    if (!error && (!res || res.length === 0)) { lastErr = new Error('0 rows updated (RLS?)'); break; }  // رفض صلاحيات: لا فائدة من التكرار
                    lastErr = error;
                } catch (e) { lastErr = e; }   // انقطاع شبكة: أعد المحاولة
            }
            reportSyncError(lastErr, 'تحديث الموظف');
            return { ok: false };
        }

        // مسؤول فقط: تحديث عدة موظفين بمفاتيح بنمط employees/<id>/<field> (تستخدمها endOfDay)
        async function applyEmployeePathUpdates(paths) {
            const grouped = {};
            for (const [path, val] of Object.entries(paths)) {
                const m = path.match(/^employees\/([^/]+)\/(.+)$/);
                if (!m) continue;
                (grouped[m[1]] = grouped[m[1]] || {})[m[2]] = val;
            }
            const results = await Promise.all(Object.entries(grouped).map(async ([id, fields]) => {
                const row = empToRow(fields);
                if (Object.keys(row).length === 0) return true;
                const { error } = await supabaseClient.from('alsaree3_employees').update(row).eq('employee_key', id);
                if (error) { console.error('[Supabase] فشل تحديث', id, error); return false; }
                return true;
            }));
            if (results.some(ok => !ok)) throw new Error('فشل تحديث بعض الموظفين');
        }

        async function saveHistoryRow(date, id, payload) {
            if (loggedInId !== '__admin__' && loggedInId !== id) return;
            if (!_checkWriteRate()) return;
            const { error } = await supabaseClient.from('alsaree3_history')
                .upsert(historyToRow(date, id, payload), { onConflict: 'history_date,employee_key' });
            if (error) console.error('[Supabase] فشل حفظ الأرشيف:', error);
        }

        // مسؤول فقط: حفظ أرشيف عدة موظفين دفعة واحدة (مفاتيح بنمط history/<date>/<id>)
        async function applyHistoryPathUpdates(paths) {
            const rows = [];
            for (const [path, val] of Object.entries(paths)) {
                const m = path.match(/^history\/([^/]+)\/([^/]+)$/);
                if (m) rows.push(historyToRow(m[1], m[2], val));
            }
            if (rows.length === 0) return;
            const { error } = await supabaseClient.from('alsaree3_history')
                .upsert(rows, { onConflict: 'history_date,employee_key' });
            if (error) throw error;
        }

        async function fetchHistoryFor(date) {

                .select('*').eq('history_date', date).order('employee_key');

        // ===== المزامنة اللحظية (Realtime) مع مزامنة احتياطية دورية =====
        let _rtChannel = null;
        let _rtEverSubscribed = false;
        let _serverEmployees = {};
        function _snapshotClone() {
            const sorted = {};
            Object.keys(_serverEmployees).sort().forEach(k => { sorted[k] = _serverEmployees[k]; });
            return JSON.parse(JSON.stringify(sorted));
        }
        async function resyncEmployees() {
            _serverEmployees = await fetchEmployeesMap();
            handleEmployeesSnapshot(_snapshotClone());
        }
        function subscribeEmployees(skipInitialSync) {
            if (_rtChannel) return;
            _rtChannel = supabaseClient.channel('alsaree3-employees')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'alsaree3_employees' }, (payload) => {
                    if (payload.eventType === 'DELETE') {
                        delete _serverEmployees[payload.old.employee_key];
                    } else {
                        const key = payload.new.employee_key;
                        _serverEmployees[key] = Object.assign({}, _serverEmployees[key] || {}, empFromRow(payload.new));
                    }
                    handleEmployeesSnapshot(_snapshotClone());
                })
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        if (skipInitialSync && !_rtEverSubscribed) { _rtEverSubscribed = true; return; }
                        _rtEverSubscribed = true;
                        resyncEmployees().catch(() => {});   // إعادة اتصال: عوّض ما فاتك
                    }
                });
        }
        function unsubscribeEmployees() {
            if (_rtChannel) { supabaseClient.removeChannel(_rtChannel); _rtChannel = null; }
            _rtEverSubscribed = false;
            _serverEmployees = {};
        }
        // شبكة أمان: لو فاتت أحداث (نوم الجهاز/انقطاع) نعيد المزامنة كل 15 ثانية وعند العودة للتبويب
        setInterval(() => { if (loggedInId) resyncEmployees().catch(() => {}); }, 15000);
        window.addEventListener('online', () => { if (loggedInId) resyncEmployees().catch(() => {}); });
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && loggedInId) resyncEmployees().catch(() => {});
        });

        // ===== SECURITY v5: Device Fingerprint =====
        async function getDeviceFingerprint() {
            const raw = [
                navigator.userAgent,
                navigator.language,
                screen.width + 'x' + screen.height,
                new Date().getTimezoneOffset(),
                navigator.hardwareConcurrency || 0
            ].join('|');
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('').slice(0,16);
        }


        // ===== قراءة المتصفح ونظام التشغيل ونوع الجهاز من بصمة المتصفح (User-Agent) =====
        function _uaInfo(ua) {
            ua = String(ua || '');
            const v = (re) => { const m = ua.match(re); return m ? m[1].split('.')[0] : ''; };
            let browser = '', bIcon = '🌐';
            if (/EdgA?\/|Edg\//.test(ua))                 { browser = 'Edge ' + v(/EdgA?\/([\d.]+)/); bIcon = '🟦'; }
            else if (/OPR\/|Opera/.test(ua))              { browser = 'Opera ' + v(/OPR\/([\d.]+)/); bIcon = '🔴'; }
            else if (/SamsungBrowser\//.test(ua))         { browser = 'Samsung Internet ' + v(/SamsungBrowser\/([\d.]+)/); bIcon = '🟪'; }
            else if (/YaBrowser\//.test(ua))              { browser = 'Yandex ' + v(/YaBrowser\/([\d.]+)/); bIcon = '🟨'; }
            else if (/Firefox\/|FxiOS\//.test(ua))        { browser = 'Firefox ' + v(/(?:Firefox|FxiOS)\/([\d.]+)/); bIcon = '🦊'; }
            else if (/CriOS\//.test(ua))                  { browser = 'Chrome ' + v(/CriOS\/([\d.]+)/); bIcon = '🟢'; }
            else if (/Chrome\//.test(ua))                 { browser = 'Chrome ' + v(/Chrome\/([\d.]+)/); bIcon = '🟢'; }
            else if (/Safari\//.test(ua) && /Version\//.test(ua)) { browser = 'Safari ' + v(/Version\/([\d.]+)/); bIcon = '🧭'; }
            let os = '';
            if (/Windows NT 10/.test(ua)) os = 'Windows 10/11';
            else if (/Windows NT 6\.3/.test(ua)) os = 'Windows 8.1';
            else if (/Windows NT 6\.1/.test(ua)) os = 'Windows 7';
            else if (/Windows/.test(ua)) os = 'Windows';
            else if (/Android/.test(ua)) os = 'Android' + (v(/Android ([\d.]+)/) ? ' ' + v(/Android ([\d.]+)/) : '');
            else if (/iPhone|iPad|iPod/.test(ua)) os = (/iPad/.test(ua) ? 'iPadOS ' : 'iOS ') + v(/OS (\d+)_/);
            else if (/Mac OS X/.test(ua)) os = 'macOS';
            else if (/CrOS/.test(ua)) os = 'ChromeOS';
            else if (/Linux/.test(ua)) os = 'Linux';
            const device = /iPad|Tablet/.test(ua) ? '📲 تابلت' : /Mobi|Android|iPhone|iPod/.test(ua) ? '📱 موبايل' : '💻 كمبيوتر';
            return { browser: browser.trim(), bIcon, os, device };
        }
        async function logDeviceAccess(empId, empName) {
            try {
                const fp = await getDeviceFingerprint();
                const logEntry = {
                    empId, empName,
                    fingerprint: fp,
                    userAgent: (function () { const i = _uaInfo(navigator.userAgent); return ((i.browser || '?') + ' · ' + (i.os || '?') + ' | ' + navigator.userAgent).slice(0, 400); })(),
                    timestamp: Date.now(),
                    time: new Date().toLocaleString('ar-IQ')
                };
                await insertDeviceLog(logEntry);
            } catch(e) {}
        }
        let employeesData = {}, adminClickCount = 0;
        let isViewingHistory = false;
        let lastResetDate = null;
        let backupThrottle = {};
        let loggedInId = null;
        let localUpdateLock = false; // (قديم — لم يعد مستخدماً)
        // ===== حماية التغييرات المحلية لكل موظف (تمنع رجوع البريك/الحالة القديمة من السيرفر) =====
        const _pendingLocal = {};   // id -> { fields, ts, doneAt, seq }
        let _pendSeq = 0;
        const _staleResetAt = {};   // id -> آخر مرة أرسلنا فيها تصفير يوم قديم (لمنع تكرار الكتابة)
        function _markPending(id, fields) {
            const seq = ++_pendSeq;
            const keep = {};
            ['status','lastActionTime','startTime','currentTask','lastActiveDate'].forEach(k => { if (fields[k] !== undefined) keep[k] = fields[k]; });
            _pendingLocal[id] = { fields: keep, ts: Date.now(), doneAt: null, seq };
            return seq;
        }
        function _settlePending(id, seq, result) {
            const p = _pendingLocal[id];
            if (!p || p.seq !== seq) return;           // جاء تغيير أحدث بعده
            if (result && result.ok) { p.doneAt = Date.now(); }
            else { delete _pendingLocal[id]; resyncEmployees().catch(() => {}); } // فشل الحفظ: ارجع لحالة السيرفر الحقيقية
        }
        function _applyPending(freshData) {
            const now = Date.now();
            for (const id in _pendingLocal) {
                const p = _pendingLocal[id], srv = freshData[id];
                const expired = (now - p.ts > 60000) || (p.doneAt && now - p.doneAt > 10000);
                if (!srv || expired) { delete _pendingLocal[id]; continue; }
                const matched = Object.keys(p.fields).every(k => srv[k] === p.fields[k]);
                if (matched) { delete _pendingLocal[id]; continue; }  // السيرفر لحق بنا
                freshData[id] = { ...srv, ...p.fields };               // السيرفر لسا قديم: احتفظ بالمحلي
                if (employeesData[id]) {
                    ['totalBreakMinutes','totalRestMinutes','totalWorkSeconds','hourlyBreaks','slotBreaks','rating'].forEach(k => {
                        if (employeesData[id][k] !== undefined) freshData[id][k] = employeesData[id][k];
                    });
                }
            }
        }

        // ===== SECURITY: Session timeout — تسجيل خروج تلقائي بعد 8 ساعات =====
        let _sessionStart = null;
        const SESSION_TIMEOUT_MS = 8 * 60 * 60 * 1000; // 8 ساعات
        function _checkSessionTimeout() {
            if (!loggedInId || !_sessionStart) return;
            if (Date.now() - _sessionStart > SESSION_TIMEOUT_MS) {
                alert('⏰ Your session expired after 8 hours. Please log in again.');
                _performLogout();
            }
        }
        setInterval(_checkSessionTimeout, 60000); // تحقق كل دقيقة

        // ===== SECURITY: Global write rate limiter =====
        let _fbWriteCount = 0;
        let _fbWriteWindowStart = Date.now();
        const FB_MAX_WRITES_PER_MIN = 150; // حد أقصى 150 كتابة في الدقيقة لكل جهاز
        function _checkWriteRate() {
            const now = Date.now();
            if (now - _fbWriteWindowStart > 60000) { _fbWriteCount = 0; _fbWriteWindowStart = now; }
            if (_fbWriteCount >= FB_MAX_WRITES_PER_MIN) {
                console.warn('[SECURITY] write rate limit exceeded!');
                return false;
            }
            _fbWriteCount++;
            return true;
        }
        function getTodayDateString() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // ===== تسجيل الدخول عبر Supabase (اسم مستخدم + كلمة مرور) =====
        let _loginFails = 0, _loginLockUntil = 0;
        const _doLoginInner = async () => {
            const userEl = document.getElementById('login-username');
            const passEl = document.getElementById('login-password');
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');
            const username = userEl.value.trim().toLowerCase().slice(0, 64);
            const password = passEl.value;
            errorEl.textContent = '';
            if (!username) { errorEl.textContent = '⚠️ Enter your username'; return; }
            if (!/^[a-z0-9._@+-]{2,64}$/.test(username)) { errorEl.textContent = '❌ Incorrect username or password'; return; }
            if (Date.now() < _loginLockUntil) { errorEl.textContent = '⛔ Too many attempts, wait ' + Math.ceil((_loginLockUntil - Date.now()) / 1000) + ' seconds'; return; }
            if (!password) { errorEl.textContent = '⚠️ Enter your password'; return; }
            const _t0 = performance.now(), _T = [];
            const _mark = n => { _T.push(n + ' ' + Math.round(performance.now() - _t0) + 'ms'); };
            btn.disabled = true; btn.textContent = 'Verifying...';
            const resetBtn = () => { btn.disabled = false; btn.textContent = 'Login →'; };

            // إذا كتب بريده الحقيقي كامل (يحتوي على @) استخدمه كما هو — مخصص لحساب المسؤول
            const email = username.includes('@') ? username : `${username}@alsaree3.local`;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            _mark('auth');
            if (error) {
                console.error(error);
                if (++_loginFails >= 5) { _loginLockUntil = Date.now() + Math.min(900000, 30000 * Math.pow(2, Math.floor(_loginFails / 5) - 1)); }
                errorEl.textContent = '❌ Incorrect username or password';
                resetBtn(); passEl.value = ''; passEl.focus(); return;
            }

            // اجلب دور الحساب + بيانات الموظفين بالتوازي (كانت تتم بالتتابع وتسبب بطء الدخول)
            const employeesPromise = fetchEmployeesMap();
            employeesPromise.catch(() => {});
            const { data: profile, error: profileError } = await supabaseClient
                .from('alsaree3_profiles')
                .select('role, employee_key')
                .eq('id', data.user.id)
                .single();

            _mark('profile');
            if (profileError || !profile) {
                console.error(profileError);
                errorEl.textContent = '❌ No employee account is linked to this user';
                await supabaseClient.auth.signOut();
                resetBtn(); return;
            }

            // الموظف (غير المسؤول) لا يدخل إلا إذا كان داخل نطاق موقع العمل
            if (profile.role !== 'admin') {
                btn.textContent = 'Checking location...';
                const loc = await verifyWorkLocation(profile.employee_key);
                _mark('geo');
                if (!loc.ok) {
                    errorEl.textContent = '📍 ' + loc.msg;
                    await supabaseClient.auth.signOut();
                    resetBtn(); passEl.value = ''; return;
                }
            }

            // الآن فقط (بعد المصادقة) نجلب بيانات الموظفين ونفتح الاتصال اللحظي
            try {
                loggedInId = (profile.role === 'admin') ? '__admin__' : profile.employee_key;
                _serverEmployees = await employeesPromise;
                _mark('employees');
                employeesData = _snapshotClone();
                subscribeEmployees(true);
                setTimeout(() => { if (window.pollMyTickets) window.pollMyTickets(); }, 500);
                // التصفير التعويضي يعمل بالخلفية حتى لا يبطّئ الدخول، ثم نحدّث البيانات إن حصل تصفير
                setTimeout(() => runDayReset('catchup').then(did => { if (did) resyncEmployees().catch(() => {}); })
                    .catch(e => console.warn('[CatchUp-Reset] تعذر:', e.message)), 3000);
            } catch (e) {
                console.error(e);
                loggedInId = null; employeesData = {}; unsubscribeEmployees();
                errorEl.textContent = '❌ Could not load employee data from the server';
                await supabaseClient.auth.signOut();
                resetBtn(); return;
            }

            if (profile.role !== 'admin') {
                const emp = employeesData[profile.employee_key];
                if (!profile.employee_key || !emp) {
                    loggedInId = null; employeesData = {}; unsubscribeEmployees();
                    errorEl.textContent = '❌ This employee was not found in the system';
                    await supabaseClient.auth.signOut();
                    resetBtn(); return;
                }
            }

            _sessionStart = Date.now();
            logDeviceAccess(loggedInId, loggedInId === '__admin__' ? 'Admin' : employeesData[loggedInId].name);

            _loginFails = 0; _loginLockUntil = 0;

                let currentHourIndex = Math.floor((now - d.startTime) / 3600000);

            try { await tmp.auth.signOut({ scope: 'local' }); } catch (e) {}
            return true;

                    <input id="pin-input" type="password" autocomplete="current-password" maxlength="128" class="pin-input" style="margin-bottom:8px;letter-spacing:normal;font-size:1rem;">
                    <div id="pin-err" class="error-msg" style="margin-bottom:10px;"></div>

                const inp = o.querySelector('#pin-input'), err = o.querySelector('#pin-err'), okBtn = o.querySelector('#pin-ok');

        async function _loadEmpMeta(force) {
