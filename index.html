<body>

    <!-- شاشة تسجيل الدخول -->

    <div class="system-container" id="main-app" style="display:none">
        <div class="text-center mb-10 select-none">
            <h1 class="text-5xl font-black text-green-600 mb-3 tracking-wide inline-block px-4">Alsaree3</h1><br>
            <p class="text-lg font-extrabold text-green-700 bg-green-50 inline-block px-6 py-2 rounded-2xl border border-green-200">🖥️ Morning Call Center</p>
        </div>
        <div id="app" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        <div id="admin-section" class="admin-panel hidden mt-8"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js" integrity="sha384-KX6Y/AMIv9qA8TLCDul2JatZWeyrJVgj3Xu/0r30Nr05xO8md1+wHAgtdsRV9LoE" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        // ===== Supabase: الاتصال (المفتاح publishable مخصص للمتصفح — الحماية الفعلية عبر RLS في قاعدة البيانات) =====
        const SUPABASE_URL = 'https://eygohyybhidlsycblfop.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_6Y3sDrJirAA8O2j2Iugpfg_WUOr8IBm';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
            auth: { persistSession: false, autoRefreshToken: true, detectSessionInUrl: false }
        });
        // الشاشة مشتركة بين الموظفين: لا نحتفظ بجلسة قديمة بعد إعادة تحميل الصفحة

        // ===== إعدادات قواعد العمل الجديدة =====
        const WORK_LOCATION = { lat: 33.293117, lng: 44.433205 };   // موقع العمل
        const WORK_RADIUS_METERS = 100;                   // أقصى مسافة مسموحة لتسجيل الحضور (100 متر)
        // المجموعات: كل مجموعة قائمة بمفاتيح الموظفين (employee_key). الموظفون غير المذكورين يُعتبرون في مجموعة واحدة مشتركة.
        // ===== خصم التأخير عن بداية الدوام =====
        // مفتاح الموظف أو جزء من اسمه (عربي/إنجليزي) => وقت بداية الدوام
        const SHIFT_RULES = [
            // off = يوم الأوف الأسبوعي (0=الأحد 1=الاثنين 2=الثلاثاء 3=الأربعاء 4=الخميس 5=الجمعة 6=السبت)
            { match: /نور|nour|noor/i,                    start: '11:00', off: 0 },
            { match: /فاروق|farouk|farouq|farooq|faruq|faroq/i,       start: '11:00', off: 2 },
            { match: /هبه|hiba|heba|hebah/i,             start: '10:00', off: 5 },
            { match: /احمد|ahmed|ahmad/i,                start: '07:30', off: 6 }
        ];
        const LATE_GRACE_MIN = 5;         // سماحية بالدقائق بعد بداية الدوام
        const LATE_BASE_POINTS = 5;       // الخصم الأساسي عند تجاوز السماحية
        const LATE_EXTRA_POINTS = 5;      // خصم إضافي لكل خطوة تأخير إضافية
        const LATE_EXTRA_STEP_MIN = 15;   // طول الخطوة بالدقائق
        const LATE_MAX_POINTS = 50;       // أقصى خصم للتأخير في اليوم
        function _normAr(s) { return String(s || '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه'); }
        function _ruleFor(id) {
            const hay = _normAr(id) + ' ' + _normAr((employeesData[id] || {}).name);
            return SHIFT_RULES.find(x => x.match.test(hay)) || null;
        }
        function getShiftStart(id) {
            const m = _empMeta[id];
            if (m && m.shift) return String(m.shift).slice(0, 5);
            const r = _ruleFor(id); return r ? r.start : null;
        }
        function getOffDay(id) {
            const m = _empMeta[id];
            if (m && m.off !== null && m.off !== undefined) return m.off;
            const r = _ruleFor(id); return r ? r.off : null;
        }
        function isOffDay(id, dateStr) {
            const od = getOffDay(id); if (od === null || od === undefined) return false;
            const p = String(dateStr).split('-').map(Number); if (p.length < 3) return false;
            return new Date(p[0], p[1] - 1, p[2]).getDay() === od;
        }
        function _startLabel(id, dateStr, st) {
            const v = String(st || '');
            if (!v || v === 'Absent' || v === 'لم يحضر') return isOffDay(id, dateStr) ? 'OFF' : (v ? 'Absent' : '-');
            return v;
        }
        function calcLatePenalty(id, now) {
            const st = getShiftStart(id); if (!st) return null;
            if (isOffDay(id, _ymd(new Date(now)))) return null;   // يوم الأوف: لا خصم أبداً
            const [h, m] = st.split(':').map(Number);
            const sd = new Date(now); sd.setHours(h, m, 0, 0);
            const late = Math.floor((now - sd.getTime()) / 60000);
            if (late <= LATE_GRACE_MIN) return null;
            const pts = Math.min(LATE_MAX_POINTS, LATE_BASE_POINTS + LATE_EXTRA_POINTS * Math.floor((late - LATE_GRACE_MIN) / LATE_EXTRA_STEP_MIN));
            return { late, points: pts, start: st };
        }

        const MAX_BREAK_MINUTES = 15;   // البريك ينتهي تلقائياً بعد هذه المدة (غيّر الرقم أو ضع 0 للتعطيل)
        const MAX_REST_MINUTES = 20;    // الراحة تنتهي تلقائياً بعد هذه المدة (0 للتعطيل)
        const BREAK_GROUPS = [];                          // مثال: [['ahmed','ali','sara'], ['omar','huda']]
        const BLOCK_BREAK_IF_GROUP_BUSY = true;           // true = منع البريك | false = السماح مع خصم من التقييم
        const GROUP_BREAK_PENALTY_POINTS = 5;             // الخصم عند بريك أثناء بريك زميل (يُطبق فقط إذا BLOCK = false)

        function getGroupMates(id) {
            const g = BREAK_GROUPS.find(arr => arr.includes(id));
            const all = Object.keys(employeesData);
            if (g) return g.filter(k => k !== id && employeesData[k]);
            const grouped = new Set(BREAK_GROUPS.flat());
            return all.filter(k => k !== id && !grouped.has(k));
        }
        function getMateOnBreak(id) {
            const _today = getTodayDateString();
            const _now = Date.now();
            const k = getGroupMates(id).find(m => {
                const e = employeesData[m];
                if (!e || e.status !== 'بريك' || e.lastActiveDate !== _today) return false;
                // بريك تجاوز الحد الأقصى (مثلاً جهاز الزميل مغلق) لا يجب أن يمنع الآخرين للأبد
                if (MAX_BREAK_MINUTES > 0 && e.lastActionTime && (_now - e.lastActionTime) >= MAX_BREAK_MINUTES * 60000) return false;
                return true;
            });   // بريك قديم عالق من أمس لا يمنع الآخرين
            return k ? employeesData[k] : null;
        }
        function distanceMeters(lat1, lng1, lat2, lng2) {
            const R = 6371000, toRad = x => x * Math.PI / 180;
            const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
            const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
            return 2 * R * Math.asin(Math.sqrt(a));
        }
        // يرجع { ok, msg } — الحضور مسموح فقط ضمن نصف قطر 1 كم من موقع العمل
        function verifyWorkLocation() {
            return new Promise(resolve => {
                if (WORK_LOCATION.lat === null || WORK_LOCATION.lng === null) {
                    console.warn('[Geofence] لم يتم ضبط WORK_LOCATION — التحقق من الموقع معطّل');
                    return resolve({ ok: true });
                }
                if (!navigator.geolocation) return resolve({ ok: false, msg: 'المتصفح لا يدعم تحديد الموقع' });
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        const dist = distanceMeters(pos.coords.latitude, pos.coords.longitude, WORK_LOCATION.lat, WORK_LOCATION.lng);
                        if (dist <= WORK_RADIUS_METERS) resolve({ ok: true, lat: pos.coords.latitude, lng: pos.coords.longitude });
                        else resolve({ ok: false, msg: 'أنت بعيد عن موقع العمل (' + Math.round(dist) + ' متر). يجب أن تكون ضمن ' + WORK_RADIUS_METERS + ' متر لتسجيل الحضور.' });
                    },
                    err => resolve({ ok: false, msg: err.code === 1 ? 'يجب السماح للموقع (Location) في المتصفح لتسجيل الحضور' : 'تعذّر تحديد موقعك، حاول مرة أخرى' }),
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            });
        }

        // ===== تحويل بين أسماء الحقول في التطبيق (camelCase) وأعمدة قاعدة البيانات (snake_case) =====
        const EMP_FIELDS = {
            name: 'name', status: 'status', startTime: 'start_time', lastActionTime: 'last_action_time',
            lastActiveDate: 'last_active_date', totalBreakMinutes: 'total_break_minutes',
            totalRestMinutes: 'total_rest_minutes', totalWorkSeconds: 'total_work_seconds',
            hourlyBreaks: 'hourly_breaks', slotBreaks: 'slot_breaks', rating: 'rating',
            allowedBreakSaved: 'allowed_break_saved', currentTask: 'current_task',
            monthlyRating: 'monthly_rating', monthlyHistory: 'monthly_history'
        };
        const NUMERIC_COLS = new Set(['start_time','last_action_time','total_break_minutes','total_rest_minutes','total_work_seconds','rating','allowed_break_saved','monthly_rating']);
        const JSON_COLS = new Set(['hourly_breaks','slot_breaks','monthly_history']);

        function empFromRow(r) {           // صف من القاعدة → كائن التطبيق (الأعمدة غير الموجودة تُترك undefined)
            const o = {};
            for (const [camel, col] of Object.entries(EMP_FIELDS)) {
                if (!(col in r)) continue;
                let v = r[col];
                if (v !== null && v !== undefined) {
                    if (NUMERIC_COLS.has(col)) v = Number(v);
                    else if (JSON_COLS.has(col) && typeof v === 'string') { try { v = JSON.parse(v); } catch(e) { v = {}; } }
                }
                o[camel] = v;
            }
            return o;
        }
        function empToRow(obj) {           // كائن التطبيق → صف للقاعدة
            const row = {};
            for (const [camel, col] of Object.entries(EMP_FIELDS)) {
                if (obj[camel] === undefined) continue;
                let v = obj[camel];
                if (JSON_COLS.has(col) && (v === null)) v = {};
                row[col] = v;
            }
            return row;
        }
        function historyToRow(date, id, p) {
            const row = { history_date: date, employee_key: id };
            const map = { name:'name', startTimeStr:'start_time_str', totalDurationStr:'total_duration_str', currentTask:'current_task',
                          totalBreakMinutes:'total_break_minutes', totalRestMinutes:'total_rest_minutes', totalWorkSeconds:'total_work_seconds',
                          rating:'rating', monthlyRating:'monthly_rating', savedAt:'saved_at' };
            for (const [k, col] of Object.entries(map)) if (p[k] !== undefined) row[col] = p[k];
            return row;
        }
        function historyFromRow(r) {
            return { name: r.name, startTimeStr: r.start_time_str, totalDurationStr: r.total_duration_str, currentTask: r.current_task,
                     totalBreakMinutes: r.total_break_minutes, totalRestMinutes: r.total_rest_minutes, totalWorkSeconds: r.total_work_seconds,
                     rating: r.rating, monthlyRating: r.monthly_rating, savedAt: r.saved_at };
        }

        // ===== طبقة البيانات (كل القراءة/الكتابة تمر من هنا، والحماية الحقيقية في RLS) =====
        let _syncErrAt = 0;
        function reportSyncError(err, what) {
            console.error('[Supabase] فشل ' + what + ':', err);
            if (Date.now() - _syncErrAt > 30000) {
                _syncErrAt = Date.now();
                alert('⚠️ تعذّر حفظ التغيير على السيرفر (' + what + ').\nتحقق من الاتصال بالإنترنت، وإن استمرت المشكلة سجّل الخروج وادخل من جديد.');
            }
        }

        async function fetchEmployeesMap() {
            const { data, error } = await supabaseClient.from('alsaree3_employees').select('*').order('employee_key');
            if (error) throw error;
            const map = {};
            (data || []).forEach(r => { map[r.employee_key] = empFromRow(r); });
            return map;
        }

        // ===== تطبيق نتيجة السيرفر على الواجهة (السيرفر هو المرجع الوحيد للأوقات والتقييم) =====
        function _applyServerRow(id, row) {
            if (!row || typeof row !== 'object') return;
            const parsed = empFromRow(row);
            _serverEmployees[id] = Object.assign({}, _serverEmployees[id] || {}, parsed);
            employeesData[id] = Object.assign({}, employeesData[id] || {}, parsed);
            try { checkAndApplyRatings(); } catch (e) {}
            render();
        }
        function _rpcFail(error) {
            const m = String((error && error.message) || '');

        // تحديث بطاقة موظف واحد (للمسؤول فقط الآن؛ الموظف يمر عبر دوال السيرفر — والسيرفر يفرض ذلك أيضاً)
        const _writeChain = {};   // id -> آخر عملية كتابة (لضمان ترتيب الكتابات وعدم تقدّم القديمة على الجديدة)
        function safeUpdateEmployee(id, data) {
            const prev = _writeChain[id] || Promise.resolve();
            const next = prev.catch(() => {}).then(() => _doUpdateEmployee(id, data));
            _writeChain[id] = next;
            return next;
        }
        async function _doUpdateEmployee(id, data) {
            if (loggedInId !== '__admin__' && loggedInId !== id) return { ok: false, skipped: true };
            const row = empToRow(data);
            if (Object.keys(row).length === 0) return { ok: true };
            let lastErr = null;
            for (let attempt = 0; attempt < 3; attempt++) {
                if (attempt > 0) await new Promise(r => setTimeout(r, 600 * attempt));
                if (!_checkWriteRate()) return { ok: false, skipped: true };
                try {
                    const { data: res, error } = await supabaseClient.from('alsaree3_employees')
                        .update(row).eq('employee_key', id).select('employee_key');
                    if (!error && res && res.length > 0) return { ok: true };
                    if (!error && (!res || res.length === 0)) { lastErr = new Error('0 rows updated (RLS?)'); break; }  // رفض صلاحيات: لا فائدة من التكرار
                    lastErr = error;
                } catch (e) { lastErr = e; }   // انقطاع شبكة: أعد المحاولة
            }
            reportSyncError(lastErr, 'تحديث الموظف');
            return { ok: false };
        }

        // مسؤول فقط: تحديث عدة موظفين بمفاتيح بنمط employees/<id>/<field> (تستخدمها endOfDay)
        async function applyEmployeePathUpdates(paths) {
            const grouped = {};
            for (const [path, val] of Object.entries(paths)) {
                const m = path.match(/^employees\/([^/]+)\/(.+)$/);
                if (!m) continue;
                (grouped[m[1]] = grouped[m[1]] || {})[m[2]] = val;
            }
            const results = await Promise.all(Object.entries(grouped).map(async ([id, fields]) => {
                const row = empToRow(fields);
                if (Object.keys(row).length === 0) return true;
                const { error } = await supabaseClient.from('alsaree3_employees').update(row).eq('employee_key', id);
                if (error) { console.error('[Supabase] فشل تحديث', id, error); return false; }
                return true;
            }));
            if (results.some(ok => !ok)) throw new Error('فشل تحديث بعض الموظفين');
        }

        async function saveHistoryRow(date, id, payload) {
            if (loggedInId !== '__admin__' && loggedInId !== id) return;
            if (!_checkWriteRate()) return;
            const { error } = await supabaseClient.from('alsaree3_history')
                .upsert(historyToRow(date, id, payload), { onConflict: 'history_date,employee_key' });
            if (error) console.error('[Supabase] فشل حفظ الأرشيف:', error);
        }

        // مسؤول فقط: حفظ أرشيف عدة موظفين دفعة واحدة (مفاتيح بنمط history/<date>/<id>)
        async function applyHistoryPathUpdates(paths) {
            const rows = [];
            for (const [path, val] of Object.entries(paths)) {
                const m = path.match(/^history\/([^/]+)\/([^/]+)$/);
                if (m) rows.push(historyToRow(m[1], m[2], val));
            }
            if (rows.length === 0) return;
            const { error } = await supabaseClient.from('alsaree3_history')
                .upsert(rows, { onConflict: 'history_date,employee_key' });
            if (error) throw error;
        }

            const { data, error } = await supabaseClient.from('alsaree3_history')
                .select('*').eq('history_date', date).order('employee_key');
            if (error) throw error;
            const out = {};
            (data || []).forEach(r => { out[r.employee_key] = historyFromRow(r); });

        async function runDayReset(mode) {

        // ===== المزامنة اللحظية (Realtime) مع مزامنة احتياطية دورية =====
        let _rtChannel = null;

        function _snapshotClone() {

        async function resyncEmployees() {

        function subscribeEmployees(skipInitialSync) {
            if (_rtChannel) return;
            _rtChannel = supabaseClient.channel('alsaree3-employees')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'alsaree3_employees' }, (payload) => {
                    if (payload.eventType === 'DELETE') {
                        delete _serverEmployees[payload.old.employee_key];
                    } else {
                        const key = payload.new.employee_key;
                        _serverEmployees[key] = Object.assign({}, _serverEmployees[key] || {}, empFromRow(payload.new));
                    }
                    handleEmployeesSnapshot(_snapshotClone());
                })
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        if (skipInitialSync && !_rtEverSubscribed) { _rtEverSubscribed = true; return; }
                        _rtEverSubscribed = true;
                        resyncEmployees().catch(() => {});   // إعادة اتصال: عوّض ما فاتك
                    }
                });

        // ===== SECURITY v5: Device Fingerprint =====
        async function getDeviceFingerprint() {
            const raw = [
                navigator.userAgent,
                navigator.language,
                screen.width + 'x' + screen.height,
                new Date().getTimezoneOffset(),
                navigator.hardwareConcurrency || 0
            ].join('|');
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('').slice(0,16);
        }

        async function logDeviceAccess(empId, empName) {
            try {
                const fp = await getDeviceFingerprint();
                const logEntry = {
                    empId, empName,
                    fingerprint: fp,
                    userAgent: navigator.userAgent.slice(0, 80),
                    timestamp: Date.now(),
                    time: new Date().toLocaleString('ar-IQ')
                };
                await insertDeviceLog(logEntry);
            } catch(e) {}
        }

        const _pendingLocal = {};   // id -> { fields, ts, doneAt, seq }
        let _pendSeq = 0;
        const _staleResetAt = {};   // id -> آخر مرة أرسلنا فيها تصفير يوم قديم (لمنع تكرار الكتابة)
        function _markPending(id, fields) {
            const seq = ++_pendSeq;
            const keep = {};
            ['status','lastActionTime','startTime','currentTask','lastActiveDate'].forEach(k => { if (fields[k] !== undefined) keep[k] = fields[k]; });
            _pendingLocal[id] = { fields: keep, ts: Date.now(), doneAt: null, seq };
            return seq;
        }
        function _settlePending(id, seq, result) {
            const p = _pendingLocal[id];
            if (!p || p.seq !== seq) return;           // جاء تغيير أحدث بعده
            if (result && result.ok) { p.doneAt = Date.now(); }
            else { delete _pendingLocal[id]; resyncEmployees().catch(() => {}); } // فشل الحفظ: ارجع لحالة السيرفر الحقيقية
        }
        function _applyPending(freshData) {
            const now = Date.now();
            for (const id in _pendingLocal) {
                const p = _pendingLocal[id], srv = freshData[id];
                const expired = (now - p.ts > 60000) || (p.doneAt && now - p.doneAt > 10000);
                if (!srv || expired) { delete _pendingLocal[id]; continue; }
                const matched = Object.keys(p.fields).every(k => srv[k] === p.fields[k]);
                if (matched) { delete _pendingLocal[id]; continue; }  // السيرفر لحق بنا
                freshData[id] = { ...srv, ...p.fields };               // السيرفر لسا قديم: احتفظ بالمحلي
                if (employeesData[id]) {
                    ['totalBreakMinutes','totalRestMinutes','totalWorkSeconds','hourlyBreaks','slotBreaks','rating'].forEach(k => {
                        if (employeesData[id][k] !== undefined) freshData[id][k] = employeesData[id][k];
                    });
                }
            }
        }

        // ===== SECURITY: Session timeout — تسجيل خروج تلقائي بعد 8 ساعات =====
        let _sessionStart = null;
        const SESSION_TIMEOUT_MS = 8 * 60 * 60 * 1000; // 8 ساعات
        function _checkSessionTimeout() {
            if (!loggedInId || !_sessionStart) return;
            if (Date.now() - _sessionStart > SESSION_TIMEOUT_MS) {
                alert('⏰ انتهت جلستك تلقائياً بعد 8 ساعات. يرجى تسجيل الدخول مجدداً.');
                _performLogout();
            }
        }
        setInterval(_checkSessionTimeout, 60000); // تحقق كل دقيقة

        // ===== SECURITY: Global write rate limiter =====
        let _fbWriteCount = 0;
        let _fbWriteWindowStart = Date.now();
        const FB_MAX_WRITES_PER_MIN = 150; // حد أقصى 150 كتابة في الدقيقة لكل جهاز
        function _checkWriteRate() {
            const now = Date.now();
            if (now - _fbWriteWindowStart > 60000) { _fbWriteCount = 0; _fbWriteWindowStart = now; }
            if (_fbWriteCount >= FB_MAX_WRITES_PER_MIN) {
                console.warn('[SECURITY] write rate limit exceeded!');
                return false;
            }
            _fbWriteCount++;
            return true;
        }
        function getTodayDateString() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;

        // ===== تسجيل الدخول عبر Supabase (اسم مستخدم + كلمة مرور) =====
        let _loginFails = 0, _loginLockUntil = 0;
        const _doLoginInner = async () => {
            const userEl = document.getElementById('login-username');
            const passEl = document.getElementById('login-password');
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');
            const username = userEl.value.trim().toLowerCase().slice(0, 64);
            const password = passEl.value;
            errorEl.textContent = '';
            if (!username) { errorEl.textContent = '⚠️ أدخل اسم المستخدم'; return; }
            if (!/^[a-z0-9._@+-]{2,64}$/.test(username)) { errorEl.textContent = '❌ اسم المستخدم أو كلمة المرور غير صحيحة'; return; }
            if (Date.now() < _loginLockUntil) { errorEl.textContent = '⛔ محاولات كثيرة، انتظر ' + Math.ceil((_loginLockUntil - Date.now()) / 1000) + ' ثانية'; return; }
            if (!password) { errorEl.textContent = '⚠️ أدخل كلمة المرور'; return; }
            const _t0 = performance.now(), _T = [];
            const _mark = n => { _T.push(n + ' ' + Math.round(performance.now() - _t0) + 'ms'); };
            btn.disabled = true; btn.textContent = 'جاري التحقق...';
            const resetBtn = () => { btn.disabled = false; btn.textContent = 'دخول ←'; };

            // إذا كتب بريده الحقيقي كامل (يحتوي على @) استخدمه كما هو — مخصص لحساب المسؤول
            const email = username.includes('@') ? username : `${username}@alsaree3.local`;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            _mark('auth');
            if (error) {
                console.error(error);
                if (++_loginFails >= 5) { _loginLockUntil = Date.now() + Math.min(900000, 30000 * Math.pow(2, Math.floor(_loginFails / 5) - 1)); }
                errorEl.textContent = '❌ اسم المستخدم أو كلمة المرور غير صحيحة';
                resetBtn(); passEl.value = ''; passEl.focus(); return;
            }

            // اجلب دور الحساب + بيانات الموظفين بالتوازي (كانت تتم بالتتابع وتسبب بطء الدخول)
            const employeesPromise = fetchEmployeesMap();
            employeesPromise.catch(() => {});
            const { data: profile, error: profileError } = await supabaseClient
                .from('alsaree3_profiles')
                .select('role, employee_key')
                .eq('id', data.user.id)
                .single();

            _mark('profile');
            if (profileError || !profile) {
                console.error(profileError);
                errorEl.textContent = '❌ لا يوجد حساب موظف مرتبط بهذا المستخدم';
                await supabaseClient.auth.signOut();
                resetBtn(); return;
            }

            // الآن فقط (بعد المصادقة) نجلب بيانات الموظفين ونفتح الاتصال اللحظي
            try {
                loggedInId = (profile.role === 'admin') ? '__admin__' : profile.employee_key;
                _serverEmployees = await employeesPromise;
                _mark('employees');
                employeesData = _snapshotClone();
                subscribeEmployees(true);
                setTimeout(() => { if (window.pollMyTickets) window.pollMyTickets(); }, 500);
                // التصفير التعويضي يعمل بالخلفية حتى لا يبطّئ الدخول، ثم نحدّث البيانات إن حصل تصفير
                setTimeout(() => runDayReset('catchup').then(did => { if (did) resyncEmployees().catch(() => {}); })
                    .catch(e => console.warn('[CatchUp-Reset] تعذر:', e.message)), 3000);
            } catch (e) {
                console.error(e);
                loggedInId = null; employeesData = {}; unsubscribeEmployees();
                errorEl.textContent = '❌ تعذّر تحميل بيانات الموظفين من السيرفر';
                await supabaseClient.auth.signOut();
                resetBtn(); return;
            }

            if (profile.role !== 'admin') {
                const emp = employeesData[profile.employee_key];
                if (!profile.employee_key || !emp) {
                    loggedInId = null; employeesData = {}; unsubscribeEmployees();
                    errorEl.textContent = '❌ بيانات هذا الموظف غير موجودة في النظام';
                    await supabaseClient.auth.signOut();
                    resetBtn(); return;
                }

            _sessionStart = Date.now();
            logDeviceAccess(loggedInId, loggedInId === '__admin__' ? 'Admin' : employeesData[loggedInId].name);

            document.getElementById('leave-btn').style.display = (loggedInId === '__admin__') ? 'none' : 'block';

        function checkAutoResetCron() {

                let currentHourIndex = Math.floor((now - d.startTime) / 3600000);

                let curB = 0;
                if (d.status === 'بريك' && d.lastActionTime) {
                    let breakStartHourIndex = Math.floor((d.lastActionTime - d.startTime) / 3600000);
                    if (breakStartHourIndex === currentHourIndex) {
                        curB = Math.floor((now - d.lastActionTime) / 60000);
                    } else {
                        let currentHourStart = d.startTime + (currentHourIndex * 3600000);
                        curB = Math.floor((now - currentHourStart) / 60000);
                        if (curB < 0) curB = 0;
                    }
                }
                let curR = (d.status === 'راحة' && d.lastActionTime) ? Math.floor((now - d.lastActionTime) / 60000) : 0;
                let totalR = (d.totalRestMinutes || 0) + curR;
                
                let totalViolations = 0;
                let hourlyBreaks = d.hourlyBreaks || {};
                
                for (let h = 0; h < currentHourIndex; h++) {
                    let pastBreak = hourlyBreaks[h] || 0;
                    if (pastBreak > 5) totalViolations += Math.floor((pastBreak - 5) / 60) + 1;
                }
                
                let currentHourBreak = (hourlyBreaks[currentHourIndex] || 0) + curB;
                if (currentHourBreak > 5) totalViolations += Math.floor((currentHourBreak - 5) / 60) + 1;
                if (totalR > 15) totalViolations += Math.floor((totalR - 15) / 60) + 1;
                
                let groupPen = hourlyBreaks.groupPenalty || 0;
                let latePen = Number(hourlyBreaks.latePenalty) || 0;
                let calcRating = Math.max(0, 100 - (totalViolations * 5) - groupPen - latePen);
                // تحديث محلي فقط — بدون كتابة للسيرفر لتجنب إطلاق تحديث لحظي

        let _pinFails = 0, _pinLockUntil = 0;
        async function _verifyAdminPassword(pw) {

            if (!user || !user.email) return false;

            const tmp = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
            const { data, error } = await tmp.auth.signInWithPassword({ email: user.email, password: pw });
            if (error || !data || !data.user || data.user.id !== user.id) return false;
            try { await tmp.auth.signOut({ scope: 'local' }); } catch (e) {}
            return true;
        }
        function _askPin(title) {
            return new Promise(resolve => {
                const old = document.getElementById('pin-overlay'); if (old) old.remove();
                const o = document.createElement('div');
                o.id = 'pin-overlay';
                o.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.65);z-index:10001;display:flex;align-items:center;justify-content:center;padding:16px;';

                    <input id="pin-input" type="password" autocomplete="current-password" maxlength="128" class="pin-input" style="margin-bottom:8px;letter-spacing:normal;font-size:1rem;">
                    <div id="pin-err" class="error-msg" style="margin-bottom:10px;"></div>
                    <div style="display:flex;gap:8px;">
                        <button id="pin-ok" class="login-btn" style="width:auto;flex:2;padding:12px;">تأكيد</button>
                        <button id="pin-cancel" style="flex:1;padding:12px;border-radius:18px;background:#f1f5f9;border:none;font-family:Cairo,sans-serif;font-weight:900;cursor:pointer;color:#475569;">إلغاء</button>
                    </div>
                </div>`;
                document.body.appendChild(o);
                const inp = o.querySelector('#pin-input'), err = o.querySelector('#pin-err'), okBtn = o.querySelector('#pin-ok');
                const done = ok => { o.remove(); resolve(ok); };
                let busy = false;
                const submit = async () => {
                    if (busy) return;
                    if (Date.now() < _pinLockUntil) { err.textContent = '⛔ محاولات كثيرة، انتظر ' + Math.ceil((_pinLockUntil - Date.now()) / 1000) + ' ثانية'; return; }
                    busy = true; okBtn.disabled = true;
                    let ok = false;
                    try { ok = await _verifyAdminPassword(inp.value); }
                    catch (e) { err.textContent = '❌ تعذر التحقق'; busy = false; okBtn.disabled = false; return; }
                    busy = false; okBtn.disabled = false;
                    if (ok) { _pinFails = 0; done(true); return; }
                    inp.value = ''; inp.focus();
                    if (++_pinFails >= 5) { _pinLockUntil = Date.now() + 60000; _pinFails = 0; err.textContent = '⛔ محاولات كثيرة، انتظر 60 ثانية'; }
                    else err.textContent = '❌ كلمة المرور غير صحيحة';
                };
                okBtn.onclick = submit;
                o.querySelector('#pin-cancel').onclick = () => done(false);
                inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); else if (e.key === 'Escape') done(false); });
                setTimeout(() => inp.focus(), 50);
            });
        }

        // ===== نظام طلبات الإجازة والإذن الزمني =====
        const ANNUAL_LEAVE_DAYS = 21;   // رصيد الإجازة السنوية لكل موظف
        // leave_adjust = أيام "مستخدمة" يدوية يضيفها المسؤول فوق الإجازات المعتمدة
        let _leaveAdj = {}, _empMeta = {}, _metaAt = 0;
        async function _loadEmpMeta(force) {
            if (!force && Date.now() - _metaAt < 60000) return;
            // نحاول الأعمدة كلها، وإن لم تُضف بعد في Supabase نقرأ المتوفر فقط
            const tries = ['employee_key, leave_adjust, shift_start, off_day', 'employee_key, leave_adjust', 'employee_key'];
            for (const cols of tries) {
                try {
                    const { data, error } = await supabaseClient.from('alsaree3_employees').select(cols);
                    if (error) continue;
                    const adj = {}, meta = {};
                    (data || []).forEach(r => {
                        adj[r.employee_key] = Number(r.leave_adjust) || 0;
                        meta[r.employee_key] = { shift: r.shift_start || null, off: (r.off_day === null || r.off_day === undefined) ? null : Number(r.off_day) };
                    });
                    _leaveAdj = adj; _empMeta = meta; _metaAt = Date.now();
                    return;
                } catch (e) { /* جرّب التالي */ }
            }
            console.warn('[EmpMeta] تعذر قراءة بيانات الموظفين الإضافية — نفّذ leave_balance.sql في Supabase');
        }
        function _loadLeaveAdj() { return _loadEmpMeta(true); }
        function _leaveUsedTotal(rows, k, year) { return _leaveUsedDays(rows, k, year) + (Number(_leaveAdj[k]) || 0); }
        function _ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
        function _expandDates(startStr, days) {
            const [y, m, d] = String(startStr).split('-').map(Number);
            const out = [];
            for (let i = 0; i < (Number(days) || 1); i++) out.push(_ymd(new Date(y, m - 1, d + i)));
            return out;
        }
        function _leaveUsedDays(rows, key, year) {
            return (rows || []).filter(r => r.employee_key === key && r.kind === 'day' && r.status === 'approved' && String(r.start_date).startsWith(year))
                .reduce((s, r) => s + (Number(r.days) || 0), 0);
        }
        function _leaveStatusLabel(s) { return s === 'approved' ? '✅ موافق' : s === 'rejected' ? '❌ مرفوض' : '⏳ بانتظار الرد'; }
        function _leaveDurationLabel(r) {
            if (r.kind === 'day') {
                const ds = _expandDates(r.start_date, r.days);
                return r.days + ' يوم (' + ds[0] + (ds.length > 1 ? ' → ' + ds[ds.length - 1] : '') + ')';
            }
            return r.start_date + ' | ' + (r.from_time || '') + ' - ' + (r.to_time || '') + ' (' + (Number(r.hours) || 0) + ' س)';
        }

        };

        // ===== مهام واتساب: المسؤول يرسل مهمة، والموظف يضغط "قرأت" ثم "تم الحل" =====
        const TICKET_READ_LIMIT_MIN = 5, TICKET_SOLVE_LIMIT_MIN = 15;   // يجب أن تطابق tickets.sql
        function _ticketPenalty(t) {
            if (t.kind === 'self') return 0;   // رسالة وصلت للموظف: بدون خصم، تسجيل الأوقات فقط
            const c = new Date(t.created_at).getTime();
            const readLate = !t.read_at || (new Date(t.read_at).getTime() - c) > TICKET_READ_LIMIT_MIN * 60000;
            const solveLate = !t.solved_at || (new Date(t.solved_at).getTime() - c) > TICKET_SOLVE_LIMIT_MIN * 60000;
            return (readLate ? 1 : 0) + (solveLate ? 2 : 0);
        }
        function _minsBetween(a, b) { return Math.max(0, Math.round((new Date(b).getTime() - new Date(a).getTime()) / 60000)); }
        function _tm(ts) { return new Date(ts).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }); }

        window.sendTicket = async (id) => {
            if (loggedInId !== '__admin__') return;
            const emp = employeesData[id]; if (!emp) return;
            const txt = prompt('اكتب المهمة / المشكلة التي سترسلها إلى ' + emp.name + ':');
            if (!txt || !txt.trim()) return;
            if (!_checkWriteRate()) return;
            const { error } = await supabaseClient.rpc('alsaree3_ticket_create', { p_key: id, p_body: txt.trim() });
            if (error) { console.error('[Ticket]', error); alert('❌ تعذّر إنشاء المهمة. تأكد أنك شغّلت ملف tickets.sql في Supabase.'); return; }
            window.open('https://wa.me/?text=' + encodeURIComponent('📨 ' + emp.name + '\n' + txt.trim() + '\n\n(اضغط "قرأت" ثم "تم الحل" في النظام)'), '_blank');
        };

        window.openTickets = async (date) => {
            if (loggedInId !== '__admin__') return;
            date = /^\d{4}-\d{2}-\d{2}$/.test(String(date || '')) ? date : getTodayDateString();
            window._tkDate = date;
            _modal('tickets-overlay', '📋 مهام واتساب والردود', '<div style="text-align:center;color:#94a3b8;font-weight:700;padding:20px;">⏳ جاري التحميل...</div>', 1000);
            const body = document.getElementById('tickets-overlay-body');
            const _btn = (label, fn, bg, bd, col) => '<button onclick="' + fn + '" style="background:' + bg + ';border:1px solid ' + bd + ';color:' + col + ';border-radius:8px;padding:2px 8px;font-weight:900;font-size:0.75rem;cursor:pointer;font-family:Cairo,sans-serif;margin-inline-start:4px;">' + label + '</button>';
            const _delB = (fn) => _btn('🗑️ حذف', fn, '#fef2f2', '#fca5a5', '#b91c1c');
            const _edtB = (fn) => _btn('✏️ تعديل', fn, '#eff6ff', '#93c5fd', '#1d4ed8');
            const _nm = (k) => sanitize(employeesData[k] ? employeesData[k].name : k);
            try {
                let { data, error } = await supabaseClient.rpc('alsaree3_tickets_admin', { p_date: date });
                if (error) throw error;
                data = data || [];
                window._tkRows = {}; data.forEach(t => { window._tkRows[t.id] = t; });

                // الطلبات اليدوية (مقبول / موزّع) مع المعرّف لإمكانية التعديل والحذف
                let orders = [], canEditOrders = true;
                try {
                    const r = await supabaseClient.rpc('alsaree3_orders_admin', { p_date: date });
                    if (r.error) throw r.error;
                    orders = r.data || [];
                } catch (e) {
                    canEditOrders = false;
                    console.warn('[Orders admin]', e);
                    try { const r2 = await supabaseClient.rpc('alsaree3_dispatch_admin', { p_date: date }); orders = r2.data || []; } catch (e2) {}
                }
                window._ordRows = {}; orders.forEach(o => { if (o.id != null) window._ordRows[o.id] = o; });

                let h = '<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;"><span style="font-weight:800;">📅 التاريخ</span>'
                      + '<input type="date" value="' + sanitize(date) + '" onchange="window.openTickets(this.value)" style="border:1px solid #94a3b8;border-radius:8px;padding:4px 8px;font-weight:700;">'
                      + '<button onclick="window.openTickets(window._tkDate)" style="background:#f1f5f9;border:1px solid #cbd5e1;border-radius:8px;padding:4px 10px;font-weight:800;cursor:pointer;font-family:Cairo,sans-serif;">🔄 تحديث</button></div>'
                      + '<div style="font-size:0.8rem;color:#64748b;font-weight:700;margin-bottom:10px;">الخصم من تقييم اليوم عند إغلاقه الساعة 7: تأخر القراءة أكثر من ' + TICKET_READ_LIMIT_MIN + ' د = 1، وتأخر الحل أكثر من ' + TICKET_SOLVE_LIMIT_MIN + ' د أو عدم الحل = 2 (على مهامك 📨 فقط). ومكافأة +1 لكل رسالة واتساب يحلّها الموظف (حتى +10) والتقييم لا يتجاوز 100. حذف أي سجل يُلغي أثره عند إغلاق اليوم.</div>';
                if (!canEditOrders) {
                    h += '<div style="background:#fef2f2;border:1px solid #fca5a5;color:#b91c1c;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-weight:800;font-size:0.85rem;">⚠️ أزرار التعديل والحذف للطلبات اليدوية غير مفعّلة — شغّل ملف admin_tools.sql في Supabase ثم اضغط تحديث.</div>';
                }

                // ملخص لكل موظف
                const S = {};
                const _s = (k) => (S[k] = S[k] || { recv: 0, solved: 0, sent: 0, acc: 0, dis: 0, oldAcc: 0 });
                data.forEach(t => {
                    const a = _s(t.employee_key);
                    if (t.kind === 'self') { a.recv++; if (t.solved_at) a.solved++; }
                    else if (t.kind === 'accept') a.oldAcc++;
                    else a.sent++;
                });
                orders.forEach(o => { const a = _s(o.employee_key); if ((o.kind || 'dispatch') === 'accept') a.acc++; else a.dis++; });
                const T = { recv: 0, solved: 0, sent: 0, acc: 0, dis: 0, oldAcc: 0 };
                Object.keys(S).forEach(k => Object.keys(T).forEach(f => { T[f] += S[k][f]; }));
                const td = 'padding:8px;border-bottom:1px solid #e2e8f0;';
                const rowS = (name, a, bold) => '<tr' + (bold ? ' style="background:#f8fafc;font-weight:900;"' : '') + '><td style="' + td + 'font-weight:900;">' + name + '</td><td style="' + td + '">' + a.recv + '</td><td style="' + td + '">' + a.solved + '</td><td style="' + td + '">' + a.sent + '</td><td style="' + td + '">' + a.acc + (a.oldAcc ? ' <span style="color:#64748b;font-size:.75rem;">(+' + a.oldAcc + ' قديم)</span>' : '') + '</td><td style="' + td + '">' + a.dis + '</td></tr>';
                h += '<div style="font-weight:900;color:#334155;margin:6px 0;">📊 ملخص اليوم لكل موظف</div>'
                   + '<div style="overflow-x:auto;margin-bottom:14px;"><table style="width:100%;border-collapse:collapse;font-size:0.9rem;text-align:right;"><thead><tr style="background:#f1f5f9;font-weight:900;">'
                   + '<th style="padding:8px;">الموظف</th><th style="padding:8px;">📩 رسائل واصلة</th><th style="padding:8px;">✅ محلولة</th><th style="padding:8px;">📨 مهام مرسلة</th><th style="padding:8px;">✅ طلبات مقبولة</th><th style="padding:8px;">🚴 طلبات موزّعة</th></tr></thead><tbody>'
                   + Object.keys(S).map(k => rowS(_nm(k), S[k], false)).join('')
                   + (Object.keys(S).length ? rowS('الإجمالي', T, true) : '<tr><td colspan="6" style="padding:14px;text-align:center;color:#94a3b8;font-weight:700;">لا توجد بيانات في هذا اليوم.</td></tr>')
                   + '</tbody></table></div>';

                // الطلبات اليدوية: مقبول / موزّع (تعديل وحذف)
                [['accept', '✅ الطلبات المقبولة يدوياً', '#eff6ff', '#bfdbfe', '#1e40af'], ['dispatch', '🚴 الطلبات الموزّعة يدوياً', '#fffbeb', '#fde68a', '#92400e']].forEach(([kd, title, bg, bd, col]) => {
                    const rows = orders.filter(x => (x.kind || 'dispatch') === kd);
                    if (!rows.length) return;
                    h += '<div style="background:' + bg + ';border:1px solid ' + bd + ';border-radius:14px;padding:10px 14px;margin-bottom:12px;color:' + col + ';"><div style="font-weight:900;margin-bottom:6px;">' + title + ' (الإجمالي ' + rows.length + ')</div>'
                       + '<table style="width:100%;border-collapse:collapse;font-size:0.88rem;text-align:right;"><tbody>'
                       + rows.map(x => '<tr style="border-top:1px solid ' + bd + ';"><td style="padding:6px;font-weight:900;">' + _nm(x.employee_key) + '</td><td style="padding:6px;font-weight:800;">#' + sanitize(String(x.order_no)) + '</td><td style="padding:6px;">' + (x.created_at ? _tm(x.created_at) : '') + '</td>'
                           + '<td style="padding:6px;white-space:nowrap;">' + (canEditOrders && x.id != null ? _edtB('window.adminEditOrder(' + Number(x.id) + ')') + _delB('window.adminDelOrder(' + Number(x.id) + ')') : '') + '</td></tr>').join('')
                       + '</tbody></table></div>';
                });

                // سجل قديم للقبول (بدون أرقام)
                const oldAcc = data.filter(t => t.kind === 'accept');
                if (oldAcc.length) {
                    h += '<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:10px 14px;margin-bottom:12px;color:#1e40af;"><div style="font-weight:900;margin-bottom:6px;">✅ الطلبات المقبولة — سجل سابق بدون أرقام (' + oldAcc.length + ')</div>'
                       + '<table style="width:100%;border-collapse:collapse;font-size:0.88rem;text-align:right;"><tbody>'
                       + oldAcc.map(t => '<tr style="border-top:1px solid #bfdbfe;"><td style="padding:6px;font-weight:900;">' + _nm(t.employee_key) + '</td><td style="padding:6px;">' + _tm(t.created_at) + '</td><td style="padding:6px;">' + _delB('window.adminDelTicket(' + Number(t.id) + ')') + '</td></tr>').join('')
                       + '</tbody></table></div>';
                }

                // المهام والرسائل (تعديل وحذف)
                const list = data.filter(t => t.kind !== 'accept');
                h += '<div style="font-weight:900;color:#334155;margin:6px 0;">📋 المهام والرسائل</div>';
                if (!list.length) {
                    h += '<p style="text-align:center;color:#94a3b8;font-weight:700;padding:20px;">لا توجد مهام في هذا اليوم.</p>';
                } else {
                    h += '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:0.9rem;text-align:right;"><thead><tr style="background:#f1f5f9;font-weight:900;">'
                       + '<th style="padding:9px;">الموظف</th><th style="padding:9px;">المهمة</th><th style="padding:9px;">أُرسلت</th><th style="padding:9px;">القراءة</th><th style="padding:9px;">الحل</th><th style="padding:9px;">الخصم</th><th style="padding:9px;">إجراء</th></tr></thead><tbody>';
                    list.forEach(t => {
                        const pen = _ticketPenalty(t);
                        const isSelf = t.kind === 'self';
                        const rd = isSelf ? '<span style="color:#64748b;">وصلت ' + _tm(t.created_at) + '</span>' : (t.read_at ? ('✅ ' + _tm(t.read_at) + ' (بعد ' + _minsBetween(t.created_at, t.read_at) + ' د)') : '<span style="color:#dc2626;">لم يقرأ</span>');
                        const sv = t.solved_at ? ('✅ ' + _tm(t.solved_at) + ' (بعد ' + _minsBetween(t.created_at, t.solved_at) + ' د)') : '<span style="color:#dc2626;">لم يُحل</span>';
                        h += '<tr style="border-bottom:1px solid #e2e8f0;"><td style="padding:9px;font-weight:900;">' + _nm(t.employee_key) + '</td>'
                           + '<td style="padding:9px;">' + (isSelf ? '📩 رسالة وصلت للموظف' : '📨 ' + sanitize(t.body)) + '</td><td style="padding:9px;">' + _tm(t.created_at) + '</td>'
                           + '<td style="padding:9px;">' + rd + '</td><td style="padding:9px;">' + sv + '</td>'
                           + '<td style="padding:9px;font-weight:900;color:' + (pen ? '#dc2626' : '#16a34a') + ';">' + (pen ? '−' + pen : '0') + '</td>'
                           + '<td style="padding:9px;white-space:nowrap;">' + (isSelf ? '' : _edtB('window.adminEditTicket(' + Number(t.id) + ')')) + _delB('window.adminDelTicket(' + Number(t.id) + ')') + '</td></tr>';
                    });
                    h += '</tbody></table></div>';
                }
                body.innerHTML = h;
            } catch (e) {
                console.error('[Tickets]', e);
                body.innerHTML = '<p style="color:#dc2626;font-weight:700;">❌ تعذّر تحميل المهام. تأكد أنك شغّلت ملف tickets.sql في Supabase.</p>';
            }
        };

        // ----- تعديل وحذف (للمسؤول فقط، ويفرض السيرفر ذلك أيضاً — ملف admin_tools.sql) -----
        function _adminToolFail(error) {
            const m = String((error && error.message) || '');
            if (m.startsWith('[A3]')) { alert('⚠️ ' + m.slice(4)); return; }
            console.error('[AdminTools]', error);
            alert('❌ تعذّر تنفيذ العملية. تأكد أنك شغّلت ملف admin_tools.sql في Supabase.');
        }
        async function _adminToolDone() {
            await window.openTickets(window._tkDate);
            try { pollAdminTickets(); } catch (e) {}
        }
        window.adminDelTicket = async (id) => {
            if (loggedInId !== '__admin__') return;
            if (!confirm('حذف هذا السجل نهائياً؟')) return;
            if (!_checkWriteRate()) return;
            const { error } = await supabaseClient.rpc('alsaree3_ticket_delete', { p_id: Number(id) });
            if (error) { _adminToolFail(error); return; }
            await _adminToolDone();
        };
        window.adminEditTicket = async (id) => {
            if (loggedInId !== '__admin__') return;
            const t = (window._tkRows || {})[id]; if (!t) return;
            const v = prompt('تعديل نص المهمة:', t.body || '');
            if (v === null || !v.trim() || v.trim() === (t.body || '')) return;
            if (!_checkWriteRate()) return;
            const { error } = await supabaseClient.rpc('alsaree3_ticket_edit', { p_id: Number(id), p_body: v.trim() });
            if (error) { _adminToolFail(error); return; }
            await _adminToolDone();
        };
        window.adminDelOrder = async (id) => {
            if (loggedInId !== '__admin__') return;
            const o = (window._ordRows || {})[id];
            if (!confirm('حذف الطلب ' + (o ? '#' + o.order_no : '') + ' نهائياً؟')) return;
            if (!_checkWriteRate()) return;
            const { error } = await supabaseClient.rpc('alsaree3_order_delete', { p_id: Number(id) });
            if (error) { _adminToolFail(error); return; }
            await _adminToolDone();
        };
        window.adminEditOrder = async (id) => {
            if (loggedInId !== '__admin__') return;
            const o = (window._ordRows || {})[id]; if (!o) return;
            const v = (prompt('تعديل رقم الطلب:', String(o.order_no)) || '').trim();
            if (!v || v === String(o.order_no)) return;
            if (!/^[0-9A-Za-z\u0600-\u06FF#_\-\/]{1,30}$/.test(v)) { alert('⚠️ رقم الطلب غير صالح'); return; }
            if (!_checkWriteRate()) return;
            const { error } = await supabaseClient.rpc('alsaree3_order_edit', { p_id: Number(id), p_order: v });
            if (error) { _adminToolFail(error); return; }
            await _adminToolDone();
        };

        // ----- جهة المسؤول: متابعة الرسائل المفتوحة/المحلولة لكل موظف (تحديث كل 30 ثانية) -----
        window._adminTk = [];
        function _tkLabel(id) {
            const mine = (window._adminTk || []).filter(t => t.employee_key === id && t.kind === 'self');
            if (mine.length === 0) return '';
            const open = mine.filter(t => !t.solved_at).length, done = mine.length - open;
            return '<div style="font-size:.75rem;font-weight:900;margin-bottom:4px;">'
                 + (open ? '<span style="color:#dc2626;">📩 ' + open + ' مفتوحة</span> ' : '')
                 + (done ? '<span style="color:#16a34a;">✅ ' + done + ' حُلّت</span>' : '') + '</div>';
        }
        async function pollAdminTickets() {
            if (loggedInId !== '__admin__') return;
            try {
                const { data, error } = await supabaseClient.rpc('alsaree3_tickets_admin', { p_date: getTodayDateString() });
                if (error) return;
                window._adminTk = data || [];
                autoWaiveLeaveLate().catch(() => {});
                const openN = window._adminTk.filter(t => t.kind === 'self' && !t.solved_at).length;
                const bd = document.getElementById('tickets-badge');
                if (bd) { bd.textContent = openN; bd.classList.toggle('hidden', openN === 0); }
                if (typeof window.refreshLiveAdminTable === 'function' && !isViewingHistory) window.refreshLiveAdminTable();
            } catch (e) {}
        }
        setInterval(pollAdminTickets, 30000);
        setTimeout(pollAdminTickets, 4000);

        // ----- جهة الموظف: شريط يظهر فيه طلبات المسؤول -----
        let _tkWarned = false, _tkData = [];
        async function pollMyTickets() {
            ensureTicketFab();
            if (!loggedInId || loggedInId === '__admin__') { const b = document.getElementById('ticket-banner'); if (b) b.remove(); return; }
            try {
                const { data, error } = await supabaseClient.rpc('alsaree3_my_tickets');
                if (error) { if (!_tkWarned) { _tkWarned = true; console.warn('[Tickets]', error.message); } return; }
                _tkData = data || [];
                renderTicketBanner();
                try { render(); } catch (e) {}
            } catch (e) { if (!_tkWarned) { _tkWarned = true; console.warn('[Tickets]', e); } }
        }
        function renderTicketBanner() {
            let b = document.getElementById('ticket-banner');
            const _adm = _tkData.filter(t => t.kind !== 'self');
            if (!loggedInId || loggedInId === '__admin__' || _adm.length === 0) { if (b) b.remove(); return; }
            if (!b) {
                b = document.createElement('div'); b.id = 'ticket-banner';
                b.style.cssText = 'position:fixed;top:10px;left:50%;transform:translateX(-50%);width:min(560px,94vw);z-index:9990;direction:rtl;font-family:Cairo,sans-serif;display:flex;flex-direction:column;gap:8px;';
                document.body.appendChild(b);
            }
            b.innerHTML = _adm.map(t => {
                if (t.kind === 'self') {
                    return '<div style="background:#fff;border:2px solid #16a34a;border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">'
                         + '<div style="font-weight:900;color:#166534;">📩 رسالة واتساب وصلتك</div>'
                         + '<button onclick="window.markTicket(' + Number(t.id) + ',\'solved\')" style="background:#16a34a;color:#fff;border:none;border-radius:10px;padding:8px 16px;font-weight:900;cursor:pointer;font-family:Cairo,sans-serif;">✅ تم حلها</button></div>';
                }
                const el = Math.max(0, Math.floor((Date.now() - new Date(t.created_at).getTime()) / 60000));
                const readBtn = t.read_at ? '<span style="font-weight:800;color:#15803d;">✅ سُجّلت القراءة</span>'
                    : '<button onclick="window.markTicket(' + Number(t.id) + ',\'read\')" style="background:#2563eb;color:#fff;border:none;border-radius:10px;padding:8px 14px;font-weight:900;cursor:pointer;font-family:Cairo,sans-serif;">👁️ قرأت</button>';
                return '<div style="background:#fff;border:2px solid #f59e0b;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);">'
                     + '<div style="font-weight:900;color:#b45309;margin-bottom:6px;">📨 طلب من المسؤول <span style="font-weight:700;color:#64748b;font-size:.8rem;">(منذ ' + el + ' د)</span></div>'
                     + '<div style="font-weight:700;color:#0f172a;margin-bottom:10px;white-space:pre-wrap;">' + sanitize(t.body) + '</div>'
                     + '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' + readBtn
                     + '<button onclick="window.markTicket(' + Number(t.id) + ',\'solved\')" style="background:#16a34a;color:#fff;border:none;border-radius:10px;padding:8px 14px;font-weight:900;cursor:pointer;font-family:Cairo,sans-serif;">🛠️ تم الحل</button></div></div>';
            }).join('');
        }
        function ensureTicketFab() { const f = document.getElementById('ticket-fab'); if (f) f.remove(); }   // الأزرار صارت داخل بطاقة الموظف
        let _tkToastTimer = null;
        function _tkToast(msg, undoFn) {
            let t = document.getElementById('accept-toast');
            if (!t) {
                t = document.createElement('div'); t.id = 'accept-toast';
                t.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9985;background:#0f172a;color:#fff;border-radius:12px;padding:10px 16px;font-weight:800;font-family:Cairo,sans-serif;direction:rtl;';
                document.body.appendChild(t);
            }
            t.style.display = 'block';
            t.textContent = msg;
            if (undoFn) {
                const u = document.createElement('button');
                u.textContent = '\u21a9\ufe0f \u062a\u0631\u0627\u062c\u0639';
                u.style.cssText = 'margin-inline-start:10px;background:#fff;color:#0f172a;border:none;border-radius:8px;padding:2px 10px;font-weight:900;cursor:pointer;font-family:Cairo,sans-serif;';
                u.onclick = async () => {
                    u.disabled = true;
                    const ok = await undoFn();
                    t.textContent = ok ? '\u21a9\ufe0f \u062a\u0645 \u0627\u0644\u062a\u0631\u0627\u062c\u0639' : '\u274c \u062a\u0639\u0630\u0651\u0631 \u0627\u0644\u062a\u0631\u0627\u062c\u0639';
                    clearTimeout(_tkToastTimer); _tkToastTimer = setTimeout(() => { t.style.display = 'none'; }, 2500);
                };
                t.appendChild(u);
            }
            clearTimeout(_tkToastTimer); _tkToastTimer = setTimeout(() => { t.style.display = 'none'; }, undoFn ? 8000 : 2500);

                    let netSecs = d.totalWorkSeconds || 0;
                    if (netSecs < 0) netSecs = 0;
                    let th = Math.floor(netSecs / 3600);
                    let tm = Math.floor((netSecs % 3600) / 60);
                    totalTimerHtml = `${th}h:${tm}m`;
                } else if (d.startTime && d.status === 'خارج العمل') {
                    // ثابت نهائي — استخدم totalWorkSeconds لأن lastActionTime=null
                    let netSecs = d.totalWorkSeconds || 0;
                    if (netSecs < 0) netSecs = 0;
                    let th = Math.floor(netSecs / 3600);
                    let tm = Math.floor((netSecs % 3600) / 60);
                    totalTimerHtml = `${th}h:${tm}m`;
                }
                let curTimer = `<span id="timer-${sanitize(i)}" class="timer-text">${totalTimerHtml}</span>`;
                let stateClass = ''; 
                if (d.status === 'بريك') stateClass = 'break-active'; 
                else if (d.status === 'راحة') stateClass = 'rest-active';
                else if (d.status === 'حضور') stateClass = 'attendance-active';
                else if (d.status === 'أوف') stateClass = 'off-active';

                // إبراز بطاقة الموظف المسجل (مسؤول يرى الكل بدون تمييز)
                let myCard = (i === loggedInId) ? 'my-card-highlight' : '';
                let myBadge = (i === loggedInId) ? `<span class="text-xs bg-green-100 text-green-700 font-black px-2 py-1 rounded-lg border border-green-300 ml-2">أنت</span>` : '';
                
                let currentHourIndex = d.startTime ? Math.floor((now - d.startTime) / 3600000) : 0;
                let hourlyBreaks = d.hourlyBreaks || {};
                // احسب فقط دقائق البريك الحالي التي تقع ضمن الساعة الحالية
                let cB = 0;
                if (d.status === 'بريك' && d.lastActionTime) {
                    let breakStartHourIndex = d.startTime ? Math.floor((d.lastActionTime - d.startTime) / 3600000) : 0;
                    if (breakStartHourIndex === currentHourIndex) {
                        // البريك بدأ في نفس الساعة الحالية — احسب كل المدة
                        cB = Math.floor((now - d.lastActionTime) / 60000);
                    } else {
                        // البريك بدأ في ساعة سابقة — الجزء الحالي فقط هو من بداية الساعة الحالية
                        let currentHourStart = d.startTime + (currentHourIndex * 3600000);
                        cB = Math.floor((now - currentHourStart) / 60000);
                        if (cB < 0) cB = 0;
                    }
                }
                let activeHourBreakTotal = (hourlyBreaks[currentHourIndex] || 0) + cB;
                // لا نعرض عداد البريك الساعي لموظف خارج العمل أو في يوم OFF (كانت تظهر بقايا قديمة)
                if (d.status === 'خارج العمل' || d.status === 'أوف') activeHourBreakTotal = 0;
                
                let cR = (d.status === 'راحة' && d.lastActionTime) ? Math.floor((now - d.lastActionTime) / 60000) : 0;
                let accR = (d.totalRestMinutes || 0) + cR;

                let currentStatusDisplay = d.status;
                if(d.status === 'حضور') currentStatusDisplay = 'Active';
                else if(d.status === 'بريك') currentStatusDisplay = 'Break';
                else if(d.status === 'راحة') currentStatusDisplay = 'Rest';
                else if(d.status === 'أوف') currentStatusDisplay = 'OFF';
                else if(d.status === 'خارج العمل') currentStatusDisplay = 'Out of Office';

                let taskDisplay = d.currentTask || 'None';
                if(d.currentTask === 'واتساب') taskDisplay = 'WhatsApp';
                else if(d.currentTask === 'توزيع') taskDisplay = 'Dispatcher';
                else if(d.currentTask === 'قبول') taskDisplay = 'Accepting';
                else if(d.currentTask === 'لا يوجد') taskDisplay = 'None';

                // ===== SECURITY: إخفاء الأزرار عن بطاقات الموظفين الآخرين =====
                const isAdmin = (loggedInId === '__admin__');
                const canControl = isAdmin || (i === loggedInId);
                const escId = sanitize(String(i).replace(/\\/g, '\\\\').replace(/'/g, "\\'")); // إفلات JS ثم HTML لمنع XSS في onclick

                // أزرار المهمة: تظهر في بطاقة الموظف نفسه حسب المهمة المختارة
                let taskExtra = '';
                if (i === loggedInId && !isAdmin) {
                    const _openN = (typeof _tkData !== 'undefined' ? _tkData : []).filter(t => t.kind === 'self' && !t.solved_at).length;
                    const _todayStr = getTodayDateString();
                    const _todaySelf = (typeof _tkData !== 'undefined' ? _tkData : []).filter(t => {
                        if (t.kind !== 'self') return false;
                        const x = new Date(t.created_at);
                        return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0') === _todayStr;
                    });
                    const _todayN = _todaySelf.length, _openToday = _todaySelf.filter(t => !t.solved_at).length;
                    if (d.currentTask === 'واتساب') {
                        taskExtra = `<div class="tk-row">
                            <button onclick="window.ticketReceived(this)" class="tk-btn tk-in">📩 وصلني طلب</button>
                            <button onclick="window.ticketSolved(this)" ${_openN ? '' : 'disabled'} class="tk-btn tk-ok">✅ تم الحل${_openN ? ' <span class="tk-badge">' + _openN + '</span>' : ''}</button>
                        </div>
                        <div class="tk-stat">\u0627\u0644\u064a\u0648\u0645: ${_todayN} \u0648\u0635\u0644 \u00b7 ${_todayN - _openToday} \u0627\u0646\u062d\u0644</div>`;
                    } else if (d.currentTask === 'توزيع' || d.currentTask === 'قبول') {
                        const _k = d.currentTask === 'قبول' ? 'accept' : 'dispatch';
                        if (!_ordLoadedAt[_k] || Date.now() - _ordLoadedAt[_k] > 20000) { _ordLoadedAt[_k] = Date.now(); _fetchMyOrders(_k); }
                        const _ol = _ordData[_k], _dn = _ol.length;
                        taskExtra = `<div class="tk-row"><input id="disp-input" type="text" inputmode="numeric" maxlength="30" autocomplete="off" placeholder="رقم الطلب" class="tk-input" onkeydown="if(event.key==='Enter')window.addOrder()"><button onclick="window.addOrder(this)" class="tk-btn tk-in" style="flex:0 0 auto;">➕ إضافة</button></div>
                        <div class="tk-stat">اليوم: ${_dn} طلب ${_k === 'accept' ? 'مقبول' : 'موزّع'}${_dn ? ' · آخر رقم: ' + sanitize(String(_ol[0].order_no)) : ''}</div>`;
                    }
                }
                const waBox = (i === loggedInId && !isAdmin) ? `
                        <div class="mb-3"><button onclick="window.openWA()" class="tk-btn tk-wa tk-small">💬 واتساب الزبائن</button></div>` : '';
                const taskButtonsHtml = canControl ? `
                        <div class="block mb-3 text-xs font-bold text-black text-right pr-1">المهمة الحالية (Current Task):</div>
                        <div class="grid grid-cols-3 gap-2 mb-5">
                            <button onclick="window.setTask('${escId}', 'واتساب')" class="task-btn ${d.currentTask === 'واتساب' ? 'active' : ''}">💬 WhatsApp</button>
                            <button onclick="window.setTask('${escId}', 'توزيع')" class="task-btn ${d.currentTask === 'توزيع' ? 'active' : ''}">🚴 Dispatcher</button>
                            <button onclick="window.setTask('${escId}', 'قبول')" class="task-btn ${d.currentTask === 'قبول' ? 'active' : ''}">✅ Accept</button>
                        </div>
                        ${taskExtra}
                        ${waBox}
                        <div class="block mb-2 text-xs font-bold text-black text-right pr-1">الإجراءات (Actions):</div>
                        <div class="grid grid-cols-2 gap-3">
                            ${(d.status === 'بريك' || d.status === 'راحة') ? `<button onclick="window.updateStatus('${escId}', 'حضور')" class="col-span-2 py-3 rounded-2xl bg-green-500 hover:bg-green-600 text-white font-black text-base">✅ إنهاء ${d.status === 'بريك' ? 'البريك' : 'الراحة'} والعودة للعمل</button>` : ''}
                            <button onclick="window.updateStatus('${escId}', 'بريك')" class="btn-opt ${d.status === 'بريك' ? 'bg-red-200 border-red-500 font-black' : ''} text-black">Break</button>
                            <button onclick="window.updateStatus('${escId}', 'راحة')" class="btn-opt ${d.status === 'راحة' ? 'bg-orange-200 border-orange-400 font-black' : ''} text-black">Rest (15m)</button>
                            <button onclick="window.updateStatus('${escId}', 'حضور')" class="btn-opt ${d.status === 'حضور' ? 'bg-green-200 border-green-500 font-black' : ''} text-black">Check-In</button>
                            <button onclick="window.updateStatus('${escId}', 'أوف')" class="btn-opt ${d.status === 'أوف' ? 'bg-blue-200 border-blue-500 font-black' : ''} text-black">OFF Day</button>
                            <button onclick="window.updateStatus('${escId}', 'خارج العمل')" class="btn-opt hover:bg-red-100 text-black col-span-2">Check-Out</button>
                        </div>` : `
                        <div class="mt-4 text-center py-4 rounded-2xl bg-gray-50 border border-gray-200">
                            <span class="text-gray-400 text-sm font-bold">🔒 للعرض فقط</span>
                        </div>`;

                h += `<div class="card-box ${stateClass} ${myCard}">
                        <h3 class="font-black text-black mb-2 text-2xl flex justify-between items-center tracking-wide"><span>${myBadge}${sanitize(d.name)}</span><div class="text-right leading-tight">${d.startTime && d.status !== 'أوف' ? '<span class=\"text-xs font-bold text-gray-400\">⏱ Total Hours</span><br>' : ''}${curTimer}</div></h3>
                        <div class="flex justify-between text-xs font-bold text-gray-500 mb-4 border-b border-green-200 pb-2">
                            <span>Break This Hour: <b id="hourbreak-${sanitize(i)}" class="${activeHourBreakTotal > 5 ? 'text-red-600' : 'text-black'}">${activeHourBreakTotal} / 5 min</b></span>
                            <span>Available Rest: <b id="accrest-${sanitize(i)}" class="${accR > 15 ? 'text-red-600': 'text-black'}">${accR} / 15 m</b></span>
                        </div>
                        <div class="flex justify-between text-xs font-bold text-gray-500 mb-4 pb-2 border-b border-green-200">
                            <span>Status: <b class="text-green-600">${sanitize(currentStatusDisplay)}</b></span>
                            <span>Task: <b class="text-blue-600">${sanitize(taskDisplay)}</b></span>
                        </div>
                        ${taskButtonsHtml}
                    </div>`;
            }
            const _di = document.getElementById('disp-input'), _dv = _di ? _di.value : '', _df = !!_di && document.activeElement === _di;
            document.getElementById('app').innerHTML = h;
            if (_dv || _df) {
                const _nx = document.getElementById('disp-input');
                if (_nx) { _nx.value = _dv; if (_df) { _nx.focus(); try { _nx.setSelectionRange(_dv.length, _dv.length); } catch (e) {} } }
            }
        }
        
        // ===== معالجة لقطة بيانات الموظفين (تُستدعى من Realtime ومن المزامنة الدورية) =====
        function handleEmployeesSnapshot(freshData) {
            const today = getTodayDateString();

            // صفّر أي موظف حالته بريك/راحة/حضور من يوم سابق
            for (let id in freshData) {
                const d = freshData[id];
                if (!['بريك', 'راحة', 'حضور'].includes(d.status)) continue;
                
                // تحقق من التاريخ عبر lastActiveDate أو lastActionTime أو startTime
                const _localDate = t => { const x = new Date(t); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
                const lastDate = d.lastActiveDate ||
                    (d.lastActionTime ? _localDate(d.lastActionTime) : null) ||
                    (d.startTime ? _localDate(d.startTime) : null);
                
                if (lastDate !== today) {
                    freshData[id] = { 
                        ...d, 
                        status: 'خارج العمل', 
                        lastActionTime: null, 
                        startTime: null, 
                        lastActiveDate: today
                    };
                    if (!_staleResetAt[id] || Date.now() - _staleResetAt[id] > 15000) {
                        _staleResetAt[id] = Date.now();
                        if (loggedInId === '__admin__') safeUpdateEmployee(id, { status: 'خارج العمل', lastActionTime: null, startTime: null, lastActiveDate: today });
                        else if (id === loggedInId) _syncMyDay();
                    }
                }
            }

            // احتفظ بالحالة المحلية للموظف المسجل إذا كان هناك lock
            {
                _applyPending(freshData);
                // حافظ على أعلى قيمة لـ totalBreakMinutes و totalRestMinutes لكل موظف
                // لمنع إرجاع قيمة قديمة أقل بسبب تأخر الشبكة
                for (let id in freshData) {
                    const oldD = employeesData[id];
                    // لا نحمي القيم الأعلى إذا بدأ يوم جديد (startTime تغيّر) أو صُفّر الموظف — وإلا لا يعود العداد للصفر أبداً
                    const sameDay = oldD && oldD.startTime && freshData[id].startTime === oldD.startTime;
                    if (oldD && sameDay) {
                        if ((oldD.totalBreakMinutes || 0) > (freshData[id].totalBreakMinutes || 0)) {
                            freshData[id].totalBreakMinutes = oldD.totalBreakMinutes;
                        }
                        if ((oldD.totalRestMinutes || 0) > (freshData[id].totalRestMinutes || 0)) {
                            freshData[id].totalRestMinutes = oldD.totalRestMinutes;
                        }
                        if ((oldD.totalWorkSeconds || 0) > (freshData[id].totalWorkSeconds || 0)) {
                            freshData[id].totalWorkSeconds = oldD.totalWorkSeconds;
                        }
                    }
                }
                employeesData = freshData;
            }
            if (loggedInId) render();
        }
        
        // تحديث عداد Total Hours كل ثانية بدون إعادة بناء كل الكروت
        function updateTimers() {
            if (!loggedInId) return;
            const now = Date.now();
            for (let i in employeesData) {
                const d = employeesData[i];
                const timerEl = document.getElementById('timer-' + i);
                if (!timerEl) continue;

                if (d.status === 'حضور' && d.startTime && d.lastActionTime) {
                    // عداد حي — يحسب من startTime ناقص كل البريك والراحة المتراكمة
                    // الوقت المتراكم + الجلسة الحالية (نفس طريقة لوحة المسؤول)
                    let netSecs = (d.totalWorkSeconds || 0) + Math.max(0, Math.floor((now - d.lastActionTime) / 1000));
                    if (netSecs < 0) netSecs = 0;
                    let th = Math.floor(netSecs / 3600);
                    let tm = Math.floor((netSecs % 3600) / 60);
                    let ts = (netSecs % 60).toString().padStart(2, '0');
                    timerEl.textContent = `${th}h:${tm}m:${ts}s`;

                } else if (d.status === 'خارج العمل' && d.startTime) {
                    // عرض ثابت — استخدم totalWorkSeconds المحفوظ لأن lastActionTime=null بعد Check-Out
                    let netSecs = d.totalWorkSeconds || 0;
                    if (!netSecs && d.startTime) {
                        // fallback: احسب من startTime ناقص البريك
                        let tBf = d.totalBreakMinutes || 0;
                        let tRf = d.totalRestMinutes || 0;
                        netSecs = Math.floor((now - d.startTime) / 1000) - (tBf * 60) - (tRf * 60);
                    }
                    if (netSecs < 0) netSecs = 0;
                    let th = Math.floor(netSecs / 3600);
                    let tm = Math.floor((netSecs % 3600) / 60);
                    timerEl.textContent = `${th}h:${tm}m`;

                } else if ((d.status === 'بريك' || d.status === 'راحة') && d.startTime) {
                    // متجمد — اعرض ساعات العمل المتراكمة فقط (totalWorkSeconds) بدون إضافة الجلسة الحالية
                    let netSecs = d.totalWorkSeconds || 0;
                    if (netSecs < 0) netSecs = 0;
                    let th = Math.floor(netSecs / 3600);
                    let tm = Math.floor((netSecs % 3600) / 60);
                    timerEl.textContent = `${th}h:${tm}m`;

                } else {
                    timerEl.textContent = '';
                }

                // تحديث عداد البريك الساعي (كل ساعة = 5 دقائق مسموح)
                const hourBreakEl = document.getElementById('hourbreak-' + i);
                const accRestEl = document.getElementById('accrest-' + i);
                if (hourBreakEl && (d.startTime || d.lastActionTime) && d.status !== 'خارج العمل' && d.status !== 'أوف') {
                    // رقم الساعة الحالية من وقت Check-In
                    const HOUR_MS = 60 * 60 * 1000;
                    const _base = d.startTime || d.lastActionTime;
                    let currentHourIdx = Math.floor((now - _base) / HOUR_MS);
                    let currentHourStart = _base + (currentHourIdx * HOUR_MS);

                    // احسب كم ثانية أخذ البريك في هذه الساعة فقط
                    let hourBreakSec = 0;

                    // البريك الجاري الآن — فقط الجزء الواقع في الساعة الحالية
                    if (d.status === 'بريك' && d.lastActionTime) {
                        let breakStart = Math.max(d.lastActionTime, currentHourStart);
                        let liveMs = now - breakStart;
                        if (liveMs > 0) hourBreakSec += Math.floor(liveMs / 1000);
                    }

                    // أضف البريك المحفوظ في hourlyBreaks لهذه الساعة (بالدقائق → ثواني)
                    let hourlyBreaks = d.hourlyBreaks || {};
                    hourBreakSec += (hourlyBreaks[currentHourIdx] || 0) * 60;

                    // عرض mm:ss
                    let dispMin = Math.floor(hourBreakSec / 60);
                    let dispSec = (hourBreakSec % 60).toString().padStart(2, '0');

                    // الوقت المتبقي لنهاية الساعة الحالية
                    let hourEndMs = currentHourStart + HOUR_MS;
                    let remainSec = Math.ceil((hourEndMs - now) / 1000);
                    if (remainSec < 0) remainSec = 0;
                    let remMin = Math.floor(remainSec / 60);
                    let remSec = (remainSec % 60).toString().padStart(2, '0');

                    hourBreakEl.textContent = `${dispMin}:${dispSec} / 5m  (resets in ${remMin}:${remSec})`;
                    hourBreakEl.className = hourBreakSec >= 300 ? 'text-red-600' : 'text-black';
                }
                if (accRestEl) {
                    let cR = (d.status === 'راحة' && d.lastActionTime) ? Math.floor((now - d.lastActionTime) / 60000) : 0;
                    let accR = (d.totalRestMinutes || 0) + cR;
                    accRestEl.textContent = `${accR} / 15 m`;
                    accRestEl.className = accR > 15 ? 'text-red-600' : 'text-black';
                }
            }
        }

        // تحديث العداد كل ثانية فقط
        setInterval(() => {
            if (!loggedInId) return;
            updateTimers();
            updateAdminTableTimers();
        }, 1000);

        // ===== إنهاء البريك/الراحة العالقة تلقائياً =====
        const _autoEnded = {};
        function autoEndStuckBreaks() {
            if (!loggedInId) return;
            const now = Date.now(), isAdmin = (loggedInId === '__admin__');
            for (const id in employeesData) {
                if (!isAdmin && id !== loggedInId) continue;     // كل جهاز ينهي بطاقته فقط، والمسؤول ينهي الجميع
                const d = employeesData[id];
                if (!d || !d.lastActionTime) continue;
                const mins = (now - d.lastActionTime) / 60000;
                const over = (d.status === 'بريك' && MAX_BREAK_MINUTES > 0 && mins >= MAX_BREAK_MINUTES)
                          || (d.status === 'راحة' && MAX_REST_MINUTES > 0 && mins >= MAX_REST_MINUTES);
                if (!over) continue;
                if (_autoEnded[id] && now - _autoEnded[id] < 60000) continue;   // لا تكرر قبل دقيقة
                _autoEnded[id] = now;
                console.log('[Auto-End]', id, d.status, Math.round(mins) + ' min');
                window.updateStatus(id, 'حضور', true);
            }
        }
        setInterval(autoEndStuckBreaks, 5000);

        // backup والـ cron كل 10 ثواني — لا حاجة لإرسالها كل ثانية
        setInterval(() => {
            if (!loggedInId) return;
            checkAutoResetCron();
            if (!isViewingHistory) {
                for (let id in employeesData) {
                    if (employeesData[id].startTime && employeesData[id].status !== 'خارج العمل') {
                        backupCurrentDataToHistory(id, false);
                    }
                }
            }
        }, 10000);

        // حساب الـ rating محلياً كل دقيقة بدون كتابة للسيرفر
        setInterval(() => {
            if (!loggedInId) return;
            checkAndApplyRatings();
        }, 60000);

        console.log('%c[Alsaree3 v6] البيانات كلها على Supabase (محمية بـ RLS)', 'color:#16a34a;font-weight:bold');
    </script>
