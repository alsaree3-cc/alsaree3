<body>

    <!-- شاشة تسجيل الدخول -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0"></script>
    <script>
        // ===== Supabase: الاتصال (المفتاح publishable مخصص للمتصفح — الحماية الفعلية عبر RLS في قاعدة البيانات) =====
        const SUPABASE_URL = 'https://eygohyybhidlsycblfop.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_6Y3sDrJirAA8O2j2Iugpfg_WUOr8IBm';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
            auth: { persistSession: false, autoRefreshToken: true, detectSessionInUrl: false }
        });
        // الشاشة مشتركة بين الموظفين: لا نحتفظ بجلسة قديمة بعد إعادة تحميل الصفحة

        // ===== إعدادات قواعد العمل الجديدة =====
        const WORK_LOCATION = { lat: 33.293117, lng: 44.433205 };   // موقع العمل
        const WORK_RADIUS_METERS = 1000;                  // أقصى مسافة مسموحة لتسجيل الحضور (1 كم)
        // المجموعات: كل مجموعة قائمة بمفاتيح الموظفين (employee_key). الموظفون غير المذكورين يُعتبرون في مجموعة واحدة مشتركة.
        const BREAK_GROUPS = [];                          // مثال: [['ahmed','ali','sara'], ['omar','huda']]
        const BLOCK_BREAK_IF_GROUP_BUSY = true;           // true = منع البريك | false = السماح مع خصم من التقييم
        const GROUP_BREAK_PENALTY_POINTS = 5;             // الخصم عند بريك أثناء بريك زميل (يُطبق فقط إذا BLOCK = false)

        function getGroupMates(id) {
            const g = BREAK_GROUPS.find(arr => arr.includes(id));
            const all = Object.keys(employeesData);
            if (g) return g.filter(k => k !== id && employeesData[k]);
            const grouped = new Set(BREAK_GROUPS.flat());
            return all.filter(k => k !== id && !grouped.has(k));
        }
        function getMateOnBreak(id) {
            const _today = getTodayDateString();
            const k = getGroupMates(id).find(m => employeesData[m] && employeesData[m].status === 'بريك'
                && employeesData[m].lastActiveDate === _today);   // بريك قديم عالق من أمس لا يمنع الآخرين
            return k ? employeesData[k] : null;
        }
        function distanceMeters(lat1, lng1, lat2, lng2) {
            const R = 6371000, toRad = x => x * Math.PI / 180;
            const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
            const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
            return 2 * R * Math.asin(Math.sqrt(a));
        }
        // يرجع { ok, msg } — الحضور مسموح فقط ضمن نصف قطر 1 كم من موقع العمل
        function verifyWorkLocation() {
            return new Promise(resolve => {
                if (WORK_LOCATION.lat === null || WORK_LOCATION.lng === null) {
                    console.warn('[Geofence] لم يتم ضبط WORK_LOCATION — التحقق من الموقع معطّل');
                    return resolve({ ok: true });
                }
                if (!navigator.geolocation) return resolve({ ok: false, msg: 'المتصفح لا يدعم تحديد الموقع' });
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        const dist = distanceMeters(pos.coords.latitude, pos.coords.longitude, WORK_LOCATION.lat, WORK_LOCATION.lng);
                        if (dist <= WORK_RADIUS_METERS) resolve({ ok: true });
                        else resolve({ ok: false, msg: 'أنت بعيد عن موقع العمل (' + (dist/1000).toFixed(1) + ' كم). يجب أن تكون ضمن ' + (WORK_RADIUS_METERS/1000) + ' كم لتسجيل الحضور.' });
                    },
                    err => resolve({ ok: false, msg: err.code === 1 ? 'يجب السماح للموقع (Location) في المتصفح لتسجيل الحضور' : 'تعذّر تحديد موقعك، حاول مرة أخرى' }),
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            });
        }

        // ===== تحويل بين أسماء الحقول في التطبيق (camelCase) وأعمدة قاعدة البيانات (snake_case) =====
        const EMP_FIELDS = {
            name: 'name', status: 'status', startTime: 'start_time', lastActionTime: 'last_action_time',
            lastActiveDate: 'last_active_date', totalBreakMinutes: 'total_break_minutes',
            totalRestMinutes: 'total_rest_minutes', totalWorkSeconds: 'total_work_seconds',
            hourlyBreaks: 'hourly_breaks', slotBreaks: 'slot_breaks', rating: 'rating',
            allowedBreakSaved: 'allowed_break_saved', currentTask: 'current_task',
            monthlyRating: 'monthly_rating', monthlyHistory: 'monthly_history'
        };
        const NUMERIC_COLS = new Set(['start_time','last_action_time','total_break_minutes','total_rest_minutes','total_work_seconds','rating','allowed_break_saved','monthly_rating']);
        const JSON_COLS = new Set(['hourly_breaks','slot_breaks','monthly_history']);

        function empFromRow(r) {           // صف من القاعدة → كائن التطبيق (الأعمدة غير الموجودة تُترك undefined)
            const o = {};
            for (const [camel, col] of Object.entries(EMP_FIELDS)) {
                if (!(col in r)) continue;
                let v = r[col];
                if (v !== null && v !== undefined) {
                    if (NUMERIC_COLS.has(col)) v = Number(v);
                    else if (JSON_COLS.has(col) && typeof v === 'string') { try { v = JSON.parse(v); } catch(e) { v = {}; } }
                }
                o[camel] = v;
            }
            return o;
        }
        function empToRow(obj) {           // كائن التطبيق → صف للقاعدة
            const row = {};
            for (const [camel, col] of Object.entries(EMP_FIELDS)) {
                if (obj[camel] === undefined) continue;
                let v = obj[camel];
                if (JSON_COLS.has(col) && (v === null)) v = {};
                row[col] = v;
            }
            return row;
        }
        function historyToRow(date, id, p) {
            const row = { history_date: date, employee_key: id };
            const map = { name:'name', startTimeStr:'start_time_str', totalDurationStr:'total_duration_str', currentTask:'current_task',
                          totalBreakMinutes:'total_break_minutes', totalRestMinutes:'total_rest_minutes', totalWorkSeconds:'total_work_seconds',
                          rating:'rating', monthlyRating:'monthly_rating', savedAt:'saved_at' };
            for (const [k, col] of Object.entries(map)) if (p[k] !== undefined) row[col] = p[k];
            return row;
        }
        function historyFromRow(r) {
            return { name: r.name, startTimeStr: r.start_time_str, totalDurationStr: r.total_duration_str, currentTask: r.current_task,
                     totalBreakMinutes: r.total_break_minutes, totalRestMinutes: r.total_rest_minutes, totalWorkSeconds: r.total_work_seconds,
                     rating: r.rating, monthlyRating: r.monthly_rating, savedAt: r.saved_at };
        }

        // ===== طبقة البيانات (كل القراءة/الكتابة تمر من هنا، والحماية الحقيقية في RLS) =====
        let _syncErrAt = 0;
        function reportSyncError(err, what) {
            console.error('[Supabase] فشل ' + what + ':', err);
            if (Date.now() - _syncErrAt > 30000) {
                _syncErrAt = Date.now();
                alert('⚠️ تعذّر حفظ التغيير على السيرفر (' + what + ').\nتحقق من الاتصال بالإنترنت، وإن استمرت المشكلة سجّل الخروج وادخل من جديد.');
            }
        }

        async function fetchEmployeesMap() {
            const { data, error } = await supabaseClient.from('alsaree3_employees').select('*').order('employee_key');
            if (error) throw error;
            const map = {};
            (data || []).forEach(r => { map[r.employee_key] = empFromRow(r); });
            return map;
        }

        // تحديث بطاقة موظف واحد (الموظف لا يكتب إلا بطاقته — والسيرفر يفرض ذلك أيضاً)
        const _writeChain = {};   // id -> آخر عملية كتابة (لضمان ترتيب الكتابات وعدم تقدّم القديمة على الجديدة)
        function safeUpdateEmployee(id, data) {
            const prev = _writeChain[id] || Promise.resolve();
            const next = prev.catch(() => {}).then(() => _doUpdateEmployee(id, data));
            _writeChain[id] = next;
            return next;
        }
        async function _doUpdateEmployee(id, data) {
            if (loggedInId !== '__admin__' && loggedInId !== id) return { ok: false, skipped: true };
            const row = empToRow(data);
            if (Object.keys(row).length === 0) return { ok: true };
            let lastErr = null;
            for (let attempt = 0; attempt < 3; attempt++) {
                if (attempt > 0) await new Promise(r => setTimeout(r, 600 * attempt));
                if (!_checkWriteRate()) return { ok: false, skipped: true };
                try {
                    const { data: res, error } = await supabaseClient.from('alsaree3_employees')
                        .update(row).eq('employee_key', id).select('employee_key');
                    if (!error && res && res.length > 0) return { ok: true };
                    if (!error && (!res || res.length === 0)) { lastErr = new Error('0 rows updated (RLS?)'); break; }  // رفض صلاحيات: لا فائدة من التكرار
                    lastErr = error;
                } catch (e) { lastErr = e; }   // انقطاع شبكة: أعد المحاولة
            }
            reportSyncError(lastErr, 'تحديث الموظف');
            return { ok: false };
        }

        // مسؤول فقط: تحديث عدة موظفين بمفاتيح بنمط employees/<id>/<field> (تستخدمها endOfDay)
        async function applyEmployeePathUpdates(paths) {
            const grouped = {};
            for (const [path, val] of Object.entries(paths)) {
                const m = path.match(/^employees\/([^/]+)\/(.+)$/);
                if (!m) continue;
                (grouped[m[1]] = grouped[m[1]] || {})[m[2]] = val;
            }
            const results = await Promise.all(Object.entries(grouped).map(async ([id, fields]) => {
                const row = empToRow(fields);
                if (Object.keys(row).length === 0) return true;
                const { error } = await supabaseClient.from('alsaree3_employees').update(row).eq('employee_key', id);
                if (error) { console.error('[Supabase] فشل تحديث', id, error); return false; }
                return true;
            }));
            if (results.some(ok => !ok)) throw new Error('فشل تحديث بعض الموظفين');
        }

        async function saveHistoryRow(date, id, payload) {
            if (loggedInId !== '__admin__' && loggedInId !== id) return;
            if (!_checkWriteRate()) return;
            const { error } = await supabaseClient.from('alsaree3_history')
                .upsert(historyToRow(date, id, payload), { onConflict: 'history_date,employee_key' });
            if (error) console.error('[Supabase] فشل حفظ الأرشيف:', error);
        }

        // مسؤول فقط: حفظ أرشيف عدة موظفين دفعة واحدة (مفاتيح بنمط history/<date>/<id>)
        async function applyHistoryPathUpdates(paths) {
            const rows = [];
            for (const [path, val] of Object.entries(paths)) {
                const m = path.match(/^history\/([^/]+)\/([^/]+)$/);
                if (m) rows.push(historyToRow(m[1], m[2], val));
            }
            if (rows.length === 0) return;
            const { error } = await supabaseClient.from('alsaree3_history')
                .upsert(rows, { onConflict: 'history_date,employee_key' });
            if (error) throw error;
        }

        async function fetchHistoryFor(date) {
            const { data, error } = await supabaseClient.from('alsaree3_history')
                .select('*').eq('history_date', date).order('employee_key');
            if (error) throw error;
            const out = {};
            (data || []).forEach(r => { out[r.employee_key] = historyFromRow(r); });
            return out;
        }

        async function insertDeviceLog(entry) {
            const { error } = await supabaseClient.from('alsaree3_device_log').insert({
                emp_id: entry.empId, emp_name: entry.empName, type: entry.type || null,
                fingerprint: entry.fingerprint || null, user_agent: entry.userAgent || null,
                ts: entry.timestamp, time_str: entry.time || null
            });
            if (error) console.warn('[Supabase] device log:', error.message);
        }

        // تصفير اليوم على السيرفر — الأوضاع: force | full | catchup | evening (انظر supabase_setup.sql)
        async function runDayReset(mode) {
            const { data, error } = await supabaseClient.rpc('alsaree3_reset_day', { p_mode: mode });
            if (error) { console.error('[Reset]', mode, error); throw error; }
            return data === true;
        }

        // ===== المزامنة اللحظية (Realtime) مع مزامنة احتياطية دورية =====
        let _rtChannel = null;
        let _rtEverSubscribed = false;
        let _serverEmployees = {};
        function _snapshotClone() {
            const sorted = {};
            Object.keys(_serverEmployees).sort().forEach(k => { sorted[k] = _serverEmployees[k]; });
            return JSON.parse(JSON.stringify(sorted));
        }
        async function resyncEmployees() {
            _serverEmployees = await fetchEmployeesMap();
            handleEmployeesSnapshot(_snapshotClone());
        }
        function subscribeEmployees(skipInitialSync) {
            if (_rtChannel) return;
            _rtChannel = supabaseClient.channel('alsaree3-employees')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'alsaree3_employees' }, (payload) => {
                    if (payload.eventType === 'DELETE') {
                        delete _serverEmployees[payload.old.employee_key];
                    } else {
                        const key = payload.new.employee_key;
                        _serverEmployees[key] = Object.assign({}, _serverEmployees[key] || {}, empFromRow(payload.new));
                    }
                    handleEmployeesSnapshot(_snapshotClone());
                })
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        if (skipInitialSync && !_rtEverSubscribed) { _rtEverSubscribed = true; return; }
                        _rtEverSubscribed = true;
                        resyncEmployees().catch(() => {});   // إعادة اتصال: عوّض ما فاتك
                    }
                });
        }
        function unsubscribeEmployees() {
            if (_rtChannel) { supabaseClient.removeChannel(_rtChannel); _rtChannel = null; }
            _rtEverSubscribed = false;
            _serverEmployees = {};
        }
        // شبكة أمان: لو فاتت أحداث (نوم الجهاز/انقطاع) نعيد المزامنة كل 45 ثانية وعند العودة للتبويب
        setInterval(() => { if (loggedInId) resyncEmployees().catch(() => {}); }, 15000);
        window.addEventListener('online', () => { if (loggedInId) resyncEmployees().catch(() => {}); });
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && loggedInId) resyncEmployees().catch(() => {});
        });

        // ===== SECURITY v5: Device Fingerprint =====
        async function getDeviceFingerprint() {
            const raw = [
                navigator.userAgent,
                navigator.language,
                screen.width + 'x' + screen.height,
                new Date().getTimezoneOffset(),
                navigator.hardwareConcurrency || 0
            ].join('|');
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('').slice(0,16);
        }

        async function logDeviceAccess(empId, empName) {
            try {
                const fp = await getDeviceFingerprint();
                const logEntry = {

        const _pendingLocal = {};   // id -> { fields, ts, doneAt, seq }

            const seq = ++_pendSeq;
            const keep = {};
            ['status','lastActionTime','startTime','currentTask','lastActiveDate'].forEach(k => { if (fields[k] !== undefined) keep[k] = fields[k]; });
            _pendingLocal[id] = { fields: keep, ts: Date.now(), doneAt: null, seq };
            return seq;

        function _settlePending(id, seq, result) {
            const p = _pendingLocal[id];
            if (!p || p.seq !== seq) return;           // جاء تغيير أحدث بعده
            if (result && result.ok) { p.doneAt = Date.now(); }
            else { delete _pendingLocal[id]; resyncEmployees().catch(() => {}); } // فشل الحفظ: ارجع لحالة السيرفر الحقيقية
        }
        function _applyPending(freshData) {
            const now = Date.now();
            for (const id in _pendingLocal) {
                const p = _pendingLocal[id], srv = freshData[id];
                const expired = (now - p.ts > 60000) || (p.doneAt && now - p.doneAt > 10000);
                if (!srv || expired) { delete _pendingLocal[id]; continue; }
                const matched = Object.keys(p.fields).every(k => srv[k] === p.fields[k]);
                if (matched) { delete _pendingLocal[id]; continue; }  // السيرفر لحق بنا
                freshData[id] = { ...srv, ...p.fields };               // السيرفر لسا قديم: احتفظ بالمحلي
                if (employeesData[id]) {
                    ['totalBreakMinutes','totalRestMinutes','totalWorkSeconds','hourlyBreaks','slotBreaks','rating'].forEach(k => {

        function _checkWriteRate() {

        // غلاف يعرض أي خطأ على الشاشة ويمنع التعليق الصامت

        function checkAndApplyRatings() {
            let now = Date.now();
            for (let i in employeesData) {
                let d = employeesData[i];
                if (!d.startTime || d.status === 'أوف') continue;
                
                let currentHourIndex = Math.floor((now - d.startTime) / 3600000);
                // احسب فقط دقائق البريك الحالي التي تقع ضمن الساعة الحالية
                let curB = 0;
                if (d.status === 'بريك' && d.lastActionTime) {
                    let breakStartHourIndex = Math.floor((d.lastActionTime - d.startTime) / 3600000);
                    if (breakStartHourIndex === currentHourIndex) {
                        curB = Math.floor((now - d.lastActionTime) / 60000);
                    } else {
                        let currentHourStart = d.startTime + (currentHourIndex * 3600000);
                        curB = Math.floor((now - currentHourStart) / 60000);
                        if (curB < 0) curB = 0;
                    }
                }
                let curR = (d.status === 'راحة' && d.lastActionTime) ? Math.floor((now - d.lastActionTime) / 60000) : 0;
                let totalR = (d.totalRestMinutes || 0) + curR;
                
                let totalViolations = 0;
                let hourlyBreaks = d.hourlyBreaks || {};
                
                for (let h = 0; h < currentHourIndex; h++) {
                    let pastBreak = hourlyBreaks[h] || 0;
                    if (pastBreak > 5) totalViolations += Math.floor((pastBreak - 5) / 60) + 1;
                }
                
                let currentHourBreak = (hourlyBreaks[currentHourIndex] || 0) + curB;
                if (currentHourBreak > 5) totalViolations += Math.floor((currentHourBreak - 5) / 60) + 1;
                if (totalR > 15) totalViolations += Math.floor((totalR - 15) / 60) + 1;
                
                let groupPen = hourlyBreaks.groupPenalty || 0;
                let calcRating = Math.max(0, 100 - (totalViolations * 5) - groupPen);
                // تحديث محلي فقط — بدون كتابة للسيرفر لتجنب إطلاق تحديث لحظي
                employeesData[i].rating = calcRating;
            }

        function backupCurrentDataToHistory(id, force = false) {
            if (isViewingHistory) return;
            // ===== SECURITY: يسمح فقط للمسؤول أو الموظف نفسه بالكتابة =====
            if (loggedInId !== '__admin__' && loggedInId !== id) return;

            // FIX: throttle — لا تكتب أكثر من مرة كل 60 ثانية لكل موظف (إلا عند force)
            const now = Date.now();
            if (!force && backupThrottle[id] && (now - backupThrottle[id]) < 60000) return;
            backupThrottle[id] = now;

            const todayStr = getTodayDateString();
            let d = employeesData[id];
            if (!d) return;

            let startStr = d.status === 'أوف' ? "OFF (Day Off)" : (d.startTime ? new Date(d.startTime).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'}) : "Absent");
            let curB = (d.status === 'بريك' ? Math.floor((now - d.lastActionTime) / 60000) : 0);
            let curR = (d.status === 'راحة' ? Math.floor((now - d.lastActionTime) / 60000) : 0);
            let duration = "-";
            if (d.status === 'أوف') {
                duration = "OFF";
            } else if (d.startTime) {
                // FIX: استخدم totalWorkSeconds الأدق، مع إضافة الجلسة الحالية إن كان Active
                let netSecs = 0;
                let baseSecs = d.totalWorkSeconds || 0;
                if (d.status === 'حضور' && d.lastActionTime) {
                    // أضف الجلسة الحالية
                    let sessionSecs = Math.floor((now - d.lastActionTime) / 1000);
                    netSecs = baseSecs + (sessionSecs > 0 ? sessionSecs : 0);
                } else if (d.status === 'بريك' || d.status === 'راحة') {
                    // متجمد على المتراكم
                    netSecs = baseSecs;
                } else {
                    // خارج العمل — المتراكم هو النهائي
                    netSecs = baseSecs;
                    // fallback إذا لم يُسجَّل totalWorkSeconds
                    if (!netSecs && d.lastActionTime) {
                        let diff = d.lastActionTime - d.startTime;
                        let tBall = (d.totalBreakMinutes || 0) + curB;
                        let tRall = (d.totalRestMinutes || 0) + curR;
                        netSecs = Math.floor(diff / 1000) - (tBall * 60) - (tRall * 60);
                    }
                }
                if (netSecs < 0) netSecs = 0;
                let bh = Math.floor(netSecs / 3600);
                let bm = Math.floor((netSecs % 3600) / 60);
                duration = `${bh}h : ${bm}m`;
            }

            let taskEn = d.currentTask || 'None';

            else if (taskEn === 'لا يوجد') taskEn = 'None';

            // احفظ totalWorkSeconds الفعلي في النسخة الاحتياطية
            let backupWorkSecs = 0;
            if (d.startTime && d.status !== 'أوف') {
                let baseSecs2 = d.totalWorkSeconds || 0;
                if (d.status === 'حضور' && d.lastActionTime) {
                    let sessionSecs2 = Math.floor((now - d.lastActionTime) / 1000);
                    backupWorkSecs = baseSecs2 + (sessionSecs2 > 0 ? sessionSecs2 : 0);
                } else {
                    backupWorkSecs = baseSecs2;
                }
                if (backupWorkSecs < 0) backupWorkSecs = 0;
            }

            const historyPayload = {
                name: d.name,
                startTimeStr: startStr,
                totalDurationStr: duration,
                currentTask: taskEn,
                totalBreakMinutes: (d.totalBreakMinutes || 0) + curB,
                totalRestMinutes: (d.totalRestMinutes || 0) + curR,
                totalWorkSeconds: backupWorkSecs,
                rating: d.rating !== undefined ? d.rating : 100,
                monthlyRating: d.monthlyRating !== undefined ? d.monthlyRating : 100
            };

            saveHistoryRow(todayStr, id, historyPayload);

        window.endOfDay = async () => {

            if (loggedInId !== '__admin__') { alert("🔒 هذه العملية متاحة للمسؤول فقط!"); return; }

            for (let id in employeesData) {
                let d = employeesData[id];
                if (d.status === 'خارج العمل' || d.status === 'أوف') continue;

                // احسب البريك/الراحة الحالية قبل الإغلاق
                let curB = (d.status === 'بريك' && d.lastActionTime) ? Math.floor((now - d.lastActionTime) / 60000) : 0;
                let curR = (d.status === 'راحة' && d.lastActionTime) ? Math.floor((now - d.lastActionTime) / 60000) : 0;
                let currentHourIndex = d.startTime ? Math.floor((now - d.startTime) / 3600000) : 0;
                let hourlyBreaks = d.hourlyBreaks || {};
                if (curB > 0) {
                    hourlyBreaks[currentHourIndex] = (hourlyBreaks[currentHourIndex] || 0) + curB;
                    closeUpdates[`employees/${id}/totalBreakMinutes`] = (d.totalBreakMinutes || 0) + curB;
                    closeUpdates[`employees/${id}/hourlyBreaks`] = hourlyBreaks;

                closeUpdates[`employees/${id}/status`] = 'خارج العمل';
                closeUpdates[`employees/${id}/currentTask`] = 'لا يوجد';
                closeUpdates[`employees/${id}/lastActionTime`] = null;
            }

            // طبّق الإغلاق أولاً
            await applyEmployeePathUpdates(closeUpdates);

            // 2. احفظ تقرير كامل لكل موظف في history
            const freshData = await fetchEmployeesMap();

            let historyUpdates = {};
            for (let id in freshData) {

                let startStr = d.status === 'أوف' ? "OFF" : (d.startTime ? new Date(d.startTime).toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'}) : "Absent");

                } else if (d.startTime) {

                    let tBfinal = d.totalBreakMinutes || 0;
                    let tRfinal = d.totalRestMinutes || 0;
                    let diff = now - d.startTime;
                    let netSecs = Math.floor(diff / 1000) - (tBfinal * 60) - (tRfinal * 60);
                    // إذا كان totalWorkSeconds محفوظاً وأكبر → خذ الأكبر (تفادياً لأي فقد)
                    if (d.totalWorkSeconds && d.totalWorkSeconds > netSecs) {
                        netSecs = d.totalWorkSeconds;
                    }
                    if (netSecs < 0) netSecs = 0;
                    finalWorkSeconds = netSecs;

        function _loadScript(src) {
            return new Promise((res, rej) => {
                const el = document.createElement('script');
                el.src = src; el.onload = res; el.onerror = () => rej(new Error('تعذر تحميل ' + src));
                document.head.appendChild(el);
            });
        }
        let _pdfLibsPromise = null;
        function loadPdfLibs() {
            if (!_pdfLibsPromise) {
                _pdfLibsPromise = _loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
                    .then(() => _loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js'))
                    .catch(e => { _pdfLibsPromise = null; throw e; });
            }
            return _pdfLibsPromise;
        }

        window.updateStatus = async (id, status) => {
            // ===== SECURITY: السماح بحالات معروفة فقط وموظف موجود فقط =====
            if (!['حضور','بريك','راحة','أوف','خارج العمل'].includes(status)) return;
            if (!employeesData[id]) return;
            // ===== SECURITY: منع الموظف من التحكم ببطاقة موظف آخر =====
            const isAdmin = (loggedInId === '__admin__');
            const isMe = (id === loggedInId);
            if (!isAdmin && !isMe) {
                alert("🔒 لا يمكنك التحكم ببطاقة موظف آخر!");
                return;
            }
            let d = employeesData[id], now = Date.now(), today = getTodayDateString();

            // ===== قاعدة الموقع: تسجيل الحضور فقط ضمن 1 كم من موقع العمل (المسؤول مستثنى) =====
            const isRealCheckIn = (status === 'حضور') && (d.status === 'خارج العمل' || d.status === 'أوف' || !d.startTime);
            if (!isAdmin && isRealCheckIn) {
                const loc = await verifyWorkLocation();
                if (!loc.ok) { alert('📍 ' + loc.msg); return; }
            }

            // ===== قاعدة البريك الجماعي: بريك واحد فقط في المجموعة في نفس الوقت =====
            let groupPenalty = 0;
            if (status === 'بريك' && d.status !== 'بريك' && !isAdmin) {
                const mate = getMateOnBreak(id);
                if (mate) {
                    if (BLOCK_BREAK_IF_GROUP_BUSY) {
                        alert('⛔ لا يمكنك أخذ بريك الآن: الزميل ' + mate.name + ' في بريك حالياً. انتظر حتى يعود.');
                        return;
                    }
                    groupPenalty = GROUP_BREAK_PENALTY_POINTS;
                    alert('⚠️ الزميل ' + mate.name + ' في بريك حالياً — سيتم خصم ' + groupPenalty + ' من تقييمك.');
                }
            }
            // بريك/راحة يتطلب أن يكون الموظف في حالة حضور (وإلا يصبح startTime فارغاً ويتعلق العداد)
            if ((status === 'بريك' || status === 'راحة') && !d.startTime) {
                alert('⚠️ يجب تسجيل Check-In أولاً قبل أخذ ' + (status === 'بريك' ? 'بريك' : 'راحة') + '.');
                return;
            }
            if ((status === 'بريك' || status === 'راحة') && (d.status === 'خارج العمل' || d.status === 'أوف')) {
                alert('⚠️ يجب تسجيل Check-In أولاً.');
                return;
            }
            const SLOT_MS = 5 * 60 * 1000;
            let currentHourIndex = d.startTime ? Math.floor((now - d.startTime) / 3600000) : 0;
            let currentSlotIndex = d.startTime ? Math.floor((now - d.startTime) / SLOT_MS) : 0;
            let hourlyBreaks = JSON.parse(JSON.stringify(d.hourlyBreaks || {}));
            let slotBreaks = JSON.parse(JSON.stringify(d.slotBreaks || {}));
            // دائماً ابدأ من القيم المحفوظة لضمان عدم فقدانها
            let totalBreakMinutes = d.totalBreakMinutes || 0;
            let totalRestMinutes = d.totalRestMinutes || 0;

            // احسب وقت العمل المتراكم حتى الآن قبل أي تغيير في الحالة
            let totalWorkSeconds = d.totalWorkSeconds || 0;
            if (d.status === 'حضور' && d.lastActionTime) {
                let sessionSecs = Math.floor((now - d.lastActionTime) / 1000);
                if (sessionSecs > 0) totalWorkSeconds += sessionSecs;
            }

            // إذا كان الموظف في بريك أو راحة، احسب الوقت المنقضي وأضفه
            if (d.lastActionTime && (d.status === 'بريك' || d.status === 'راحة')) {
                let elapsed = Math.floor((now - d.lastActionTime) / 60000);
                if (d.status === 'بريك') {
                    totalBreakMinutes += elapsed;
                    hourlyBreaks[currentHourIndex] = (hourlyBreaks[currentHourIndex] || 0) + elapsed;
                    // حفظ البريك في slotBreaks بالثواني — البريك قد يمتد عبر عدة slots
                    let cursor = d.lastActionTime;
                    let sIdx = d.startTime ? Math.floor((cursor - d.startTime) / SLOT_MS) : 0;
                    while (cursor < now) {
                        let slotEnd = d.startTime + ((sIdx + 1) * SLOT_MS);
                        let segEnd = Math.min(now, slotEnd);
                        let segSec = Math.floor((segEnd - cursor) / 1000);
                        if (segSec > 0) slotBreaks[sIdx] = (slotBreaks[sIdx] || 0) + segSec;
                        cursor = slotEnd;
                        sIdx++;
                    }
                } else if (d.status === 'راحة') {
                    totalRestMinutes += elapsed;
                }
            }

            if (groupPenalty) hourlyBreaks.groupPenalty = (hourlyBreaks.groupPenalty || 0) + groupPenalty;
            // دائماً ضع القيم المحسوبة في الـ updates لضمان عدم فقدانها في السيرفر
            let updates = {
                status: status,
                lastActiveDate: today,
                totalBreakMinutes: totalBreakMinutes,
                totalRestMinutes: totalRestMinutes,
                totalWorkSeconds: totalWorkSeconds,
                hourlyBreaks: hourlyBreaks,
                slotBreaks: slotBreaks
            };

            if (status === 'حضور') {
                // عند Check-In: احتفظ بالبريك والراحة المتراكمة ولا تصفّرها أبداً
                if (d.status === 'خارج العمل' || d.status === 'أوف' || !d.startTime) {
                    updates.startTime = now;
                    updates.rating = 100;
                    // لا تصفّر currentTask — يبقى كما هو
                    // لا تصفّر totalWorkSeconds — فقط نهاية الدوام تصفّر
                }
                updates.lastActionTime = now;
            } else if (status === 'بريك' || status === 'راحة') {
                updates.lastActionTime = now;
            } else if (status === 'أوف') {
                updates.startTime = now; updates.rating = 100; updates.currentTask = 'OFF';
                updates.lastActionTime = null;
                // لا تصفّر Break/Rest/Work — فقط نهاية الدوام تصفّر
            } else if (status === 'خارج العمل') {
                updates.currentTask = 'None'; updates.lastActionTime = null;
                setTimeout(() => { backupCurrentDataToHistory(id); }, 500);
            }
            // تحديث محلي فوري مع قفل لمنع التحديث اللحظي من التدخل
            const _seq = _markPending(id, updates);
            employeesData[id] = { ...employeesData[id], ...updates };
            checkAndApplyRatings();
            updates.rating = employeesData[id].rating;
            render();
            safeUpdateEmployee(id, updates).then((res) => {
                console.log('[Save]', id, status, res);
                _settlePending(id, _seq, res);
                if (res && res.ok) backupCurrentDataToHistory(id);
            });
        };

        window.setTask = async (id, taskName) => {
            // ===== SECURITY: السماح بمهام معروفة فقط =====
            if (!['واتساب','توزيع','قبول'].includes(taskName)) return;
            if (!employeesData[id]) return;
            // ===== SECURITY: منع الموظف من التحكم ببطاقة موظف آخر =====
            const isAdmin = (loggedInId === '__admin__');
            const isMe = (id === loggedInId);
            if (!isAdmin && !isMe) {
                alert("🔒 لا يمكنك التحكم ببطاقة موظف آخر!");
                return;
            }
            // تحديث محلي فوري
            const _seq = _markPending(id, { currentTask: taskName });
            employeesData[id] = { ...employeesData[id], currentTask: taskName };
            render();
            safeUpdateEmployee(id, { currentTask: taskName }).then((res) => {
                _settlePending(id, _seq, res);
                if (res && res.ok) backupCurrentDataToHistory(id);
            });
        };

        // عداد الخمول مُعطَّل — لأن الشاشة مشتركة بين جميع الموظفين
        // تفعيله سيحوّل كل الموظفين للبريك بسبب حركة شخص واحد فقط
        // function resetIdleTimer() { ... }

        function render() {

                    let tB = d.totalBreakMinutes || 0;
                    let tR = d.totalRestMinutes || 0;
                    let netSecs = Math.floor((now - d.startTime) / 1000) - (tB * 60) - (tR * 60);
                    if (netSecs < 0) netSecs = 0;
                    let th = Math.floor(netSecs / 3600);
                    let tm = Math.floor((netSecs % 3600) / 60);
                    let ts = (netSecs % 60).toString().padStart(2, '0');
                    totalTimerHtml = `${th}h:${tm}m:${ts}s`;
                } else if (d.startTime && (d.status === 'بريك' || d.status === 'راحة')) {
                    // متجمد — اعرض totalWorkSeconds فقط (لا تضف الجلسة الحالية)
                    let netSecs = d.totalWorkSeconds || 0;
                    if (netSecs < 0) netSecs = 0;
                    let th = Math.floor(netSecs / 3600);
                    let tm = Math.floor((netSecs % 3600) / 60);

                } else if (d.startTime && d.status === 'خارج العمل') {

                    let netSecs = d.totalWorkSeconds || 0;

                    let th = Math.floor(netSecs / 3600);

                let stateClass = ''; 
                if (d.status === 'بريك') stateClass = 'break-active'; 
                else if (d.status === 'راحة') stateClass = 'rest-active';
                else if (d.status === 'حضور') stateClass = 'attendance-active';
                else if (d.status === 'أوف') stateClass = 'off-active';

                // إبراز بطاقة الموظف المسجل (مسؤول يرى الكل بدون تمييز)
                let myCard = (i === loggedInId) ? 'my-card-highlight' : '';
                let myBadge = (i === loggedInId) ? `<span class="text-xs bg-green-100 text-green-700 font-black px-2 py-1 rounded-lg border border-green-300 ml-2">أنت</span>` : '';
                
                let currentHourIndex = d.startTime ? Math.floor((now - d.startTime) / 3600000) : 0;
                let hourlyBreaks = d.hourlyBreaks || {};
                // احسب فقط دقائق البريك الحالي التي تقع ضمن الساعة الحالية
                let cB = 0;
                if (d.status === 'بريك' && d.lastActionTime) {
                    let breakStartHourIndex = d.startTime ? Math.floor((d.lastActionTime - d.startTime) / 3600000) : 0;
                    if (breakStartHourIndex === currentHourIndex) {
                        // البريك بدأ في نفس الساعة الحالية — احسب كل المدة
                        cB = Math.floor((now - d.lastActionTime) / 60000);
                    } else {
                        // البريك بدأ في ساعة سابقة — الجزء الحالي فقط هو من بداية الساعة الحالية
                        let currentHourStart = d.startTime + (currentHourIndex * 3600000);
                        cB = Math.floor((now - currentHourStart) / 60000);
                        if (cB < 0) cB = 0;
                    }
                }
                let activeHourBreakTotal = (hourlyBreaks[currentHourIndex] || 0) + cB;
                // لا نعرض عداد البريك الساعي لموظف خارج العمل أو في يوم OFF (كانت تظهر بقايا قديمة)
                if (d.status === 'خارج العمل' || d.status === 'أوف') activeHourBreakTotal = 0;
                
                let cR = (d.status === 'راحة') ? Math.floor((now - d.lastActionTime) / 60000) : 0;
                let accR = (d.totalRestMinutes || 0) + cR;

                let currentStatusDisplay = d.status;
                if(d.status === 'حضور') currentStatusDisplay = 'Active';
                else if(d.status === 'بريك') currentStatusDisplay = 'Break';
                else if(d.status === 'راحة') currentStatusDisplay = 'Rest';
                else if(d.status === 'أوف') currentStatusDisplay = 'OFF';
                else if(d.status === 'خارج العمل') currentStatusDisplay = 'Out of Office';

                let taskDisplay = d.currentTask || 'None';
                if(d.currentTask === 'واتساب') taskDisplay = 'WhatsApp';
                else if(d.currentTask === 'توزيع') taskDisplay = 'Dispatcher';
                else if(d.currentTask === 'قبول') taskDisplay = 'Accepting';
                else if(d.currentTask === 'لا يوجد') taskDisplay = 'None';

                // ===== SECURITY: إخفاء الأزرار عن بطاقات الموظفين الآخرين =====
                const isAdmin = (loggedInId === '__admin__');
                const canControl = isAdmin || (i === loggedInId);
                const escId = sanitize(String(i).replace(/\\/g, '\\\\').replace(/'/g, "\\'")); // إفلات JS ثم HTML لمنع XSS في onclick

                const taskButtonsHtml = canControl ? `

                        <div class="grid grid-cols-3 gap-2 mb-5">
                            <button onclick="window.setTask('${escId}', 'واتساب')" class="task-btn ${d.currentTask === 'واتساب' ? 'active' : ''}">💬 WhatsApp</button>
                            <button onclick="window.setTask('${escId}', 'توزيع')" class="task-btn ${d.currentTask === 'توزيع' ? 'active' : ''}">🚴 Dispatcher</button>

                            <button onclick="window.updateStatus('${escId}', 'راحة')" class="btn-opt ${d.status === 'راحة' ? 'bg-orange-200 border-orange-400 font-black' : ''} text-black">Rest (15m)</button>
                            <button onclick="window.updateStatus('${escId}', 'حضور')" class="btn-opt ${d.status === 'حضور' ? 'bg-green-200 border-green-500 font-black' : ''} text-black">Check-In</button>
                            <button onclick="window.updateStatus('${escId}', 'أوف')" class="btn-opt ${d.status === 'أوف' ? 'bg-blue-200 border-blue-500 font-black' : ''} text-black">OFF Day</button>
                            <button onclick="window.updateStatus('${escId}', 'خارج العمل')" class="btn-opt hover:bg-red-100 text-black col-span-2">Check-Out</button>

                h += `<div class="card-box ${stateClass} ${myCard}">

                        <div class="flex justify-between text-xs font-bold text-gray-500 mb-4 border-b border-green-200 pb-2">
                            <span>Break This Hour: <b id="hourbreak-${sanitize(i)}" class="${activeHourBreakTotal > 5 ? 'text-red-600' : 'text-black'}">${activeHourBreakTotal} / 5 min</b></span>
                            <span>Available Rest: <b id="accrest-${sanitize(i)}" class="${accR > 15 ? 'text-red-600': 'text-black'}">${accR} / 15 m</b></span>

                            <span>Status: <b class="text-green-600">${sanitize(currentStatusDisplay)}</b></span>

                        ${taskButtonsHtml}
                    </div>`;
            }
            document.getElementById('app').innerHTML = h;
        }
        
        // ===== معالجة لقطة بيانات الموظفين (تُستدعى من Realtime ومن المزامنة الدورية) =====
        function handleEmployeesSnapshot(freshData) {
            const today = getTodayDateString();

            // صفّر أي موظف حالته بريك/راحة/حضور من يوم سابق
            for (let id in freshData) {
                const d = freshData[id];
                if (!['بريك', 'راحة', 'حضور'].includes(d.status)) continue;
                
                // تحقق من التاريخ عبر lastActiveDate أو lastActionTime أو startTime
                const _localDate = t => { const x = new Date(t); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
                const lastDate = d.lastActiveDate ||
                    (d.lastActionTime ? _localDate(d.lastActionTime) : null) ||
                    (d.startTime ? _localDate(d.startTime) : null);
                
                if (lastDate !== today) {
                    freshData[id] = { 
                        ...d, 
                        status: 'خارج العمل', 
                        lastActionTime: null, 
                        startTime: null, 
                        lastActiveDate: today
                    };
                    safeUpdateEmployee(id, { 
                        status: 'خارج العمل', 
                        lastActionTime: null, 
                        startTime: null, 
                        lastActiveDate: today
                    });
                }
            }

            // احتفظ بالحالة المحلية للموظف المسجل إذا كان هناك lock
            {
                _applyPending(freshData);
                // حافظ على أعلى قيمة لـ totalBreakMinutes و totalRestMinutes لكل موظف
                // لمنع إرجاع قيمة قديمة أقل بسبب تأخر الشبكة
                for (let id in freshData) {
                    const oldD = employeesData[id];
                    // لا نحمي القيم الأعلى إذا بدأ يوم جديد (startTime تغيّر) أو صُفّر الموظف — وإلا لا يعود العداد للصفر أبداً
                    const sameDay = oldD && oldD.startTime && freshData[id].startTime === oldD.startTime;
                    if (oldD && sameDay) {
                        if ((oldD.totalBreakMinutes || 0) > (freshData[id].totalBreakMinutes || 0)) {
                            freshData[id].totalBreakMinutes = oldD.totalBreakMinutes;
                        }
                        if ((oldD.totalRestMinutes || 0) > (freshData[id].totalRestMinutes || 0)) {
                            freshData[id].totalRestMinutes = oldD.totalRestMinutes;
                        }
                        if ((oldD.totalWorkSeconds || 0) > (freshData[id].totalWorkSeconds || 0)) {
                            freshData[id].totalWorkSeconds = oldD.totalWorkSeconds;
                        }
                    }
                }
                employeesData = freshData;
            }
            if (loggedInId) render();
        }
        
        // تحديث عداد Total Hours كل ثانية بدون إعادة بناء كل الكروت
        function updateTimers() {
            if (!loggedInId) return;
            const now = Date.now();
            for (let i in employeesData) {
                const d = employeesData[i];
                const timerEl = document.getElementById('timer-' + i);
                if (!timerEl) continue;

                if (d.status === 'حضور' && d.startTime && d.lastActionTime) {
                    // عداد حي — يحسب من startTime ناقص كل البريك والراحة المتراكمة
                    let tB = d.totalBreakMinutes || 0;
                    let tR = d.totalRestMinutes || 0;
                    let netSecs = Math.floor((now - d.startTime) / 1000) - (tB * 60) - (tR * 60);
                    if (netSecs < 0) netSecs = 0;
                    let th = Math.floor(netSecs / 3600);
                    let tm = Math.floor((netSecs % 3600) / 60);
                    let ts = (netSecs % 60).toString().padStart(2, '0');
                    timerEl.textContent = `${th}h:${tm}m:${ts}s`;

                } else if (d.status === 'خارج العمل' && d.startTime) {
                    // عرض ثابت — استخدم totalWorkSeconds المحفوظ لأن lastActionTime=null بعد Check-Out
                    let netSecs = d.totalWorkSeconds || 0;
                    if (!netSecs && d.startTime) {
                        // fallback: احسب من startTime ناقص البريك
                        let tBf = d.totalBreakMinutes || 0;
                        let tRf = d.totalRestMinutes || 0;
                        netSecs = Math.floor((now - d.startTime) / 1000) - (tBf * 60) - (tRf * 60);
                    }
                    if (netSecs < 0) netSecs = 0;
                    let th = Math.floor(netSecs / 3600);
                    let tm = Math.floor((netSecs % 3600) / 60);
                    timerEl.textContent = `${th}h:${tm}m`;

                } else if ((d.status === 'بريك' || d.status === 'راحة') && d.startTime) {
                    // متجمد — اعرض ساعات العمل المتراكمة فقط (totalWorkSeconds) بدون إضافة الجلسة الحالية
                    let netSecs = d.totalWorkSeconds || 0;
                    if (netSecs < 0) netSecs = 0;
                    let th = Math.floor(netSecs / 3600);
                    let tm = Math.floor((netSecs % 3600) / 60);
                    timerEl.textContent = `${th}h:${tm}m`;

                } else {
                    timerEl.textContent = '';
                }

                // تحديث عداد البريك الساعي (كل ساعة = 5 دقائق مسموح)
                const hourBreakEl = document.getElementById('hourbreak-' + i);
                const accRestEl = document.getElementById('accrest-' + i);
                if (hourBreakEl && (d.startTime || d.lastActionTime) && d.status !== 'خارج العمل' && d.status !== 'أوف') {
                    // رقم الساعة الحالية من وقت Check-In
                    const HOUR_MS = 60 * 60 * 1000;
                    const _base = d.startTime || d.lastActionTime;
                    let currentHourIdx = Math.floor((now - _base) / HOUR_MS);
                    let currentHourStart = _base + (currentHourIdx * HOUR_MS);

                    // احسب كم ثانية أخذ البريك في هذه الساعة فقط
                    let hourBreakSec = 0;

                    // البريك الجاري الآن — فقط الجزء الواقع في الساعة الحالية
                    if (d.status === 'بريك' && d.lastActionTime) {
                        let breakStart = Math.max(d.lastActionTime, currentHourStart);
                        let liveMs = now - breakStart;
                        if (liveMs > 0) hourBreakSec += Math.floor(liveMs / 1000);
                    }

                    // أضف البريك المحفوظ في hourlyBreaks لهذه الساعة (بالدقائق → ثواني)
                    let hourlyBreaks = d.hourlyBreaks || {};
                    hourBreakSec += (hourlyBreaks[currentHourIdx] || 0) * 60;

                    // عرض mm:ss
                    let dispMin = Math.floor(hourBreakSec / 60);
                    let dispSec = (hourBreakSec % 60).toString().padStart(2, '0');

                    // الوقت المتبقي لنهاية الساعة الحالية
                    let hourEndMs = currentHourStart + HOUR_MS;
                    let remainSec = Math.ceil((hourEndMs - now) / 1000);
                    if (remainSec < 0) remainSec = 0;
                    let remMin = Math.floor(remainSec / 60);
                    let remSec = (remainSec % 60).toString().padStart(2, '0');

                    hourBreakEl.textContent = `${dispMin}:${dispSec} / 5m  (resets in ${remMin}:${remSec})`;
                    hourBreakEl.className = hourBreakSec >= 300 ? 'text-red-600' : 'text-black';
                }
                if (accRestEl) {
                    let cR = (d.status === 'راحة' && d.lastActionTime) ? Math.floor((now - d.lastActionTime) / 60000) : 0;
                    let accR = (d.totalRestMinutes || 0) + cR;
                    accRestEl.textContent = `${accR} / 15 m`;
                    accRestEl.className = accR > 15 ? 'text-red-600' : 'text-black';
                }
            }
        }

        // تحديث العداد كل ثانية فقط
        setInterval(() => {
            if (!loggedInId) return;
            updateTimers();
            updateAdminTableTimers();
        }, 1000);

        // backup والـ cron كل 10 ثواني — لا حاجة لإرسالها كل ثانية
        setInterval(() => {
            if (!loggedInId) return;
            checkAutoResetCron();
            if (!isViewingHistory) {
                for (let id in employeesData) {
                    if (employeesData[id].startTime && employeesData[id].status !== 'خارج العمل') {
                        backupCurrentDataToHistory(id, false);
                    }
                }
            }
        }, 10000);

        // حساب الـ rating محلياً كل دقيقة بدون كتابة للسيرفر
        setInterval(() => {
            if (!loggedInId) return;
            checkAndApplyRatings();
        }, 60000);

        console.log('%c[Alsaree3 v6] البيانات كلها على Supabase (محمية بـ RLS)', 'color:#16a34a;font-weight:bold');
    </script>
